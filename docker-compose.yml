services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_DB: ttest
      POSTGRES_USER: ttest
      POSTGRES_PASSWORD: ttest
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttest -d ttest"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ttest-minio
      MINIO_ROOT_PASSWORD: ttest-minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:aead63c77f9db9107f1696fb08ecb0faeda23729cde94b0f663edf4fe09728e3
    depends_on:
      minio: { condition: service_started }
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 ttest-minio ttest-minio-secret; do
          sleep 2
        done
        mc mb --ignore-existing local/ttest-media
        mc anonymous set none local/ttest-media

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ["1025:1025", "8025:8025"]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://ttest:ttest@postgres:5432/ttest
      JWT_SECRET: development-only-change-me-32-characters
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_BUCKET: ttest-media
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ttest-minio
      S3_SECRET_KEY: ttest-minio-secret
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      FRONTEND_APP_URL: http://localhost:5173
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:4174,https://antony502189-max.github.io
      AUTO_PUBLISH_LISTINGS: "true"
      EXTERNAL_IMPORT_ENABLED: "${EXTERNAL_IMPORT_ENABLED:-1}"
      EXTERNAL_IMPORT_INTERVAL_SECONDS: "${EXTERNAL_IMPORT_INTERVAL_SECONDS:-7200}"
      EXTERNAL_IMPORT_RUN_ON_START: "${EXTERNAL_IMPORT_RUN_ON_START:-1}"
      EXTERNAL_IMPORT_SOURCES: "${EXTERNAL_IMPORT_SOURCES:-idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain}"
      EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES: "${EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES:-1}"
      EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: "${EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS:-25}"
      EXTERNAL_IMPORT_MAX_CONCURRENCY_PER_SOURCE: "${EXTERNAL_IMPORT_MAX_CONCURRENCY_PER_SOURCE:-3}"
      EXTERNAL_IMPORT_DOWNLOAD_IMAGES: "${EXTERNAL_IMPORT_DOWNLOAD_IMAGES:-1}"
      EXTERNAL_IMPORT_USER_AGENT: "${EXTERNAL_IMPORT_USER_AGENT:-112233.es room aggregator}"
      EXTERNAL_IMPORT_PLAYWRIGHT_ENABLED: "${EXTERNAL_IMPORT_PLAYWRIGHT_ENABLED:-1}"
      EXTERNAL_REMOVAL_CHECK_ENABLED: "${EXTERNAL_REMOVAL_CHECK_ENABLED:-1}"
      EXTERNAL_REMOVAL_CHECK_INTERVAL_SECONDS: "${EXTERNAL_REMOVAL_CHECK_INTERVAL_SECONDS:-900}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-environment
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  mail-worker:
    build: ./backend
    command: ["python", "-m", "app.commands.outbox_worker"]
    environment: *backend-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

  external-listings-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.external_listings", "--loop"]
    environment: *backend-environment
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.external_listings", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  seed:
    build: ./backend
    profiles: ["tools"]
    command: ["python", "-m", "app.commands.seed"]
    environment: *backend-environment
    depends_on:
      migrate: { condition: service_completed_successfully }

  db-backup:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    profiles: ["tools"]
    environment:
      PGPASSWORD: ttest
    volumes: ["./backups:/backups"]
    command: >-
      sh -ec 'mkdir -p /backups && pg_dump -h postgres -U ttest -d ttest
      --format=custom --file=/backups/ttest-$$(date +%Y%m%d-%H%M%S).dump'
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
