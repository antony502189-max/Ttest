name: Onboarding test isolation patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/onboarding-test-isolation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/onboarding-refresh-test-contracts
          fetch-depth: 0
          persist-credentials: false

      - name: Correct test isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/acceptance-flows.spec.ts')
          text = path.read_text()
          old = '''test("28–29 mobile navigation and keyboard-only critical path", async ({
            page,
          }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.addInitScript(() => {
              localStorage.setItem("112233:mobile-onboarding:v1", "done");'''
          new = '''test("28–29 mobile navigation and keyboard-only critical path", async ({
            page,
          }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.addInitScript(() => {
              localStorage.setItem("112233:mobile-onboarding:v1", "done:refreshable");'''
          if old not in text:
              raise SystemExit('acceptance init contract not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/final-mobile-delta.spec.ts')
          text = path.read_text()
          old = '''test('DELTA-MOBILE-06 ES, EN and RU persist and never introduce horizontal overflow', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 })
            for (const language of ['es', 'en', 'ru'] as const) {
              await page.goto('/#/')
              await page.evaluate((value) => localStorage.setItem('112233:language:v1', value), language)
              await page.evaluate(() => localStorage.setItem('112233:mobile-onboarding:v1', 'done:refreshable'))
              await page.reload()
              await expect(page.locator('html')).toHaveAttribute('lang', language)
              await expect(page.locator('.m2-onboarding')).toBeVisible()
              const dimensions = await page.evaluate(() => ({
                client: document.documentElement.clientWidth,
                scroll: document.documentElement.scrollWidth,
              }))
              expect(dimensions.scroll).toBeLessThanOrEqual(dimensions.client)
            }
          })'''
          new = '''test('DELTA-MOBILE-06 ES, EN and RU persist and never introduce horizontal overflow', async ({ page }) => {
            const languagePage = await page.context().newPage()
            await languagePage.setViewportSize({ width: 390, height: 844 })
            try {
              for (const language of ['es', 'en', 'ru'] as const) {
                await languagePage.goto('/#/')
                await languagePage.evaluate((value) => {
                  localStorage.setItem('112233:language:v1', value)
                  localStorage.setItem('112233:mobile-onboarding:v1', 'done:refreshable')
                }, language)
                await languagePage.reload()
                await expect(languagePage.locator('html')).toHaveAttribute('lang', language)
                await expect(languagePage.locator('.m2-onboarding')).toBeVisible()
                const dimensions = await languagePage.evaluate(() => ({
                  client: document.documentElement.clientWidth,
                  scroll: document.documentElement.scrollWidth,
                }))
                expect(dimensions.scroll).toBeLessThanOrEqual(dimensions.client)
              }
            } finally {
              await languagePage.close()
            }
          })'''
          if old not in text:
              raise SystemExit('final mobile isolated contract not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/visual-parity.spec.ts')
          text = path.read_text()
          old = '''  await page.evaluate(() => localStorage.setItem('112233:language:v1', 'ru'))
            await page.goto('/#/')
            await page.evaluate(() => localStorage.setItem('112233:mobile-onboarding:v1', 'done:refreshable'))
            await page.reload()
            await expect(page.locator('html')).toHaveAttribute('lang', 'ru')
            await expect(page.getByText('Выберите язык приложения')).toBeVisible()
            await page.getByRole('button', { name: 'Продолжить' }).click()
            await page.getByRole('button', { name: 'Продолжить' }).click()
            await page.getByRole('button', { name: 'Продолжить' }).click()
            await page.getByRole('button', { name: 'Сейчас нет' }).click()
            await expect(page.locator('.m2-home')).toBeVisible()
            await shot(page, 'current-home-ru-390x844')'''
          new = '''  const russianPage = await page.context().newPage()
            await russianPage.setViewportSize({ width: 390, height: 844 })
            await russianPage.addInitScript(() => {
              localStorage.setItem('112233:language:v1', 'ru')
              localStorage.setItem('112233:mobile-onboarding:v1', 'done:refreshable')
            })
            await open(russianPage, '/#/')
            await russianPage.reload()
            await expect(russianPage.locator('html')).toHaveAttribute('lang', 'ru')
            await expect(russianPage.getByText('Выберите язык приложения')).toBeVisible()
            await russianPage.getByRole('button', { name: 'Продолжить' }).click()
            await russianPage.getByRole('button', { name: 'Продолжить' }).click()
            await russianPage.getByRole('button', { name: 'Продолжить' }).click()
            await russianPage.getByRole('button', { name: 'Сейчас нет' }).click()
            await expect(russianPage.locator('.m2-home')).toBeVisible()
            await shot(russianPage, 'current-home-ru-390x844')
            await russianPage.close()'''
          if old not in text:
              raise SystemExit('visual isolated contract not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and self-delete
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm .github/workflows/onboarding-test-isolation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/acceptance-flows.spec.ts tests/final-mobile-delta.spec.ts tests/visual-parity.spec.ts .github/workflows/onboarding-test-isolation-patch.yml
          git commit -m "test: isolate refresh onboarding scenarios"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:fix/onboarding-refresh-test-contracts
