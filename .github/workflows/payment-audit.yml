name: Payment audit

on:
  push:
    branches: [feature/payments-promotions-ads]
  pull_request:
    paths: ['backend/**', 'src/**', 'tests/**', '.github/workflows/payment-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: ttest
          POSTGRES_PASSWORD: ttest
          POSTGRES_DB: ttest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ttest -d ttest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ttest:ttest@127.0.0.1:5432/ttest_test
      TEST_DATABASE_URL: postgresql+asyncpg://ttest:ttest@127.0.0.1:5432/ttest_test
      JWT_SECRET: ci-payment-audit-secret-at-least-32-characters
      REDIS_URL: ''
      STORAGE_BACKEND: local
      MEDIA_ROOT: var/test-media
      AUTO_PUBLISH_LISTINGS: 'true'
      FRONTEND_ORIGINS: http://testserver
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install pinned backend dependencies
        run: python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Apply all migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Install native video regression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Server unit and contract regression tests
        working-directory: backend
        run: pytest -q -m 'not integration' --junitxml=../output/payment-unit.xml
      - name: Real PostgreSQL payment and deletion regression tests
        working-directory: backend
        run: >-
          pytest -q tests/integration/test_payment_audit.py
          tests/integration/test_banner_payment_lifecycle.py
          tests/integration/test_homepage_purchase.py
          tests/integration/test_monthly_top_purchase.py
          tests/integration/test_commercial_advertisements.py
          tests/integration/test_schema_parity.py
          --junitxml=../output/payment-integration.xml
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payment-backend-results
          path: output/*.xml
          if-no-files-found: ignore

  frontend-payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Payment browser regressions
        run: >-
          npx playwright test tests/payment-audit.spec.ts
          tests/advertising-seven-slots.spec.ts tests/commercial-advertising.spec.ts
          tests/homepage-purchase.spec.ts tests/monthly-top-purchase.spec.ts
          tests/homepage-hero-promotion-contract.spec.ts
          tests/owner-promotion-flow.spec.ts tests/promotion-calendar.spec.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payment-browser-results
          path: |
            output/playwright/**
            test-results/**
          if-no-files-found: ignore
