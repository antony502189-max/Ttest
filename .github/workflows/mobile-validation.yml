name: Mobile validation

on:
  push:
    branches:
      - fix/full-mobile-validation-current-location
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    # The complete serial Playwright suite currently contains 160 tests.
    # Keep every mobile/visual gate enabled and give the full suite enough time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout approved visual baselines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: visual-baselines
          path: .visual-baselines
          persist-credentials: false
      - name: Install approved visual baselines
        run: |
          mkdir -p tests/visual-snapshots
          cp -R .visual-baselines/tests/visual-snapshots/. tests/visual-snapshots/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            output/playwright/report
            test-results
          if-no-files-found: ignore
