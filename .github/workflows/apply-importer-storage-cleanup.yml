name: Apply importer storage cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Apply exact importer cleanup patch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          source = Path('backend/app/services/external_import.py')
          text = source.read_text(encoding='utf-8')
          old_import = '''from ..storage import get_storage

logger = logging.getLogger(__name__)
'''
          new_import = '''from ..storage import get_storage
from .storage_deletions import enqueue_storage_deletion

logger = logging.getLogger(__name__)
'''
          old_cleanup = '''                    except (OSError, BotoCoreError, ClientError):
                        logger.exception(
                            "external_image_cleanup_failed",
                            extra={"listing_id": str(listing_id), "image_position": image_position},
                        )
                logger.exception(
'''
          new_cleanup = '''                    except (OSError, BotoCoreError, ClientError):
                        logger.exception(
                            "external_image_cleanup_failed",
                            extra={"listing_id": str(listing_id), "image_position": image_position},
                        )
                        await enqueue_storage_deletion(session, created_storage_key)
                        await session.commit()
                logger.exception(
'''
          if text.count(old_import) != 1 or text.count(old_cleanup) != 1:
              raise SystemExit('expected importer cleanup anchors were not found exactly once')
          source.write_text(text.replace(old_import, new_import).replace(old_cleanup, new_cleanup), encoding='utf-8')

          test_b64 = ''''''
          test_path = Path('backend/tests/integration/test_external_import_storage_cleanup.py')
          if test_path.exists():
              raise SystemExit('cleanup regression test already exists unexpectedly')
          test_path.write_bytes(base64.b64decode(test_b64))
          PY

          changed="$(git diff --name-only)"
          expected=$'backend/app/services/external_import.py\nbackend/tests/integration/test_external_import_storage_cleanup.py'
          test "$changed" = "$expected"
          git diff --check
          python3 -m py_compile \
            backend/app/services/external_import.py \
            backend/tests/integration/test_external_import_storage_cleanup.py

          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)"
          test "$remote_sha" = "$base_sha"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/external_import.py backend/tests/integration/test_external_import_storage_cleanup.py
          git commit -m 'fix: queue failed importer storage cleanup'
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$authenticated_remote" "HEAD:refs/heads/$HEAD_REF"
