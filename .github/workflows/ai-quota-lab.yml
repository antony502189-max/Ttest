name: AI quota disposable PostgreSQL lab

on:
  pull_request:
    paths: ['tools/ai_search_quota_lab/**', '.github/workflows/ai-quota-lab.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: ai_lab
          POSTGRES_PASSWORD: ai_lab
          POSTGRES_DB: ai_quota_lab_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ai_lab -d ai_quota_lab_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AI_QUOTA_LAB_DSN: postgresql://ai_lab:ai_lab@127.0.0.1:5432/ai_quota_lab_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/ai_search_quota_lab/requirements.txt
      - run: python -m pytest -q tools/ai_search_quota_lab --junitxml=output/ai-quota-lab.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-quota-lab-results
          path: output/ai-quota-lab.xml
          if-no-files-found: ignore
