name: Customer map/mobile polish verification

on:
  push:
    branches:
      - fix/customer-map-mobile-polish

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/customer-map-mobile-polish
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply customer UX cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          publish = Path('src/pages/PublishPage.tsx')
          text = publish.read_text()
          old_import = 'import { amenityOptions, areaCenters, createDefaultDraft } from "@/data/listings";'
          new_import = 'import { amenityOptions, createDefaultDraft } from "@/data/listings";'
          if text.count(old_import) != 1:
              raise SystemExit('PublishPage areaCenters import anchor mismatch')
          text = text.replace(old_import, new_import, 1)
          start_anchor = '            <legend>Selecciona un punto aproximado</legend><p>El marcador se centra en la zona. Muévelo ligeramente sin publicar la calle exacta.</p>'
          end_anchor = '            <output aria-live="polite">Coordenadas aproximadas:'
          start = text.find(start_anchor)
          end = text.find(end_anchor, start)
          if start < 0 or end < 0:
              raise SystemExit('PublishPage approximate-location controls anchor mismatch')
          replacement = '''            <legend>Ubicación aproximada</legend>\n            <p>Desplaza el mapa y toca dos veces donde quieras colocar el marcador.</p>\n            <ApproximateLocationMap coordinates={draft.coordinates} onChange={(coordinates) => setDraft((current) => ({ ...current, coordinates, locationManuallyMoved: true }))} />\n'''
          text = text[:start] + replacement + text[end:]
          publish.write_text(text)

          cards = Path('src/mobile-home-mode-cards.css')
          css = cards.read_text()
          replacements = [
              ('  .m2-mode-switch {\n    display: grid;\n', '  .m2-mode-switch {\n    width: 100%;\n    min-width: 0;\n    display: grid;\n    overflow: hidden;\n'),
              ('  .m2-mode-switch > button {\n    position: relative;\n    min-width: 0;\n', '  .m2-mode-switch > button {\n    position: relative;\n    width: 100%;\n    max-width: 100%;\n    min-width: 0;\n    overflow: hidden;\n    box-sizing: border-box;\n'),
              ('    transform: translateY(-3px) scale(1.02);', '    transform: translateY(-2px);'),
              ('  .m2-mode-switch > button > span:last-child {\n    min-width: 0;\n', '  .m2-mode-switch > button > span:last-child {\n    width: 100%;\n    max-width: 100%;\n    min-width: 0;\n'),
              ('    line-height: 1.05;\n    white-space: nowrap;\n', '    line-height: 1.05;\n    white-space: normal;\n    overflow-wrap: anywhere;\n'),
              ('    line-height: 1.2;\n    white-space: nowrap;\n', '    line-height: 1.2;\n    white-space: normal;\n    overflow-wrap: anywhere;\n'),
          ]
          for old, new in replacements:
              if old not in css:
                  raise SystemExit(f'mobile-home-mode-cards anchor missing: {old[:80]!r}')
              css = css.replace(old, new, 1)
          cards.write_text(css)

          align = Path('src/client-mobile-alignment-fixes.css')
          css = align.read_text()
          old = '''  .m2-mode-switch > button:last-child {\n    translate: -4px 0;\n  }\n\n'''
          if css.count(old) != 1:
              raise SystemExit('client mobile mode-card translate anchor mismatch')
          align.write_text(css.replace(old, '', 1))

          i18n = Path('src/contexts/i18n-context.tsx')
          text = i18n.read_text()
          anchor = 'Object.assign(translations, listingTranslations, screenshotLockedTranslations)'
          if text.count(anchor) != 1:
              raise SystemExit('i18n assignment anchor mismatch')
          addition = '''const customerMapTranslations: Record<string, Translation> = {\n  'Ubicación aproximada': { ru: 'Примерное местоположение', en: 'Approximate location' },\n  'Desplaza el mapa y toca dos veces donde quieras colocar el marcador.': { ru: 'Перемещайте карту и дважды коснитесь места, куда нужно поставить маркер.', en: 'Move the map and double-tap where you want to place the marker.' },\n  'Google Maps para mover el punto público aproximado. Desplaza el mapa y toca dos veces para colocar el marcador.': { ru: 'Google Maps для выбора примерной публичной точки. Перемещайте карту и дважды коснитесь места, чтобы поставить маркер.', en: 'Google Maps for choosing the approximate public point. Move the map and double-tap to place the marker.' },\n}\n\n'''
          text = text.replace(anchor, addition + 'Object.assign(translations, listingTranslations, screenshotLockedTranslations, customerMapTranslations)', 1)
          i18n.write_text(text)
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Run customer regression tests
        run: npx playwright test tests/customer-map-mobile-polish.spec.ts tests/home-reference-controls.spec.ts tests/mobile-location-map.spec.ts
      - name: Commit verified patch and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/customer-map-polish-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PublishPage.tsx src/mobile-home-mode-cards.css src/client-mobile-alignment-fixes.css src/contexts/i18n-context.tsx .github/workflows/customer-map-polish-verify.yml
          git commit -m 'fix: simplify publish map and contain mobile mode cards'
          git push origin HEAD:fix/customer-map-mobile-polish
