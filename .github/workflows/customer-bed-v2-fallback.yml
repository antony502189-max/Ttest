name: Apply bed v2 compatibility fallback

on:
  push:
    branches:
      - feature/customer-room-favorites-bed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/customer-room-favorites-bed
          fetch-depth: 0
      - name: Patch compatibility fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          patch(
              'backend/app/repositories/listings.py',
              'bedType=(room_details.bed_type_v2 or room_details.bed_type) if room_details else None,',
              'bedType=(getattr(room_details, "bed_type_v2", None) or room_details.bed_type) if room_details else None,',
          )
          patch(
              'backend/app/services/listings.py',
              'bed_type = effective("bedType", (details.bed_type_v2 or details.bed_type) if details else None)',
              'bed_type = effective("bedType", (getattr(details, "bed_type_v2", None) or details.bed_type) if details else None)',
          )
          Path('.github/workflows/customer-bed-v2-fallback.yml').unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: tolerate legacy room-detail projections"
          git push origin HEAD:feature/customer-room-favorites-bed
