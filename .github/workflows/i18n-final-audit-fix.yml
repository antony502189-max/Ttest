name: I18n final audit fix

on:
  push:
    branches:
      - fix/i18n-language-audit

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/i18n-language-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply i18n patch
        run: python scripts/i18n-final-audit-fix.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify language regressions
        run: npx playwright test tests/i18n-language-regression.spec.ts tests/mobile-search-results.spec.ts tests/mobile-map-ideal.spec.ts --reporter=line
      - name: Commit verified product changes
        run: |
          rm .github/workflows/i18n-final-audit-fix.yml scripts/i18n-final-audit-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/contexts/i18n-context.tsx src/pages/AdminPage.tsx src/pages/SearchPage.tsx src/components/marketplace.tsx src/components/mobile-search-results-v2.tsx src/components/mobile-map-listings-layer.tsx tests/i18n-language-regression.spec.ts .github/workflows/i18n-final-audit-fix.yml scripts/i18n-final-audit-fix.py
          git commit -m 'fix: finish language localization audit'
          git push origin HEAD:fix/i18n-language-audit
