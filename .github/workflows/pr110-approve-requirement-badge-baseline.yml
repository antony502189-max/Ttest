name: PR110 approve requirement badge baseline

on:
  push:
    branches:
      - fix/emphasize-listing-requirement-badges
    paths:
      - .github/workflows/pr110-approve-requirement-badge-baseline.yml

permissions:
  contents: write

concurrency:
  group: pr110-approve-requirement-badge-baseline
  cancel-in-progress: false

jobs:
  approve:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Checkout approved visual baselines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: visual-baselines
          path: .visual-baselines
          persist-credentials: false

      - name: Install approved visual baselines
        run: |
          set -euo pipefail
          mkdir -p tests/visual-snapshots
          cp -R .visual-baselines/tests/visual-snapshots/. tests/visual-snapshots/

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Generate reviewed mobile-results snapshot
        env:
          VITE_ENABLE_MOCK_MODE: '1'
          VITE_GOOGLE_MAPS_TEST_SDK: '1'
        run: npx playwright test tests/visual-parity.spec.ts --update-snapshots

      - name: Commit only the approved mobile-results snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target='tests/visual-snapshots/chromium/current-search-390x844.png'
          test -f "$target"
          cp "$target" /tmp/current-search-390x844.png

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin visual-baselines
          git switch -C visual-baselines origin/visual-baselines

          cp /tmp/current-search-390x844.png "$target"
          git add -f "$target"
          git diff --cached --quiet && exit 0
          git commit -m 'test: approve emphasized mobile requirement badges'

          git config --local credential.helper '!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f'
          trap 'git config --local --unset-all credential.helper || true' EXIT
          git push "https://github.com/${GITHUB_REPOSITORY}.git" visual-baselines
