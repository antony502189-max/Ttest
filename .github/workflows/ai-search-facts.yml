name: AI Search offline facts pipeline

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/ai-search-facts.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-facts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  facts-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: ai_lab
          POSTGRES_PASSWORD: ai_lab
          POSTGRES_DB: ai_facts_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ai_lab -d ai_facts_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ai_lab:ai_lab@127.0.0.1:5432/ai_facts_test_ci
      AI_FACTS_TEST_DATABASE_URL: postgresql+psycopg://ai_lab:ai_lab@127.0.0.1:5432/ai_facts_test_ci
      REDIS_URL: ''
      JWT_SECRET: ci-ai-facts-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
      - run: python -m pip check
      - name: Backend lint and typecheck
        working-directory: backend
        run: |
          ruff check app tests
          mypy app
      - name: Backend unit regressions
        working-directory: backend
        run: pytest -q -m 'not integration' --junitxml=../output/ai-facts-unit.xml
      - name: Complete historical migration chain
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Actual facts migration and PostgreSQL constraints
        run: python -m pytest -q backend/tests/test_ai_listing_facts.py backend/tests/test_ai_fact_resolver.py backend/tests/test_ai_fact_bridge.py backend/tests/test_ai_offline_fact_worker.py backend/tests/ai_facts_pg --junitxml=output/ai-facts-pg.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-search-facts-results
          path: output/*.xml
          if-no-files-found: error
