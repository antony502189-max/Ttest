name: AI Search combined facts quota sessions

on:
  push:
    branches: [main]
  pull_request:
    paths: ['backend/**', '.github/workflows/ai-search-facts.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-facts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  facts-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: ai_lab
          POSTGRES_PASSWORD: ai_lab
          POSTGRES_DB: ttest_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ai_lab -d ttest_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ai_lab:ai_lab@127.0.0.1:5432/ttest_test
      AI_FACTS_TEST_DATABASE_URL: postgresql+psycopg://ai_lab:ai_lab@127.0.0.1:5432/ttest_test
      AI_QUOTA_TEST_DATABASE_URL: postgresql+asyncpg://ai_lab:ai_lab@127.0.0.1:5432/ttest_test
      AI_QUOTA_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      REDIS_URL: ''
      AI_HTTP_BROWSER_TEST: '1'
      JWT_SECRET: ci-ai-facts-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
      - run: python -m pip check
      - name: Backend lint and typecheck
        working-directory: backend
        run: |
          ruff check app tests
          mypy app
      - name: Backend unit regressions
        working-directory: backend
        run: pytest -q -m 'not integration' --junitxml=../output/ai-facts-unit.xml
      - name: Complete historical migration chain
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Actual facts migration and PostgreSQL constraints
        run: python -m pytest -q backend/tests/test_ai_listing_facts.py backend/tests/test_ai_fact_resolver.py backend/tests/test_ai_fact_bridge.py backend/tests/test_ai_offline_fact_worker.py backend/tests/test_ai_hard_facts.py backend/tests/ai_facts_pg backend/tests/test_ai_search_quota.py backend/tests/test_ai_search_intent.py backend/tests/ai_search_pg --junitxml=output/ai-facts-pg.xml
      - name: Existing card query and verified AI paging on full PostGIS schema
        run: python -m pytest -q backend/tests/integration/test_ai_verified_cards.py backend/tests/integration/test_ai_http.py backend/tests/integration/test_ai_saved_searches.py backend/tests/integration/test_ai_saved_review.py backend/tests/integration/test_listing_gallery_cards.py --junitxml=output/ai-verified-cards.xml
      - name: Install isolated Chromium contract runtime
        run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Build isolated browser frontend
        env:
          VITE_ENABLE_MOCK_MODE: '1'
          VITE_GOOGLE_MAPS_TEST_SDK: '1'
          VITE_API_BASE_URL: /api/v1
        run: |
          npm ci
          npm run build
      - name: Real HTTP frontend cookie and lost-ack recovery on PostGIS
        env:
          AI_UI_DIST_PATH: ${{ github.workspace }}/dist
        run: python -m pytest -q backend/tests/integration/test_ai_browser_recovery.py --junitxml=output/ai-real-http-recovery.xml
      - name: Actual browser guest cookie and cross-site boundary
        run: python -m pytest -q backend/tests/ai_http_browser/test_ai_http_browser.py --junitxml=output/ai-http-browser.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-search-facts-results
          path: output/*.xml
          if-no-files-found: error
