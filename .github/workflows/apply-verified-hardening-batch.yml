name: Apply verified hardening batch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Apply reviewed patch and verify scope
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if test -f scripts/check-production-bundle.mjs \
            && grep -Fq 'external_storage_key(owner_id, asset_id)' backend/app/services/external_import.py \
            && ! grep -Fq 'GoogleDemo112233!' src/pages/UnifiedAuthPage.tsx; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/apply-verified-hardening-batch.py
          expected=$(cat <<'EOF'
          .github/workflows/audit-source-snapshot.yml
          .github/workflows/final-audit-temporary.yml
          .github/workflows/production-audit.yml
          Dockerfile
          backend/app/services/external_import.py
          backend/tests/integration/test_external_import_transaction_boundaries.py
          backend/tests/test_external_sources.py
          package.json
          scripts/check-production-bundle.mjs
          scripts/final-audit-local.sh
          src/contexts/mock-app-provider.tsx
          src/pages/UnifiedAuthPage.tsx
          tests/e2e.spec.ts
          EOF
          )
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)"
          git diff --cached --check
          python3 -m compileall -q backend/app backend/tests
          node --check scripts/check-production-bundle.mjs
          bash -n scripts/final-audit-local.sh
          python3 scripts/check-supply-chain.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit non-workflow files
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)"
          test "$remote_sha" = "$base_sha"

          git restore --staged --worktree \
            .github/workflows/audit-source-snapshot.yml \
            .github/workflows/production-audit.yml \
            .github/workflows/final-audit-temporary.yml

          expected=$(cat <<'EOF'
          Dockerfile
          backend/app/services/external_import.py
          backend/tests/integration/test_external_import_transaction_boundaries.py
          backend/tests/test_external_sources.py
          package.json
          scripts/check-production-bundle.mjs
          scripts/final-audit-local.sh
          src/contexts/mock-app-provider.tsx
          src/pages/UnifiedAuthPage.tsx
          tests/e2e.spec.ts
          EOF
          )
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^          //' | sort)"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close re-audited production hardening gaps'

          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$authenticated_remote" "HEAD:refs/heads/$HEAD_REF"
