name: Diagnose mobile map parity

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-mobile-map-parity
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize exact latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply complete map integration
        run: node scripts/apply-ideal-mobile-map.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Diagnose sensitive map connections
        id: diagnostics
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test \
            tests/mobile-map-ideal.spec.ts \
            tests/mobile-map-parity.spec.ts \
            --grep "published listings|save search|search visible area" \
            --workers=1 --reporter=line 2>&1 | tee /tmp/mobile-map-diagnostics.log
      - name: Publish exact diagnostics in issue body
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.diagnostics.outcome }}
        run: |
          {
            echo "# Mobile map diagnostic report"
            echo
            echo "Outcome: **$OUTCOME**"
            echo
            echo "Verified SHA: \`$(git rev-parse HEAD)\`"
            echo
            echo '```text'
            tail -n 180 /tmp/mobile-map-diagnostics.log 2>/dev/null || true
            echo '```'
          } > /tmp/mobile-map-diagnostics.md
          gh issue edit 33 --repo "$GITHUB_REPOSITORY" --body-file /tmp/mobile-map-diagnostics.md
      - name: Require diagnostic tests
        run: test "${{ steps.diagnostics.outcome }}" = success
