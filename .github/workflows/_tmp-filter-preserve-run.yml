name: Temporary filter preservation patch

on:
  push:
    branches:
      - fix/mobile-filter-draft-state
    paths:
      - .github/workflows/_tmp-filter-preserve-run.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/mobile-filter-draft-state
      - run: python scripts/mobile_filter_preserve_patch.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/mobile-search-results-v2.tsx
          git commit -m 'fix: preserve base constraints in mobile filters'
          git push origin HEAD:fix/mobile-filter-draft-state
