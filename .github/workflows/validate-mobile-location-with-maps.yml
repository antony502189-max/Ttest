name: Validate mobile location with Maps

on:
  push:
    branches: [validation/mobile-location-with-maps]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/mobile-location-with-maps
          fetch-depth: 0
      - name: Run validation
        shell: bash
        run: |
          set +e
          mkdir -p docs
          : > /tmp/result.tsv
          : > /tmp/full.log
          check() { name="$1"; shift; "$@" >> /tmp/full.log 2>&1; code=$?; printf '%s\t%s\n' "$name" "$code" >> /tmp/result.tsv; }
          check "npm ci" npm ci
          if grep -q $'npm ci\t0' /tmp/result.tsv; then
            check "playwright install" npx playwright install --with-deps chromium
            check "lint" npm run lint
            check "typecheck" npm run typecheck
            check "build" npm run build
            check "mobile location tests" npm exec playwright test tests/mobile-location-map.spec.ts
          fi
          if awk -F '\t' 'BEGIN{ok=1;seen=0}{seen=1;if($2!=0)ok=0}END{exit !(seen&&ok)}' /tmp/result.tsv; then overall=PASS; else overall=FAIL; fi
          {
            echo '# Mobile location validation with production Maps configuration'
            echo
            echo "Overall: **$overall**"
            echo
            echo '| Check | Result | Exit |'
            echo '|---|---:|---:|'
            while IFS=$'\t' read -r name code; do [ "$code" -eq 0 ] && result=PASS || result=FAIL; printf '| %s | %s | `%s` |\n' "$name" "$result" "$code"; done < /tmp/result.tsv
            echo
            echo '```text'
            tail -n 500 /tmp/full.log
            echo '```'
          } > docs/mobile-location-maps-validation.md
          rm .github/workflows/validate-mobile-location-with-maps.yml
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record mobile location Maps validation" || true
          git push origin HEAD:validation/mobile-location-with-maps
