name: AI Search backend quota

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/ai-search-quota.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-quota-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quota-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: mirror.gcr.io/postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: ai_lab
          POSTGRES_PASSWORD: ai_lab
          POSTGRES_DB: ai_quota_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ai_lab -d ai_quota_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: mirror.gcr.io/library/redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ai_lab:ai_lab@127.0.0.1:5432/ai_quota_test_ci
      AI_QUOTA_TEST_DATABASE_URL: postgresql+asyncpg://ai_lab:ai_lab@127.0.0.1:5432/ai_quota_test_ci
      AI_QUOTA_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: ci-ai-quota-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
      - run: python -m pip check
      - name: Complete migration chain and metadata check
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - run: python -m pytest -q backend/tests/test_ai_search_quota.py backend/tests/ai_search_pg --junitxml=output/ai-search-quota.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-search-quota-results
          path: output/ai-search-quota.xml
          if-no-files-found: ignore
