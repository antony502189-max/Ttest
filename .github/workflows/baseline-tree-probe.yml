name: Baseline tree probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout visual baselines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: visual-baselines
          persist-credentials: false
          fetch-depth: 1
      - name: Print baseline commit and tree
        run: |
          printf 'VISUAL_BASELINE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          printf 'VISUAL_BASELINE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
