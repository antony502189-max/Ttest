name: Update Approved Visual Baselines

on:
  workflow_dispatch:
    inputs:
      visual_review_confirmed:
        description: I manually reviewed every visual change and approve replacing the baseline
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-approved-visual-baselines
  cancel-in-progress: false

jobs:
  update:
    # Baseline replacement is an exceptional owner-only write operation. The
    # boolean acknowledgement alone must never be sufficient for collaborators.
    if: github.actor == github.repository_owner && inputs.visual_review_confirmed == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate candidate snapshots after explicit approval
        env:
          VITE_ENABLE_MOCK_MODE: '1'
          VITE_GOOGLE_MAPS_TEST_SDK: '1'
        run: npx playwright test tests/visual-parity.spec.ts --update-snapshots

      - name: Commit reviewed baseline to dedicated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/visual-baselines
          cp -R tests/visual-snapshots/. /tmp/visual-baselines/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin visual-baselines
          git switch -C visual-baselines origin/visual-baselines
          rm -rf tests/visual-snapshots
          mkdir -p tests/visual-snapshots
          cp -R /tmp/visual-baselines/. tests/visual-snapshots/
          git add -f tests/visual-snapshots
          git diff --cached --quiet && exit 0
          git commit -m 'test: update approved visual baselines'

          # Checkout never stores the workflow token. Expose it only through a
          # temporary credential callback for this single explicit push.
          git config --local credential.helper '!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f'
          trap 'git config --local --unset-all credential.helper || true' EXIT
          git push "https://github.com/${GITHUB_REPOSITORY}.git" visual-baselines

          new_ref="$(git rev-parse HEAD)"
          echo "::notice title=Visual baseline pin update required::Approved baselines are now ${new_ref}. Open a reviewed PR updating .github/visual-baseline-ref to this SHA before CI consumes the new images."
