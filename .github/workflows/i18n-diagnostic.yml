name: I18n diagnostic

on:
  push:
    branches:
      - fix/i18n-language-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Static locale audit
        shell: bash
        run: |
          echo '=== hard-coded es-ES locale usages ==='
          grep -RIn --include='*.ts' --include='*.tsx' "es-ES" src || true
      - name: Runtime i18n diagnostic
        shell: bash
        run: |
          cat > tests/i18n-diagnostic-temp.spec.ts <<'EOF'
          import { test } from '@playwright/test'

          const markers = [
            'Calefacción', 'Sin calefacción', 'Equipamiento y accesibilidad',
            'Adaptada para personas con movilidad reducida', 'Superficie de la habitación',
            'Superficie total de la vivienda', 'Número de habitaciones de la vivienda',
            'Número de baños / cuartos de baño', 'Personas que ya viven en la vivienda',
            'Capacidad total de esta habitación', 'Personas que ya viven en esta habitación',
            'Tipo de cama', 'Número de camas', 'Aseo / WC', 'Ducha',
            'Datos estructurados de la habitación, las plazas y la vivienda.',
            'Habitación privada', 'Habitación completa', 'Plazas / camas',
            'Todos los importes se introducen y se muestran en euros (€).',
            'Gastos de suministros', 'Incluidos en el precio', 'Se pagan aparte',
            'Gastos adicionales aproximados (€/mes)', 'Disponible hasta (opcional)',
            'Condiciones de convivencia', 'Quién vive actualmente en la vivienda',
            'Perfiles admitidos', 'Actualmente viven niños en la vivienda',
            'Se aceptan parejas', 'Se aceptan menores / niños',
            'Habitación y plazas', 'Vivienda y espacios', 'Composición actual',
            'Niños viviendo actualmente', 'Parejas', 'Todas las condiciones están visibles antes del contacto.',
            'Semana', 'Mes', 'Sin fecha final', 'Condición principal',
            'Comprueba esta preferencia visible del anunciante antes de contactar.',
            'Se alquilan plazas individuales', 'Se alquila la habitación completa',
            'Calefacción individual', 'Calefacción central', 'Calefacción no especificada',
            'No indicada como adaptada', 'Adaptada para movilidad reducida',
            'Gastos aparte: aprox.'
          ]

          const publicRoutes = [
            '/#/', '/#/buscar?q=Tenerife&alquiler=long', '/#/acceso', '/#/registro',
            '/#/sobre-nosotros', '/#/como-funciona', '/#/ayuda', '/#/terminos',
            '/#/privacidad', '/#/cookies', '/#/normas-de-publicacion'
          ]

          for (const language of ['ru', 'en'] as const) {
            test(`diagnose residual Spanish UI in ${language}`, async ({ page }) => {
              await page.goto('/#/')
              await page.evaluate((lang) => {
                localStorage.setItem('112233:language:v1', lang)
                localStorage.setItem('112233:session:v1', JSON.stringify('host-demo'))
                localStorage.setItem('112233:mobile-onboarding:v1', 'done')
              }, language)

              const routes = [...publicRoutes, '/#/publicar', '/#/perfil', '/#/mis-anuncios', '/#/favoritos', '/#/mensajes', '/#/menu']
              const reports: Array<{ route: string; hits: string[] }> = []
              for (const route of routes) {
                await page.goto(route)
                await page.waitForTimeout(250)
                const text = await page.locator('body').innerText()
                const hits = markers.filter((marker) => text.includes(marker))
                if (hits.length) reports.push({ route, hits })
              }

              await page.goto('/#/buscar?q=Tenerife&alquiler=long')
              const detailHref = await page.locator('a[href*="/habitacion/"]').first().getAttribute('href').catch(() => null)
              if (detailHref) {
                await page.goto(detailHref.startsWith('#') ? `/${detailHref}` : detailHref)
                await page.waitForTimeout(250)
                const text = await page.locator('body').innerText()
                const hits = markers.filter((marker) => text.includes(marker))
                if (hits.length) reports.push({ route: 'listing-detail', hits })
              }

              console.log(`I18N_DIAGNOSTIC_${language.toUpperCase()}=${JSON.stringify(reports)}`)
            })
          }
          EOF
          npx playwright test tests/i18n-diagnostic-temp.spec.ts --reporter=line
          rm tests/i18n-diagnostic-temp.spec.ts
