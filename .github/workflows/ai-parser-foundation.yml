name: AI parser data foundation

on:
  pull_request:
    branches: [main, planning/ai-voice-search-architecture]
    paths:
      - 'backend/**'
      - '.github/workflows/ai-parser-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-parser-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ttest:ttest@127.0.0.1:5432/ttest_test
      TEST_DATABASE_URL: postgresql+asyncpg://ttest:ttest@127.0.0.1:5432/ttest_test
      JWT_SECRET: ci-parser-fixture-secret-with-at-least-32-characters
      EMAIL_VERIFICATION_HMAC_SECRET: ci-parser-independent-email-secret-32-plus-characters
      FRONTEND_ORIGINS: http://testserver
      FRONTEND_APP_URL: http://testserver
      AUTO_PUBLISH_LISTINGS: 'true'
      REDIS_URL: ''
      STORAGE_BACKEND: local
      MEDIA_ROOT: var/test-media
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: |
          python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
          python -m pip check
      - name: Lint and typecheck
        working-directory: backend
        run: |
          ruff check app tests
          mypy app
      - name: Unit and fixture regressions
        working-directory: backend
        run: pytest -q -m 'not integration' --junitxml=../output/ai-parser-unit.xml
      - name: Start isolated PostgreSQL and PostGIS
        run: |
          docker compose up -d postgres
          postgres_id="$(docker compose ps -q postgres)"
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id")" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id")" = healthy
          docker compose exec -T postgres createdb -U ttest ttest_test
      - name: Migrate isolated test database
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check
      - name: Import lifecycle and database audit regressions
        working-directory: backend
        run: |
          pytest -q --junitxml=../output/ai-parser-pg.xml tests/integration/test_ai_listing_foundation.py \
            tests/integration/test_external_import_lifecycle.py \
            tests/integration/test_external_import_transaction_boundaries.py \
            tests/integration/test_external_removal.py \
            tests/integration/test_external_spain.py
      - name: Upload parser test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-parser-foundation-results
          path: output/ai-parser-*.xml
          if-no-files-found: error
      - name: Stop isolated infrastructure
        if: always()
        run: docker compose down
