name: Temporary responsive map wait patch
on:
  push:
    branches:
      - fix/customer-map-mobile-polish
    paths:
      - .github/workflows/tmp-fix-responsive-map-wait.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Patch stale map readiness selector and self-delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/delta.spec.ts')
          text = path.read_text()
          old = "if (route.includes('vista=mapa')) await page.locator('.google-map-canvas, .m2-map-canvas').waitFor({ state: 'visible' })"
          new = "if (route.includes('vista=mapa')) await page.locator('.google-map-canvas, .m2-map-canvas, [data-testid=\"google-map\"]').first().waitFor({ state: 'visible', timeout: 15_000 })"
          if old not in text:
              raise SystemExit('expected stale map readiness selector not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/tmp-fix-responsive-map-wait.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/delta.spec.ts .github/workflows/tmp-fix-responsive-map-wait.yml
          git commit -m "test: use canonical mobile map readiness selector"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/customer-map-mobile-polish
