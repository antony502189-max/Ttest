name: Security dependency and static audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install versioned audit tools
        run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Audit exact Python graph without installing platform-specific constraints
        run: python -m pip_audit -r backend/constraints.txt --no-deps --disable-pip
      - name: Review medium and high severity static findings
        run: python -m bandit -r backend/app -ll
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit build and runtime JavaScript dependencies
        run: npm audit --audit-level=moderate
