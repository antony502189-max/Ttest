name: Production audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+asyncpg://ttest:ttest@127.0.0.1:5432/ttest_test
      DATABASE_URL: postgresql+asyncpg://ttest:ttest@127.0.0.1:5432/ttest_test
      JWT_SECRET: ci-backend-secret-with-at-least-32-characters
      EMAIL_VERIFICATION_HMAC_SECRET: ci-independent-email-secret-with-32-plus-characters
      FRONTEND_ORIGINS: http://testserver,http://127.0.0.1:4174
      FRONTEND_APP_URL: http://testserver
      AUTO_PUBLISH_LISTINGS: "true"
      REDIS_URL: redis://127.0.0.1:6379/15
      STORAGE_BACKEND: local
      MEDIA_ROOT: var/test-media
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate immutable supply-chain pins
        run: python3 scripts/check-supply-chain.py

      - name: Validate production Compose, scripts, and nginx
        run: ./scripts/check-production-config.sh

      - name: Start isolated test infrastructure
        run: docker compose up -d postgres redis minio minio-init

      - name: Wait for PostgreSQL and create test database
        run: |
          postgres_id="$(docker compose ps -q postgres)"
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id")" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$postgres_id")" = healthy
          docker compose exec -T postgres createdb -U ttest ttest_test

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Install backend audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
          python -m pip check

      - name: Backend lint and typecheck
        working-directory: backend
        run: |
          ruff check app tests
          mypy app

      - name: Apply complete migration chain
        working-directory: backend
        run: alembic upgrade head

      - name: Backend unit tests
        working-directory: backend
        run: pytest -q -m 'not integration'

      - name: PostgreSQL and PostGIS integration tests
        working-directory: backend
        run: pytest -q -m 'integration and not s3'

      - name: MinIO integration tests
        working-directory: backend
        env:
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          S3_BUCKET: ttest-media
          S3_REGION: us-east-1
          S3_ACCESS_KEY: ttest-minio
          S3_SECRET_KEY: ttest-minio-secret
        run: pytest -q -m s3

      - name: Capture infrastructure logs
        if: always()
        run: |
          mkdir -p output
          docker compose logs --no-color > output/production-audit.log 2>&1 || true

      - name: Upload infrastructure logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-audit-infrastructure-logs
          path: output/production-audit.log
          if-no-files-found: ignore

  frontend-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:bundle-security
      - run: npm run test:security

  apply-import-order-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Apply, validate and commit exact import correction
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/external_import.py')
          text = path.read_text(encoding='utf-8')
          old = '''from __future__ import annotations

from collections.abc import Iterable

import asyncio
import hashlib
import json
import logging
import re
import unicodedata
'''
          new = '''from __future__ import annotations

import asyncio
import hashlib
import json
import logging
import re
import unicodedata
from collections.abc import Iterable
'''
          if new in text and old not in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('expected unique unsorted import block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          if git diff --quiet; then
            exit 0
          fi
          test "$(git diff --name-only)" = 'backend/app/services/external_import.py'
          git diff --check
          python3 -m py_compile backend/app/services/external_import.py

          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)"
          test "$remote_sha" = "$base_sha"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/external_import.py
          git commit -m 'fix: sort importer standard-library imports'
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$authenticated_remote" "HEAD:refs/heads/$HEAD_REF"
