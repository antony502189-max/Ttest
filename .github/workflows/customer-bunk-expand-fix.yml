name: Apply expand-compatible bunk storage fix

on:
  push:
    branches:
      - feature/customer-room-favorites-bed

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/customer-room-favorites-bed
          fetch-depth: 0

      - name: Apply expand-compatible storage change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              write(path, text.replace(old, new, 1))

          # Replace the constraint-changing migration with an additive compatibility column.
          # Old releases continue reading/writing bed_type; new releases use bed_type_v2 when
          # present and mirror a legacy-compatible value into bed_type.
          migration = '''"""Add expand-compatible bunk bed storage.\n\nRevision ID: 0037_bunk_bed_type\nRevises: 0036_listing_promotions\n"""\n\nfrom collections.abc import Sequence\n\nfrom alembic import op\nimport sqlalchemy as sa\n\nrevision: str = "0037_bunk_bed_type"\ndown_revision: str | None = "0036_listing_promotions"\nbranch_labels: str | Sequence[str] | None = None\ndepends_on: str | Sequence[str] | None = None\n\n\ndef upgrade() -> None:\n    # Expand-only: keep the legacy constrained bed_type column untouched so old and\n    # new application releases remain compatible during a rolling deployment.\n    op.add_column(\n        "listing_room_details",\n        sa.Column("bed_type_v2", sa.String(length=16), nullable=True),\n    )\n\n\ndef downgrade() -> None:\n    op.drop_column("listing_room_details", "bed_type_v2")\n'''
          write('backend/alembic/versions/0037_bunk_bed_type.py', migration)

          replace_once(
              'backend/app/models/room_details.py',
              '    bed_type: Mapped[str | None] = mapped_column(String(16))\n',
              '    bed_type: Mapped[str | None] = mapped_column(String(16))\n    bed_type_v2: Mapped[str | None] = mapped_column(String(16))\n',
          )

          replace_once(
              'backend/app/services/listings.py',
              '    "bedType": "bed_type",\n',
              '    "bedType": "bed_type_v2",\n',
          )
          replace_once(
              'backend/app/services/listings.py',
              '}\n\n\nasync def ensure_owner_or_admin',
              '}\n\n\ndef _legacy_bed_type(value: str | None) -> str | None:\n    """Mirror new values into the old constrained column during the expand phase."""\n    return "single" if value == "bunk" else value\n\n\nasync def ensure_owner_or_admin',
          )
          replace_once(
              'backend/app/services/listings.py',
              'def apply_room_detail_write(details: ListingRoomDetails, payload: ListingWrite) -> None:\n    for api_name, model_name in ROOM_DETAIL_MAPPING.items():\n        setattr(details, model_name, getattr(payload, api_name))\n',
              'def apply_room_detail_write(details: ListingRoomDetails, payload: ListingWrite) -> None:\n    for api_name, model_name in ROOM_DETAIL_MAPPING.items():\n        setattr(details, model_name, getattr(payload, api_name))\n    details.bed_type = _legacy_bed_type(payload.bedType)\n',
          )
          replace_once(
              'backend/app/services/listings.py',
              '    bed_type = effective("bedType", details.bed_type if details else None)\n',
              '    bed_type = effective("bedType", (details.bed_type_v2 or details.bed_type) if details else None)\n',
          )
          replace_once(
              'backend/app/services/listings.py',
              '        for api_name, value in detail_changes.items():\n            setattr(details, ROOM_DETAIL_MAPPING[api_name], value)\n',
              '        for api_name, value in detail_changes.items():\n            setattr(details, ROOM_DETAIL_MAPPING[api_name], value)\n            if api_name == "bedType":\n                details.bed_type = _legacy_bed_type(value if isinstance(value, str) else None)\n',
          )

          replace_once(
              'backend/app/repositories/listings.py',
              '        bedType=room_details.bed_type if room_details else None,\n',
              '        bedType=(room_details.bed_type_v2 or room_details.bed_type) if room_details else None,\n',
          )
          replace_once(
              'backend/app/repositories/listings.py',
              '    if payload.bedType:\n        query = query.where(ListingRoomDetails.bed_type == payload.bedType)\n',
              '    if payload.bedType:\n        query = query.where(func.coalesce(ListingRoomDetails.bed_type_v2, ListingRoomDetails.bed_type) == payload.bedType)\n',
          )

          # Extend the backend test to ensure the new value is accepted by search contracts too.
          replace_once(
              'backend/tests/test_room_first_listing_schemas.py',
              '    assert listing.roomCapacity == 2\n\n\ndef test_holiday_room_for_two_with_double_bed_is_valid():',
              '    assert listing.roomCapacity == 2\n\n    search = ListingSearchRequest.model_validate({"bedType": "bunk"})\n    assert search.bedType == "bunk"\n\n\ndef test_holiday_room_for_two_with_double_bed_is_valid():',
          )

          Path('.github/workflows/customer-bunk-expand-fix.yml').unlink()
          PY

      - name: Commit compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make bunk bed storage expand-compatible"
          git push origin HEAD:feature/customer-room-favorites-bed
