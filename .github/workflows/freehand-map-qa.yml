name: Freehand map drawing QA

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.issue.title == '[qa] Freehand mobile map drawing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm exec vite build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test freehand drawing
        id: e2e
        continue-on-error: true
        run: |
          set -o pipefail
          npx playwright test tests/mobile-freehand-map.spec.ts 2>&1 | tee /tmp/freehand-qa.log
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          {
            echo "## Freehand QA"
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- Playwright: **$E2E_OUTCOME**"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 120 /tmp/freehand-qa.log
            echo '```'
          } > /tmp/report.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/report.md
      - name: Fail on test error
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: test "$E2E_OUTCOME" = success
