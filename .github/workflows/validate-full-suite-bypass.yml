name: Full regression suite with onboarding bypass

on:
  push:
    branches: [validation/full-suite-bypass]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
      VITE_E2E_BYPASS_ONBOARDING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/full-suite-bypass
          fetch-depth: 0
      - name: Run regression suite
        shell: bash
        run: |
          set +e
          mkdir -p docs
          npm ci > /tmp/install.log 2>&1
          install_code=$?
          if [ $install_code -eq 0 ]; then
            npx playwright install --with-deps chromium >> /tmp/install.log 2>&1
            browser_code=$?
          else browser_code=99; fi
          npm run lint > /tmp/lint.log 2>&1; lint_code=$?
          npm run typecheck > /tmp/typecheck.log 2>&1; type_code=$?
          npm run build > /tmp/build.log 2>&1; build_code=$?
          if [ $install_code -eq 0 ] && [ $browser_code -eq 0 ]; then
            npm exec playwright test -- --workers=4 --grep-invert 'onboarding restarts after every full page reload' > /tmp/tests.log 2>&1
            test_code=$?
          else test_code=99; fi
          {
            echo '# Full regression validation with onboarding bypass'
            echo
            printf '| npm ci | `%s` |\n' "$install_code"
            printf '| browser install | `%s` |\n' "$browser_code"
            printf '| lint | `%s` |\n' "$lint_code"
            printf '| typecheck | `%s` |\n' "$type_code"
            printf '| build | `%s` |\n' "$build_code"
            printf '| full e2e excluding dedicated reload test | `%s` |\n' "$test_code"
            echo
            echo '```text'
            tail -n 1400 /tmp/tests.log 2>/dev/null || true
            echo '```'
          } > docs/full-suite-bypass-validation.md
          rm .github/workflows/validate-full-suite-bypass.yml
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record full regression bypass validation" || true
          git push origin HEAD:validation/full-suite-bypass
