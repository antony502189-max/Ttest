name: Refresh onboarding contract migration

on:
  push:
    branches:
      - fix/customer-map-mobile-polish

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/customer-map-mobile-polish
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Migrate stale reload expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'tests/acceptance-flows.spec.ts',
              '''  await page.reload();\n  await page.evaluate(() =>\n    (document.activeElement as HTMLElement | null)?.blur(),\n  );''',
              '''  await page.reload();\n  await expect(page.getByText("Selecciona el idioma de la aplicación")).toBeVisible();\n  for (let index = 0; index < 3; index += 1) {\n    const continueOnboarding = page.getByRole("button", { name: "Continuar" });\n    await continueOnboarding.focus();\n    await page.keyboard.press("Enter");\n  }\n  const skipOnboarding = page.getByRole("button", { name: "Ahora no" });\n  await skipOnboarding.focus();\n  await page.keyboard.press("Enter");\n  await page.evaluate(() =>\n    (document.activeElement as HTMLElement | null)?.blur(),\n  );''',
          )

          replace_once(
              'tests/delta.spec.ts',
              '''  await page.evaluate(() => localStorage.setItem('112233:mobile-onboarding:v1', 'done'))\n  await page.reload()\n  const routes = [''',
              '''  await page.evaluate(() => localStorage.setItem('112233:mobile-onboarding:v1', 'done'))\n  await page.reload()\n  await expect(page.getByText('Selecciona el idioma de la aplicación')).toBeVisible()\n  await page.getByRole('button', { name: 'Continuar' }).click()\n  await page.getByRole('button', { name: 'Continuar' }).click()\n  await page.getByRole('button', { name: 'Continuar' }).click()\n  await page.getByRole('button', { name: 'Ahora no' }).click()\n  const routes = [''',
          )

          replace_once(
              'tests/final-mobile-delta.spec.ts',
              '''    await expect(page.locator('html')).toHaveAttribute('lang', language)\n    await expect(page.locator('.m2-home')).toBeVisible()\n    const dimensions = await page.evaluate(() => ({''',
              '''    await expect(page.locator('html')).toHaveAttribute('lang', language)\n    await expect(page.locator('.m2-onboarding')).toBeVisible()\n    const dimensions = await page.evaluate(() => ({''',
          )

          replace_once(
              'tests/mobile-location-map.spec.ts',
              '''test('onboarding is persisted after completion and language names are never machine-translated', async ({ page }) => {\n  await page.goto('/')\n  await expect(page.getByText('Español', { exact: true })).toBeVisible()\n  await expect(page.getByText('English', { exact: true })).toBeVisible()\n  await expect(page.getByText('Русский', { exact: true })).toBeVisible()\n  await expect(page.getByText('Испанский', { exact: true })).toHaveCount(0)\n  await finishOnboarding(page)\n  await page.reload()\n  await expect(page.getByTestId('open-location')).toBeVisible()\n})''',
              '''test('onboarding returns after refresh and language names are never machine-translated', async ({ page }) => {\n  await page.goto('/')\n  await expect(page.getByText('Español', { exact: true })).toBeVisible()\n  await expect(page.getByText('English', { exact: true })).toBeVisible()\n  await expect(page.getByText('Русский', { exact: true })).toBeVisible()\n  await expect(page.getByText('Испанский', { exact: true })).toHaveCount(0)\n  await finishOnboarding(page)\n  await page.reload()\n  await expect(page.getByText('Español', { exact: true })).toBeVisible()\n  await expect(page.getByText('English', { exact: true })).toBeVisible()\n  await expect(page.getByText('Русский', { exact: true })).toBeVisible()\n  await expect(page.getByText('Испанский', { exact: true })).toHaveCount(0)\n  await expect(page.getByTestId('open-location')).toHaveCount(0)\n})''',
          )

          replace_once(
              'tests/visual-parity.spec.ts',
              '''  await page.reload()\n  await expect(page.locator('html')).toHaveAttribute('lang', 'ru')\n  await shot(page, 'current-home-ru-390x844')''',
              '''  await page.reload()\n  await expect(page.locator('html')).toHaveAttribute('lang', 'ru')\n  await expect(page.getByText('Выберите язык приложения')).toBeVisible()\n  await page.getByRole('button', { name: 'Продолжить' }).click()\n  await page.getByRole('button', { name: 'Продолжить' }).click()\n  await page.getByRole('button', { name: 'Продолжить' }).click()\n  await page.getByRole('button', { name: 'Сейчас нет' }).click()\n  await expect(page.locator('.m2-home')).toBeVisible()\n  await shot(page, 'current-home-ru-390x844')''',
          )
          PY

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify migrated contracts
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npx playwright test tests/acceptance-flows.spec.ts --grep '28–29 mobile navigation'
          npx playwright test tests/delta.spec.ts --grep 'RESP-01..05'
          npx playwright test tests/final-mobile-delta.spec.ts --grep 'DELTA-MOBILE-06'
          npx playwright test tests/mobile-location-map.spec.ts --grep 'onboarding returns after refresh'
          npx playwright test tests/visual-parity.spec.ts --grep 'current mobile menu, auth and Russian visual states'

      - name: Commit migrated tests and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm .github/workflows/refresh-onboarding-contract-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/acceptance-flows.spec.ts tests/delta.spec.ts tests/final-mobile-delta.spec.ts tests/mobile-location-map.spec.ts tests/visual-parity.spec.ts .github/workflows/refresh-onboarding-contract-migration.yml
          git commit -m 'test: align refresh contracts with customer onboarding requirement'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/customer-map-mobile-polish
