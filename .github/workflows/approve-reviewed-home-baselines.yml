# One-shot baseline approval. Delete after the approved snapshots are installed.
name: Approve reviewed PR97 home baselines

on:
  pull_request_target:
    types:
      - synchronize

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  approve:
    if: github.event.pull_request.number == 97 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui/restore-home-reference-controls'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout visual baselines only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: visual-baselines
          persist-credentials: false
          fetch-depth: 1
      - name: Stage reviewed snapshots through Git Data API
        id: approve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          result=/tmp/baseline-result.txt
          : > "$result"
          trap 'code=$?; echo "exit_code=$code" >> "$result"' EXIT

          base_commit="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse 'HEAD^{tree}')"
          echo "baseline_before=$base_commit" >> "$result"
          echo "baseline_tree=$base_tree" >> "$result"

          gh run download 31392714793 -n playwright-report --dir /tmp/pr97
          es_actual="$(find /tmp/pr97 -type f -name 'current-home-390x844-actual.png' -print -quit)"
          ru_actual="$(find /tmp/pr97 -type f -name 'current-home-ru-390x844-actual.png' -print -quit)"
          test -n "$es_actual"
          test -n "$ru_actual"

          es_expected="$(git hash-object "$es_actual")"
          ru_expected="$(git hash-object "$ru_actual")"
          echo "es_actual_blob=$es_expected" >> "$result"
          echo "ru_actual_blob=$ru_expected" >> "$result"
          test "$es_expected" = '1c331eb3ef7187b8826a3d08a0335bf730bd15a0'
          test "$ru_expected" = '8b427c43bf445aeeee7cbf5fb5dc6d6c712cb8c5'

          base64 -w0 "$es_actual" | jq -Rs '{content: ., encoding: "base64"}' > /tmp/es-blob.json
          base64 -w0 "$ru_actual" | jq -Rs '{content: ., encoding: "base64"}' > /tmp/ru-blob.json
          es_blob="$(gh api --method POST "repos/$GH_REPO/git/blobs" --input /tmp/es-blob.json --jq .sha)"
          ru_blob="$(gh api --method POST "repos/$GH_REPO/git/blobs" --input /tmp/ru-blob.json --jq .sha)"
          echo "es_created_blob=$es_blob" >> "$result"
          echo "ru_created_blob=$ru_blob" >> "$result"
          test "$es_blob" = "$es_expected"
          test "$ru_blob" = "$ru_expected"

          jq -n \
            --arg base "$base_tree" \
            --arg es "$es_blob" \
            --arg ru "$ru_blob" \
            '{base_tree: $base, tree: [
              {path: "tests/visual-snapshots/chromium/current-home-390x844.png", mode: "100644", type: "blob", sha: $es},
              {path: "tests/visual-snapshots/chromium/current-home-ru-390x844.png", mode: "100644", type: "blob", sha: $ru}
            ]}' > /tmp/tree.json
          new_tree="$(gh api --method POST "repos/$GH_REPO/git/trees" --input /tmp/tree.json --jq .sha)"
          echo "approval_tree=$new_tree" >> "$result"

          jq -n \
            --arg tree "$new_tree" \
            --arg parent "$base_commit" \
            '{message: "test: approve restored home reference design", tree: $tree, parents: [$parent]}' > /tmp/commit.json
          new_commit="$(gh api --method POST "repos/$GH_REPO/git/commits" --input /tmp/commit.json --jq .sha)"
          echo "approval_branch_commit=$new_commit" >> "$result"

          ref_path='heads/approve/pr97-home-baselines'
          if gh api "repos/$GH_REPO/git/ref/$ref_path" >/dev/null 2>&1; then
            jq -n --arg sha "$new_commit" '{sha: $sha, force: true}' > /tmp/ref.json
            gh api --method PATCH "repos/$GH_REPO/git/refs/$ref_path" --input /tmp/ref.json >/dev/null
          else
            jq -n --arg ref 'refs/heads/approve/pr97-home-baselines' --arg sha "$new_commit" '{ref: $ref, sha: $sha}' > /tmp/ref.json
            gh api --method POST "repos/$GH_REPO/git/refs" --input /tmp/ref.json >/dev/null
          fi
          echo 'baseline_state=staged-for-pr' >> "$result"
      - name: Report baseline updater result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo '### PR97 reviewed-baseline updater'
            echo '```text'
            if [ -f /tmp/baseline-result.txt ]; then cat /tmp/baseline-result.txt; else echo 'updater did not reach diagnostic script'; fi
            echo '```'
            echo "job_conclusion=${{ steps.approve.outcome }}"
          } > /tmp/comment.md
          gh pr comment 97 --body-file /tmp/comment.md
