name: Customer feedback hotfix

on:
  push:
    branches: ["fix/customer-publish-availability-wifi-expenses"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/customer-publish-availability-wifi-expenses

      - name: Apply customer feedback fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once("src/data/listings.ts", "export const amenityOptions = ['Fibra', 'Escritorio', 'Balcón', 'Ascensor', 'Lavadora', 'Aire acondicionado', 'Terraza', 'Aparcamiento', 'Cocina equipada']", "export const amenityOptions = ['Wi-Fi', 'Escritorio', 'Balcón', 'Ascensor', 'Lavadora', 'Aire acondicionado', 'Terraza', 'Aparcamiento', 'Cocina equipada']")
          replace_once("src/data/listings.ts", "furnished: true, amenities: ['Fibra', 'Escritorio', 'Armario', 'Lavadora', 'Cocina equipada'], monthlyPrice: 450, nightlyPrice: 55, weeklyPrice: 330, depositAmount: 100,\n  billsIncluded: true, billsNote: 'Todo incluido con uso responsable', availableFrom: '2026-08-15', availableUntil: '2027-08-14', minimumStayMonths: 3, minimumNights: 3, expiresAt: '2026-10-01',", "furnished: true, amenities: ['Wi-Fi', 'Escritorio', 'Armario', 'Lavadora', 'Cocina equipada'], monthlyPrice: 450, nightlyPrice: 55, weeklyPrice: 330, depositAmount: 100,\n  billsIncluded: true, billsNote: '', availableFrom: '2026-08-15', availableUntil: '', minimumStayMonths: 3, minimumNights: 3, expiresAt: '2026-10-01',")
          replace_once("src/data/listings.ts", "'Habitación amplia con balcón y fibra',", "'Habitación amplia con balcón y Wi-Fi',")
          replace_once("backend/app/commands/seed.py", '    "Habitación amplia con balcón y fibra",', '    "Habitación amplia con balcón y Wi-Fi",')
          replace_once("backend/app/commands/seed.py", 'AMENITIES = ("Fibra", "Escritorio", "Balcón", "Ascensor", "Lavadora", "Aire acondicionado", "Terraza", "Aparcamiento")', 'AMENITIES = ("Wi-Fi", "Escritorio", "Balcón", "Ascensor", "Lavadora", "Aire acondicionado", "Terraza", "Aparcamiento")')

          replace_once("src/api/listings.ts", "    amenities: dto.amenities,", "    amenities: dto.amenities.map((item) => item === 'Fibra' ? 'Wi-Fi' : item),")
          replace_once("src/api/listings.ts", "    minimumNights: listing.minimumNights ?? null, depositAmount: listing.depositAmount, billsIncluded: listing.billsIncluded,", "    minimumNights: listing.minimumNights ?? null, depositAmount: listing.depositAmount, billsIncluded: listing.billsIncluded,\n    billsText: listing.bills,")

          replace_once("src/pages/PublishPage.tsx", "const toDraft = (listing: Listing): ListingDraft => {", "const billsAmountFromText = (value: string) => {\n  const match = value.match(/(\\d+(?:[.,]\\d{1,2})?)/);\n  return match ? match[1].replace(\",\", \".\") : \"\";\n};\n\nconst toDraft = (listing: Listing): ListingDraft => {")
          replace_once("src/pages/PublishPage.tsx", "    amenities: listing.amenities,", "    amenities: listing.amenities.map((item) => item === \"Fibra\" ? \"Wi-Fi\" : item),")
          replace_once("src/pages/PublishPage.tsx", "    billsNote: listing.bills,\n    availableFrom: listing.availableFrom,\n    availableUntil: listing.availableUntil ?? listing.expiresAt,", "    billsNote: listing.billsIncluded ? \"\" : billsAmountFromText(listing.bills),\n    availableFrom: listing.availableFrom,\n    availableUntil: listing.availableUntil ?? \"\",")
          replace_once("src/pages/PublishPage.tsx", "    availableUntil: draft.availableUntil,", "    availableUntil: draft.availableUntil || undefined,")
          replace_once("src/pages/PublishPage.tsx", "    bills: draft.billsNote || (draft.billsIncluded ? \"Gastos incluidos\" : \"Gastos aparte\"),", "    bills: draft.billsIncluded ? \"Gastos incluidos en el precio\" : draft.billsNote ? `Gastos aparte: aprox. ${draft.billsNote} €/mes` : \"Gastos aparte\",")
          replace_once("src/pages/PublishPage.tsx", "    if (step === 3 && getPrimaryPrice(preview) < 1) next.price = \"El precio debe ser mayor que cero.\";", "    if (step === 3) {\n      if (getPrimaryPrice(preview) < 1) next.price = \"El precio debe ser mayor que cero.\";\n      if (!draft.billsIncluded) {\n        const billsAmount = Number(draft.billsNote);\n        if (!draft.billsNote.trim() || !Number.isFinite(billsAmount) || billsAmount <= 0) next.billsAmount = \"Indica el gasto adicional aproximado al mes.\";\n      }\n    }")
          replace_once("src/pages/PublishPage.tsx", "      if (!draft.availableFrom) next.availableFrom = \"Selecciona una fecha de inicio.\";\n      if (!draft.availableUntil) next.availableUntil = \"Selecciona una fecha final.\";\n      if (draft.availableFrom && draft.availableUntil && draft.availableUntil < draft.availableFrom) next.availableUntil = \"La fecha final debe ser posterior a la inicial.\";", "      if (!draft.availableFrom) next.availableFrom = \"Selecciona una fecha de inicio.\";\n      if (draft.availableFrom && draft.availableUntil && draft.availableUntil < draft.availableFrom) next.availableUntil = \"La fecha final debe ser posterior a la inicial.\";")
          replace_once("src/pages/PublishPage.tsx", "          <label className=\"check-row\"><Checkbox checked={draft.billsIncluded} onCheckedChange={(value) => set(\"billsIncluded\", value === true)} />Gastos incluidos</label>\n          <FormField label=\"Aclaración sobre gastos\" htmlFor=\"publish-bills\"><Input id=\"publish-bills\" value={draft.billsNote} onChange={(e) => set(\"billsNote\", e.target.value)} /></FormField>", "          <div className=\"form-grid\">\n            <FormField label=\"Gastos de suministros\" htmlFor=\"publish-bills-included\"><select id=\"publish-bills-included\" value={draft.billsIncluded ? \"included\" : \"extra\"} onChange={(e) => setDraft((current) => ({ ...current, billsIncluded: e.target.value === \"included\", billsNote: e.target.value === \"included\" ? \"\" : current.billsNote }))}><option value=\"included\">Incluidos en el precio</option><option value=\"extra\">Se pagan aparte</option></select></FormField>\n            {!draft.billsIncluded ? <FormField label=\"Gastos adicionales aproximados (€/mes)\" htmlFor=\"publish-bills\" error={errors.billsAmount}><Input id=\"publish-bills\" type=\"number\" min=\"1\" inputMode=\"decimal\" value={draft.billsNote} aria-invalid={Boolean(errors.billsAmount)} onChange={(e) => set(\"billsNote\", e.target.value)} /></FormField> : null}\n          </div>")
          replace_once("src/pages/PublishPage.tsx", "        return <WizardSection title=\"Disponibilidad\" description=\"Indica el intervalo exacto, desde qué día hasta qué día está disponible.\">", "        return <WizardSection title=\"Disponibilidad\" description=\"Indica desde qué día está disponible. La fecha final es opcional; si no la conoces, basta con indicar la estancia mínima.\">")
          replace_once("src/pages/PublishPage.tsx", "            <FormField label=\"Disponible hasta\" htmlFor=\"publish-available-until\" error={errors.availableUntil}><Input id=\"publish-available-until\" type=\"date\" value={draft.availableUntil} aria-invalid={Boolean(errors.availableUntil)} onChange={(e) => set(\"availableUntil\", e.target.value)} /></FormField>", "            <FormField label=\"Disponible hasta (opcional)\" htmlFor=\"publish-available-until\" error={errors.availableUntil}><Input id=\"publish-available-until\" type=\"date\" value={draft.availableUntil} aria-invalid={Boolean(errors.availableUntil)} onChange={(e) => set(\"availableUntil\", e.target.value)} /></FormField>")
          replace_once("src/pages/PublishPage.tsx", "<div><dt>Disponibilidad</dt><dd>{preview.availableFrom} — {preview.availableUntil}</dd></div>", "<div><dt>Disponibilidad</dt><dd>{preview.availableFrom}{preview.availableUntil ? ` — ${preview.availableUntil}` : \" · sin fecha final\"}</dd></div>")
          replace_once("src/pages/ListingPage.tsx", "<div><dt>Disponible hasta</dt><dd>{listing.availableUntil ?? unknownListingFact}</dd></div>", "<div><dt>Disponible hasta</dt><dd>{listing.availableUntil ?? 'Sin fecha final'}</dd></div>")

          replace_once("backend/app/schemas/listings.py", "    billsIncluded: bool = False\n    bathroom: str = Field(default=\"Baño compartido\", max_length=64)", "    billsIncluded: bool = False\n    billsText: str | None = Field(default=None, max_length=240)\n    bathroom: str = Field(default=\"Baño compartido\", max_length=64)")
          replace_once("backend/app/schemas/listings.py", "    billsIncluded: bool | None = None\n    bathroom: str | None = Field(default=None, max_length=64)", "    billsIncluded: bool | None = None\n    billsText: str | None = Field(default=None, max_length=240)\n    bathroom: str | None = Field(default=None, max_length=64)")
          replace_once("backend/app/schemas/listings.py", '            "availableUntil",\n            "minimumNights",', '            "availableUntil",\n            "billsText",\n            "minimumNights",')
          replace_once("backend/app/services/listings.py", "    listing.bills_included = payload.billsIncluded\n    listing.bathroom = payload.bathroom", "    listing.bills_included = payload.billsIncluded\n    listing.bills_text = payload.billsText\n    listing.bathroom = payload.bathroom")
          replace_once("backend/app/services/listings.py", '        "billsIncluded": "bills_included",\n        "roomSizeM2": "room_size_m2",', '        "billsIncluded": "bills_included",\n        "billsText": "bills_text",\n        "roomSizeM2": "room_size_m2",')

          replace_once("src/contexts/i18n-context.tsx", "  'Fibra': { ru: 'Оптоволоконный интернет', en: 'Fiber internet' },", "  'Fibra': { ru: 'Оптоволоконный интернет', en: 'Fiber internet' },\n  'Wi-Fi': { ru: 'Wi-Fi', en: 'Wi-Fi' },\n  'Gastos de suministros': { ru: 'Коммунальные расходы', en: 'Utility costs' },\n  'Incluidos en el precio': { ru: 'Включены в стоимость', en: 'Included in the price' },\n  'Se pagan aparte': { ru: 'Оплачиваются отдельно', en: 'Paid separately' },\n  'Gastos adicionales aproximados (€/mes)': { ru: 'Примерные дополнительные расходы (€/мес.)', en: 'Approximate additional costs (€/month)' },\n  'Disponible hasta (opcional)': { ru: 'Доступно до (необязательно)', en: 'Available until (optional)' },\n  'Sin fecha final': { ru: 'Без конечной даты', en: 'No end date' },")
          PY

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Frontend checks
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - name: Backend checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
          cd backend
          ruff check app
          mypy app
          pytest -q -m 'not integration'

      - name: Commit verified changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/customer-feedback-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply customer feedback to publish flow"
          git push origin HEAD:fix/customer-publish-availability-wifi-expenses
