name: Apply idle transaction timeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'antony502189-max'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Apply verified patch and validate its scope
        id: patch
        run: |
          set -euo pipefail
          if grep -q 'database_idle_transaction_timeout_ms' backend/app/core/config.py; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/apply-idle-transaction-timeout.py
          python3 -m py_compile \
            backend/app/core/config.py \
            backend/app/db/session.py \
            backend/tests/test_database_timeouts.py \
            backend/tests/integration/test_database_server_settings.py
          git diff --check

          actual="$(git diff --name-only | sort | tr '\n' ' ')"
          expected='backend/app/core/config.py backend/app/db/session.py backend/tests/integration/test_database_server_settings.py backend/tests/test_database_timeouts.py deploy/production.env.example docker-compose.production.yml '
          test "$actual" = "$expected"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit all patched files atomically
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)"
          test "$remote_sha" = "$base_sha"
          base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$base_sha" --jq .tree.sha)"

          create_blob() {
            local path="$1"
            local payload
            payload="$(mktemp)"
            FILE_PATH="$path" python3 - <<'PY' > "$payload"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["FILE_PATH"])
          print(json.dumps({"content": path.read_text(encoding="utf-8"), "encoding": "utf-8"}))
          PY
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$payload" --jq .sha
          }

          config_blob="$(create_blob backend/app/core/config.py)"
          session_blob="$(create_blob backend/app/db/session.py)"
          integration_test_blob="$(create_blob backend/tests/integration/test_database_server_settings.py)"
          unit_test_blob="$(create_blob backend/tests/test_database_timeouts.py)"
          env_blob="$(create_blob deploy/production.env.example)"
          compose_blob="$(create_blob docker-compose.production.yml)"

          export BASE_TREE="$base_tree"
          export CONFIG_BLOB="$config_blob"
          export SESSION_BLOB="$session_blob"
          export INTEGRATION_TEST_BLOB="$integration_test_blob"
          export UNIT_TEST_BLOB="$unit_test_blob"
          export ENV_BLOB="$env_blob"
          export COMPOSE_BLOB="$compose_blob"

          python3 - <<'PY' > /tmp/tree.json
          import json
          import os

          print(json.dumps({
              "base_tree": os.environ["BASE_TREE"],
              "tree": [
                  {"path": "backend/app/core/config.py", "mode": "100644", "type": "blob", "sha": os.environ["CONFIG_BLOB"]},
                  {"path": "backend/app/db/session.py", "mode": "100644", "type": "blob", "sha": os.environ["SESSION_BLOB"]},
                  {"path": "backend/tests/integration/test_database_server_settings.py", "mode": "100644", "type": "blob", "sha": os.environ["INTEGRATION_TEST_BLOB"]},
                  {"path": "backend/tests/test_database_timeouts.py", "mode": "100644", "type": "blob", "sha": os.environ["UNIT_TEST_BLOB"]},
                  {"path": "deploy/production.env.example", "mode": "100644", "type": "blob", "sha": os.environ["ENV_BLOB"]},
                  {"path": "docker-compose.production.yml", "mode": "100644", "type": "blob", "sha": os.environ["COMPOSE_BLOB"]}
              ]
          }))
          PY

          tree_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input /tmp/tree.json --jq .sha)"
          export TREE_SHA="$tree_sha" BASE_SHA="$base_sha"
          python3 - <<'PY' > /tmp/commit.json
          import json
          import os

          print(json.dumps({
              "message": "fix: abort abandoned database transactions",
              "tree": os.environ["TREE_SHA"],
              "parents": [os.environ["BASE_SHA"]]
          }))
          PY

          commit_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input /tmp/commit.json --jq .sha)"
          export COMMIT_SHA="$commit_sha"
          python3 - <<'PY' > /tmp/ref.json
          import json
          import os

          print(json.dumps({"sha": os.environ["COMMIT_SHA"], "force": False}))
          PY
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" --input /tmp/ref.json >/dev/null
