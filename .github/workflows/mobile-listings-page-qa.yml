name: Mobile listings page acceptance QA

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm exec vite build
      - run: npx playwright install --with-deps chromium
      - name: Run mobile listings page acceptance tests
        id: e2e
        continue-on-error: true
        run: npx playwright test tests/mobile-search-results.spec.ts --workers=1 2>&1 | tee /tmp/listings-e2e.log
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: 27
          E2E: ${{ steps.e2e.outcome }}
        run: |
          {
            echo '## Mobile listings page acceptance QA'
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo '- lint: **success**'
            echo '- typecheck: **success**'
            echo '- production build: **success**'
            echo "- listings Playwright suite: **$E2E**"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```text'
            tail -n 260 /tmp/listings-e2e.log 2>/dev/null || true
            echo '```'
          } > /tmp/listings-report.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/listings-report.md
      - name: Fail on test error
        if: always()
        env:
          E2E: ${{ steps.e2e.outcome }}
        run: test "$E2E" = success
