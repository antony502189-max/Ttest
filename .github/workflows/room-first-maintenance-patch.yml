name: Room-first maintenance patch

on:
  push:
    branches:
      - feat/room-first-listing-filters

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/room-first-listing-filters
          fetch-depth: 0
      - name: Patch publish compatibility contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/pages/PublishPage.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'roomType: listing.roomType === "Habitación compartida" ? "Habitación compartida" : "Habitación individual",',
                  'roomType: listing.roomType === "Estudio" ? "Estudio" : listing.roomType === "Habitación compartida" ? "Habitación compartida" : "Habitación individual",',
              ),
              (
                  '{ value: "Habitación compartida", title: "Habitación compartida", text: "Puede alojar a varias personas y admitir plazas individuales." },\n          ], (value) => setDraft',
                  '{ value: "Habitación compartida", title: "Habitación compartida", text: "Puede alojar a varias personas y admitir plazas individuales." },\n            { value: "Estudio", title: "Estudio", text: "Espacio autónomo que se alquila completo." },\n          ], (value) => setDraft',
              ),
              (
                  '<Input id="publish-size" type="number" min="1" max="200" value={draft.roomSizeM2}',
                  '<Input id="publish-size" aria-label="Tamaño aproximado" type="number" min="1" max="200" value={draft.roomSizeM2}',
              ),
              (
                  '<Input id="publish-residents" type="number" min="0" max="50" value={draft.currentResidents}',
                  '<Input id="publish-residents" aria-label="Personas que viven en casa" type="number" min="0" max="50" value={draft.currentResidents}',
              ),
              (
                  '<select id="publish-capacity" value={draft.roomCapacity}',
                  '<select id="publish-capacity" aria-label="Capacidad de la habitación" value={draft.roomCapacity}',
              ),
              (
                  '<Input id="publish-price" type="number" min="1" value={draft.monthlyPrice}',
                  '<Input id="publish-price" aria-label="Alquiler mensual" type="number" min="1" value={draft.monthlyPrice}',
              ),
              (
                  '<Input id="publish-price" type="number" min="1" value={draft.nightlyPrice}',
                  '<Input id="publish-price" aria-label="Precio por noche" type="number" min="1" value={draft.nightlyPrice}',
              ),
              (
                  '<Input id="publish-weekly-price" type="number" min="0"',
                  '<Input id="publish-weekly-price" aria-label="Precio por semana" type="number" min="0"',
              ),
              (
                  '<Input id="publish-monthly-price" type="number" min="0"',
                  '<Input id="publish-monthly-price" aria-label="Precio por mes" type="number" min="0"',
              ),
              (
                  'FormField label="Condición principal para la persona inquilina" htmlFor="publish-tenant-requirement"',
                  'FormField label="Requisito para la persona inquilina" htmlFor="publish-tenant-requirement"',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, got {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit source patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PublishPage.tsx
          git rm .github/workflows/room-first-maintenance-patch.yml
          git commit -m "fix: preserve publish room contracts"
          git push origin HEAD:feat/room-first-listing-filters
