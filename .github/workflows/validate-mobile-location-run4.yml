name: Mobile validation without setup-node

on:
  push:
    branches:
      - validation/mobile-location-run4

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/mobile-location-run4
          fetch-depth: 0
      - name: Run and record every check
        shell: bash
        run: |
          set +e
          mkdir -p output/validation docs
          : > output/validation/full.log
          : > output/validation/status.tsv

          check() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a output/validation/full.log
            "$@" >> output/validation/full.log 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> output/validation/status.tsv
            echo "exit=$code" | tee -a output/validation/full.log
          }

          check "node version" node --version
          check "npm version" npm --version
          check "npm ci" npm ci
          if grep -q $'npm ci\t0' output/validation/status.tsv; then
            check "playwright install" npx playwright install --with-deps chromium
            check "lint" npm run lint
            check "typecheck" npm run typecheck
            check "build" npm run build
            check "e2e" npm run test:e2e
          fi

          if awk -F '\t' 'BEGIN { ok=1; seen=0 } { seen=1; if ($2 != 0) ok=0 } END { exit !(seen && ok) }' output/validation/status.tsv; then overall=PASS; else overall=FAIL; fi
          {
            echo '# Mobile validation report'
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "Overall: **$overall**"
            echo
            echo '| Check | Result | Exit code |'
            echo '|---|---:|---:|'
            while IFS=$'\t' read -r name code; do
              if [ "$code" -eq 0 ]; then result=PASS; else result=FAIL; fi
              printf '| %s | %s | `%s` |\n' "$name" "$result" "$code"
            done < output/validation/status.tsv
            echo
            echo '## Last 700 log lines'
            echo
            echo '```text'
            tail -n 700 output/validation/full.log
            echo '```'
          } > docs/mobile-validation-report.md
          rm .github/workflows/validate-mobile-location-run4.yml
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record mobile validation without setup-node" || true
          git push origin HEAD:validation/mobile-location-run4
