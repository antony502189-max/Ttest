name: Production deployment (manual approval)

# No push or pull_request trigger: merge never deploys production.
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I approve deployment of the current main to app.112233.es"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: 112233-production-deploy
  cancel-in-progress: false

jobs:
  verify-release:
    name: Confirm exact main commit and passing PR CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      CONFIRMED: ${{ inputs.confirm_production }}
    steps:
      - name: Validate operator confirmation and target
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMED" = "true" || { echo "Operator confirmation is required"; exit 65; }
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Only main is deployable"; exit 65; }
          test "$GITHUB_REPOSITORY" = "antony502189-max/Ttest"
          remote_sha="$(gh api "/repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$remote_sha" = "$GITHUB_SHA" || { echo "main changed; start a fresh release review"; exit 65; }
          echo "Approved SHA: $GITHUB_SHA"

      - name: Verify CI evidence for the merged pull request
        shell: bash
        run: |
          set -euo pipefail
          if ! merged_prs="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100")" \
            || ! jq -e 'type == "array"' <<<"$merged_prs" >/dev/null; then
            echo "Commit-to-PR lookup unavailable; checking recently closed main PRs"
            merged_prs="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")"
          fi
          pr_number="$(jq -er --arg sha "$GITHUB_SHA" '[.[] | select(.merge_commit_sha == $sha and .merged_at != null and .base.ref == "main") | .number] | first // empty' <<<"$merged_prs")" \
            || { echo "No merged main PR matches the exact release SHA"; exit 65; }
          pr_head="$(jq -er --arg sha "$GITHUB_SHA" '[.[] | select(.merge_commit_sha == $sha and .merged_at != null and .base.ref == "main") | .head.sha] | first // empty' <<<"$merged_prs")"
          echo "Merged PR #$pr_number; tested head $pr_head"
          files="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/pulls/$pr_number/files?per_page=100" | jq 'add')"
          expected_files="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.changed_files')"
          test "$(jq 'length' <<<"$files")" -eq "$expected_files" || { echo "Incomplete PR file list; refusing deployment"; exit 65; }
          checks="$(gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/commits/$pr_head/check-runs?per_page=100" | jq '{check_runs: [.[].check_runs[]]}')"
          required=(snapshot security-static safeguards full-audit backend-production frontend-static validate)
          if jq -e 'any(.[]; (.filename | startswith("src/") or startswith("backend/") or startswith("tests/") or . == ".github/workflows/payment-audit.yml"))' <<<"$files" >/dev/null; then
            required+=(backend-payments frontend-payments)
          fi
          for name in "${required[@]}"; do
            result="$(jq -r --arg name "$name" '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at // .started_at) | last | if . == null then "missing" else (.status + "/" + (.conclusion // "unknown")) end' <<<"$checks")"
            echo "$name: $result"
            test "$result" = "completed/success" || { echo "Unsafe to deploy: required check $name did not pass"; exit 65; }
          done

  deploy:
    name: Deploy manually approved release to VPS
    needs: verify-release
    environment:
      name: production
      url: https://app.112233.es
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Install pinned SSH trust and restricted deployment key
        shell: bash
        env:
          PRODUCTION_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          PRODUCTION_HOST_KEYS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_KEY" || { echo "Missing production SSH private key"; exit 65; }
          test -n "$PRODUCTION_HOST_KEYS" || { echo "Missing pinned VPS SSH host key"; exit 65; }
          mkdir -p "$RUNNER_TEMP/112233-ssh"
          chmod 700 "$RUNNER_TEMP/112233-ssh"
          printf '%s\n' "$PRODUCTION_KEY" > "$RUNNER_TEMP/112233-ssh/key"
          printf '%s\n' "$PRODUCTION_HOST_KEYS" > "$RUNNER_TEMP/112233-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/112233-ssh/key" "$RUNNER_TEMP/112233-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/112233-ssh/key" >/dev/null

      - name: Ask forced-command VPS entrypoint to deploy exact SHA
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/112233-ssh/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/112233-ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            root@169.58.147.65 "deploy $GITHUB_SHA"

      - name: Record deployed release
        if: success()
        run: echo "Verified production release $GITHUB_SHA at https://app.112233.es" >> "$GITHUB_STEP_SUMMARY"
