name: Room-first mypy fix

on:
  push:
    branches:
      - feat/room-first-listing-filters
    paths:
      - .github/workflows/room-first-mypy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/room-first-listing-filters
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install backend audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
      - name: Apply type-safe effective-state helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/listings.py')
          source = path.read_text(encoding='utf-8')
          import_old = 'from datetime import UTC, datetime, timedelta\nfrom uuid import UUID\n'
          import_new = 'from datetime import UTC, datetime, timedelta\nfrom typing import cast\nfrom uuid import UUID\n'
          helper_old = '    def effective(api_name: str, current: object) -> object:\n        return changes.get(api_name, current)\n'
          helper_new = '    def effective[T](api_name: str, current: T) -> T:\n        return cast(T, changes.get(api_name, current))\n'
          if import_old not in source:
              raise SystemExit('expected import target not found')
          if helper_old not in source:
              raise SystemExit('expected helper target not found')
          source = source.replace(import_old, import_new, 1).replace(helper_old, helper_new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          cd backend
          ruff check app tests
          mypy app
          pytest -q tests/test_room_first_patch_integrity.py tests/test_room_first_publish_source_contract.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/room-first-mypy-fix.yml
          git config user.name 'Anton Gameza'
          git config user.email 'antony502189@gmail.com'
          git add backend/app/services/listings.py .github/workflows/room-first-mypy-fix.yml
          git commit -m 'fix: preserve types in room-first patch validation'
          git push origin HEAD:feat/room-first-listing-filters
