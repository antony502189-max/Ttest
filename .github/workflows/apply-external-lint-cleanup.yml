name: Apply external import lint cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-external-lint-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact Ruff fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("backend/app/external_sources.py")
          text = source.read_text(encoding="utf-8")
          old = (
              '    if any(term in opening for term in wanted_terms) and not any(marker in opening for marker in offer_markers):\n'
              '        return False\n'
              '    return True\n'
          )
          new = (
              '    return not (\n'
              '        any(term in opening for term in wanted_terms)\n'
              '        and not any(marker in opening for marker in offer_markers)\n'
              '    )\n'
          )
          if text.count(old) != 1:
              raise SystemExit("expected one room-offer return block")
          source.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("backend/tests/test_external_source_contract_audit.py")
          text = test.read_text(encoding="utf-8")
          old = '''class HealthySource:
              name = "Healthy"
              max_discovery_pages = 30
              discovery_diagnostics: dict[str, dict] = {}

              async def discover_listing_urls(self):
          '''
          new = '''class HealthySource:
              name = "Healthy"
              max_discovery_pages = 30

              def __init__(self):
                  self.discovery_diagnostics: dict[str, dict] = {}

              async def discover_listing_urls(self):
          '''
          if text.count(old) != 1:
              raise SystemExit("expected one HealthySource class header")
          test.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m py_compile backend/app/external_sources.py backend/tests/test_external_source_contract_audit.py
          rm .github/workflows/apply-external-lint-cleanup.yml
          git diff --check
      - name: Commit lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/external_sources.py backend/tests/test_external_source_contract_audit.py .github/workflows/apply-external-lint-cleanup.yml
          git commit -m "chore: satisfy external import lint gates"
          git push origin HEAD:${{ github.head_ref }}
