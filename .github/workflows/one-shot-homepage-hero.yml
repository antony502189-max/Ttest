name: One-shot homepage hero promotion

on:
  push:
    branches:
      - feature/homepage-hero-promotion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homepage-hero-promotion
          fetch-depth: 0

      - name: Apply homepage hero promotion feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          def append_once(path: str, marker: str, block: str) -> None:
              file = Path(path)
              text = file.read_text()
              if marker in text:
                  return
              file.write_text(text.rstrip() + "\n\n" + block.strip() + "\n")

          Path('backend/alembic/versions/0043_homepage_hero_promotions.py').write_text('''"""add singleton homepage hero promotion\n\nRevision ID: 0043_homepage_hero_promotions\nRevises: 0042_timed_listing_promotions\n"""\n\nimport sqlalchemy as sa\nfrom sqlalchemy.dialects import postgresql\n\nfrom alembic import op\n\nrevision = "0043_homepage_hero_promotions"\ndown_revision = "0042_timed_listing_promotions"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade() -> None:\n    op.create_table(\n        "homepage_hero_promotions",\n        sa.Column("id", sa.Integer(), nullable=False),\n        sa.Column("listing_id", postgresql.UUID(as_uuid=True), nullable=False),\n        sa.Column("starts_at", sa.DateTime(timezone=True), nullable=False),\n        sa.Column("ends_at", sa.DateTime(timezone=True), nullable=False),\n        sa.Column("configured_by", postgresql.UUID(as_uuid=True), nullable=True),\n        sa.Column("configured_at", sa.DateTime(timezone=True), server_default=sa.func.now(), nullable=False),\n        sa.CheckConstraint("id = 1", name="ck_homepage_hero_promotions_singleton"),\n        sa.ForeignKeyConstraint(["listing_id"], ["listings.id"], ondelete="CASCADE"),\n        sa.ForeignKeyConstraint(["configured_by"], ["users.id"], ondelete="SET NULL"),\n        sa.PrimaryKeyConstraint("id"),\n    )\n    op.create_index("ix_homepage_hero_promotions_listing_id", "homepage_hero_promotions", ["listing_id"], unique=False)\n    op.create_index("ix_homepage_hero_promotions_starts_at", "homepage_hero_promotions", ["starts_at"], unique=False)\n    op.create_index("ix_homepage_hero_promotions_ends_at", "homepage_hero_promotions", ["ends_at"], unique=False)\n\n\ndef downgrade() -> None:\n    op.drop_index("ix_homepage_hero_promotions_ends_at", table_name="homepage_hero_promotions")\n    op.drop_index("ix_homepage_hero_promotions_starts_at", table_name="homepage_hero_promotions")\n    op.drop_index("ix_homepage_hero_promotions_listing_id", table_name="homepage_hero_promotions")\n    op.drop_table("homepage_hero_promotions")\n''')

          replace_once(
              'backend/app/models/moderation.py',
              'from sqlalchemy import Boolean, DateTime, ForeignKey, Integer, String, Text, func',
              'from sqlalchemy import Boolean, CheckConstraint, DateTime, ForeignKey, Integer, String, Text, func',
          )
          replace_once(
              'backend/app/models/moderation.py',
              '''    total_price_cents: Mapped[int | None] = mapped_column(Integer, nullable=True)\n\n\nclass AdminNote(Base):''',
              '''    total_price_cents: Mapped[int | None] = mapped_column(Integer, nullable=True)\n\n\nclass HomepageHeroPromotion(Base):\n    """The single listing scheduled into the homepage hero advertising slot."""\n\n    __tablename__ = "homepage_hero_promotions"\n    __table_args__ = (CheckConstraint("id = 1", name="ck_homepage_hero_promotions_singleton"),)\n\n    id: Mapped[int] = mapped_column(Integer, primary_key=True, default=1)\n    listing_id: Mapped[UUID] = mapped_column(\n        PGUUID(as_uuid=True), ForeignKey("listings.id", ondelete="CASCADE"), nullable=False, index=True\n    )\n    starts_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), nullable=False, index=True)\n    ends_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), nullable=False, index=True)\n    configured_by: Mapped[UUID | None] = mapped_column(ForeignKey("users.id", ondelete="SET NULL"), index=True)\n    configured_at: Mapped[datetime] = mapped_column(DateTime(timezone=True), server_default=func.now())\n\n\nclass AdminNote(Base):''',
          )
          replace_once(
              'backend/app/models/__init__.py',
              '''    AdminNote,\n    ListingPromotion,''',
              '''    AdminNote,\n    HomepageHeroPromotion,\n    ListingPromotion,''',
          )

          replace_once(
              'backend/app/schemas/admin.py',
              '''class ListingPromotionRequest(BaseModel):\n    startsAt: datetime | None = None\n    endsAt: datetime | None = None\n\n\nclass BlockUserRequest''',
              '''class ListingPromotionRequest(BaseModel):\n    startsAt: datetime | None = None\n    endsAt: datetime | None = None\n\n\nclass HomepageHeroPromotionResponse(BaseModel):\n    listingId: UUID\n    startsAt: datetime\n    endsAt: datetime\n    state: PromotionState\n    days: int\n\n\nclass BlockUserRequest''',
          )

          Path('backend/app/services/homepage_hero.py').write_text('''from __future__ import annotations\n\nfrom datetime import UTC, datetime, timedelta\nfrom math import ceil\nfrom uuid import UUID\n\nfrom fastapi import HTTPException\nfrom sqlalchemy import select\nfrom sqlalchemy.ext.asyncio import AsyncSession\n\nfrom ..models import Listing, ListingImage, User\nfrom ..models.moderation import HomepageHeroPromotion\nfrom ..repositories.listings import response_from, visible_query\nfrom ..schemas.admin import HomepageHeroPromotionResponse\nfrom ..schemas.listings import ListingResponse\nfrom .admin import _actionable_listing, audit\nfrom .catalog import touch_catalog\nfrom .moderation import active_listing_restriction, active_user_restriction\n\nHOMEPAGE_HERO_SINGLETON_ID = 1\nDEFAULT_HOMEPAGE_HERO_DAYS = 7\n\n\ndef _as_utc(value: datetime) -> datetime:\n    if value.tzinfo is None:\n        return value.replace(tzinfo=UTC)\n    return value.astimezone(UTC)\n\n\ndef homepage_hero_response(row: HomepageHeroPromotion) -> HomepageHeroPromotionResponse:\n    now = datetime.now(UTC)\n    if row.starts_at > now:\n        state = "scheduled"\n    elif now >= row.ends_at:\n        state = "expired"\n    else:\n        state = "active"\n    days = max(1, ceil((row.ends_at - row.starts_at).total_seconds() / 86_400))\n    return HomepageHeroPromotionResponse(\n        listingId=row.listing_id,\n        startsAt=row.starts_at,\n        endsAt=row.ends_at,\n        state=state,\n        days=days,\n    )\n\n\nasync def get_admin_homepage_hero(session: AsyncSession) -> HomepageHeroPromotionResponse | None:\n    row = await session.get(HomepageHeroPromotion, HOMEPAGE_HERO_SINGLETON_ID)\n    return homepage_hero_response(row) if row else None\n\n\nasync def configure_homepage_hero(\n    listing_id: UUID,\n    actor: User,\n    session: AsyncSession,\n    *,\n    starts_at: datetime | None = None,\n    ends_at: datetime | None = None,\n) -> HomepageHeroPromotionResponse:\n    listing, owner = await _actionable_listing(listing_id, session)\n    if listing.status != "published":\n        raise HTTPException(409, "Only published listings can be featured on the homepage")\n    if await active_listing_restriction(listing.id, session) or await active_user_restriction(owner.id, session):\n        raise HTTPException(409, "Only publicly eligible listings can be featured on the homepage")\n    image_exists = await session.scalar(\n        select(ListingImage.listing_id).where(ListingImage.listing_id == listing.id).limit(1)\n    )\n    if not image_exists:\n        raise HTTPException(409, "Homepage promotion requires at least one listing image")\n\n    now = datetime.now(UTC)\n    start = now if starts_at is None else _as_utc(starts_at)\n    if start < now:\n        if start.date() == now.date():\n            start = now\n        else:\n            raise HTTPException(422, "Homepage promotion start date cannot be in the past")\n\n    end = start + timedelta(days=DEFAULT_HOMEPAGE_HERO_DAYS) if ends_at is None else _as_utc(ends_at)\n    if end <= start:\n        raise HTTPException(422, "Homepage promotion end date must be after its start date")\n\n    row = await session.scalar(\n        select(HomepageHeroPromotion)\n        .where(HomepageHeroPromotion.id == HOMEPAGE_HERO_SINGLETON_ID)\n        .with_for_update()\n    )\n    previous = None\n    if row is None:\n        row = HomepageHeroPromotion(\n            id=HOMEPAGE_HERO_SINGLETON_ID,\n            listing_id=listing.id,\n            starts_at=start,\n            ends_at=end,\n            configured_by=actor.id,\n        )\n        session.add(row)\n    else:\n        previous = {\n            "listingId": str(row.listing_id),\n            "startsAt": row.starts_at.isoformat(),\n            "endsAt": row.ends_at.isoformat(),\n        }\n        row.listing_id = listing.id\n        row.starts_at = start\n        row.ends_at = end\n        row.configured_by = actor.id\n        row.configured_at = now\n\n    session.add(audit(\n        actor.id,\n        "homepage_hero.configured",\n        "listing",\n        listing.id,\n        {\n            "previous": previous,\n            "startsAt": start.isoformat(),\n            "endsAt": end.isoformat(),\n        },\n    ))\n    await touch_catalog(session)\n    await session.commit()\n    return homepage_hero_response(row)\n\n\nasync def remove_homepage_hero(actor: User, session: AsyncSession) -> None:\n    row = await session.scalar(\n        select(HomepageHeroPromotion)\n        .where(HomepageHeroPromotion.id == HOMEPAGE_HERO_SINGLETON_ID)\n        .with_for_update()\n    )\n    if row is None:\n        raise HTTPException(404, "Homepage promotion is not configured")\n    listing_id = row.listing_id\n    detail = {"startsAt": row.starts_at.isoformat(), "endsAt": row.ends_at.isoformat()}\n    await session.delete(row)\n    session.add(audit(actor.id, "homepage_hero.removed", "listing", listing_id, detail))\n    await touch_catalog(session)\n    await session.commit()\n\n\nasync def get_active_homepage_hero_listing(session: AsyncSession) -> ListingResponse | None:\n    now = datetime.now(UTC)\n    promotion = await session.scalar(\n        select(HomepageHeroPromotion).where(\n            HomepageHeroPromotion.id == HOMEPAGE_HERO_SINGLETON_ID,\n            HomepageHeroPromotion.starts_at <= now,\n            HomepageHeroPromotion.ends_at > now,\n        )\n    )\n    if promotion is None:\n        return None\n    row = (await session.execute(visible_query().where(Listing.id == promotion.listing_id))).one_or_none()\n    return response_from(row) if row else None\n''')

          replace_once(
