name: Temporary customer-priority synchronization

on:
  push:
    branches: [feat/customer-priority-room-filters-location]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/customer-priority-room-filters-location
          fetch-depth: 0
      - name: Apply synchronization fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          Path('src/lib/location-privacy.ts').write_text(r'''import { TENERIFE_CENTER, isInsideTenerife } from '@/lib/tenerife'
          import type { Coordinates } from '@/types'

          const EARTH_RADIUS_METERS = 6_371_000
          const PUBLIC_OFFSET_METERS = 220

          function seedFor(point: Coordinates) {
            const source = `${point.lat.toFixed(6)},${point.lng.toFixed(6)}`
            let hash = 2166136261
            for (const character of source) {
              hash ^= character.charCodeAt(0)
              hash = Math.imul(hash, 16777619)
            }
            return hash >>> 0
          }

          function offsetPoint(origin: Coordinates, distanceMeters: number, angleRadians: number): Coordinates {
            const angularDistance = distanceMeters / EARTH_RADIUS_METERS
            const lat1 = origin.lat * Math.PI / 180
            const lng1 = origin.lng * Math.PI / 180
            const sinLat1 = Math.sin(lat1)
            const cosLat1 = Math.cos(lat1)
            const sinDistance = Math.sin(angularDistance)
            const cosDistance = Math.cos(angularDistance)
            const lat2 = Math.asin(sinLat1 * cosDistance + cosLat1 * sinDistance * Math.cos(angleRadians))
            const lng2 = lng1 + Math.atan2(
              Math.sin(angleRadians) * sinDistance * cosLat1,
              cosDistance - sinLat1 * Math.sin(lat2),
            )
            return { lat: lat2 * 180 / Math.PI, lng: lng2 * 180 / Math.PI }
          }

          function bearingTowards(origin: Coordinates, target: Coordinates) {
            const lat1 = origin.lat * Math.PI / 180
            const lat2 = target.lat * Math.PI / 180
            const deltaLng = (target.lng - origin.lng) * Math.PI / 180
            return Math.atan2(
              Math.sin(deltaLng) * Math.cos(lat2),
              Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(deltaLng),
            )
          }

          export function distanceMeters(left: Coordinates, right: Coordinates) {
            const lat1 = left.lat * Math.PI / 180
            const lat2 = right.lat * Math.PI / 180
            const deltaLat = (right.lat - left.lat) * Math.PI / 180
            const deltaLng = (right.lng - left.lng) * Math.PI / 180
            const a = Math.sin(deltaLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(deltaLng / 2) ** 2
            return 2 * EARTH_RADIUS_METERS * Math.asin(Math.min(1, Math.sqrt(a)))
          }

          export function approximatePublicCoordinates(exact: Coordinates): Coordinates {
            const seed = seedFor(exact)
            const initialAngle = (seed % 360) * Math.PI / 180
            for (let attempt = 0; attempt < 8; attempt += 1) {
              const candidate = offsetPoint(exact, PUBLIC_OFFSET_METERS, initialAngle + attempt * Math.PI / 4)
              if (isInsideTenerife(candidate)) return candidate
            }
            return offsetPoint(exact, PUBLIC_OFFSET_METERS, bearingTowards(exact, TENERIFE_CENTER))
          }
          '''.replace('\n          ', '\n').lstrip())

          Path('src/lib/floor.ts').write_text(r'''import type { FloorLevel, Listing } from '@/types'

          const FLOOR_RANK: Record<FloorLevel, number> = {
            basement: 0,
            '1': 1,
            '2': 2,
            '3': 3,
            '4+': 4,
            top: 5,
          }

          export function floorRank(floor: Listing['floor']) {
            return floor == null ? null : FLOOR_RANK[floor]
          }

          export function compareListingFloors(
            left: Pick<Listing, 'id' | 'floor'>,
            right: Pick<Listing, 'id' | 'floor'>,
            direction: 'asc' | 'desc',
          ) {
            const leftRank = floorRank(left.floor)
            const rightRank = floorRank(right.floor)
            if (leftRank == null && rightRank == null) return left.id.localeCompare(right.id)
            if (leftRank == null) return 1
            if (rightRank == null) return -1
            const delta = direction === 'asc' ? leftRank - rightRank : rightRank - leftRank
            return delta || left.id.localeCompare(right.id)
          }
          '''.replace('\n          ', '\n').lstrip())

          replace_once(
            'src/pages/PublishPage.tsx',
            'import { getCriticalRestrictions, getPrimaryPrice } from "@/lib/listings";\n',
            'import { getCriticalRestrictions, getPrimaryPrice } from "@/lib/listings";\nimport { approximatePublicCoordinates } from "@/lib/location-privacy";\n',
          )
          replace_once(
            'src/pages/PublishPage.tsx',
            '  const availableSpots = Math.max(0, draft.roomCapacity - draft.currentRoomResidents);\n  const listing: Listing = {',
            '  const availableSpots = Math.max(0, draft.roomCapacity - draft.currentRoomResidents);\n  const exactCoordinates = draft.coordinates;\n  const publicCoordinates = approximatePublicCoordinates(exactCoordinates);\n  const listing: Listing = {',
          )
          replace_once(
            'src/pages/PublishPage.tsx',
            '    coordinates: draft.coordinates,\n',
            '    coordinates: publicCoordinates,\n    exactCoordinates,\n',
          )

          replace_once(
            'src/components/mobile-search-results-v2.tsx',
            "import { filtersFromParams, filtersToParams } from '@/lib/search'\n",
            "import { filtersFromParams, filtersToParams } from '@/lib/search'\nimport { compareListingFloors } from '@/lib/floor'\n",
          )
          replace_once(
            'src/components/mobile-search-results-v2.tsx',
            "function stableFloor(listing: Listing) {\n  return [...listing.id].reduce((value, character) => (value * 31 + character.charCodeAt(0)) % 11, 0)\n}\n\n",
            '',
          )
          replace_once(
            'src/components/mobile-search-results-v2.tsx',
            "    if (order === 'floor-high') return stableFloor(b) - stableFloor(a)\n    if (order === 'floor-low') return stableFloor(a) - stableFloor(b)\n",
            "    if (order === 'floor-high') return compareListingFloors(a, b, 'desc')\n    if (order === 'floor-low') return compareListingFloors(a, b, 'asc')\n",
          )

          replace_once(
            'src/lib/search.ts',
            "    if (filters.availableUntil && (!listing.availableUntil || listing.availableUntil < filters.availableUntil)) return false\n",
            "    if (filters.availableUntil && listing.availableUntil && listing.availableUntil < filters.availableUntil) return false\n",
          )

          replace_once(
            'src/contexts/i18n-context.tsx',
            "  'Aire acondicionado': { ru: 'Кондиционер', en: 'Air conditioning' },\n",
            "  'Aire acondicionado': { ru: 'Кондиционер', en: 'Air conditioning' },\n  'Jardín': { ru: 'Сад', en: 'Garden' },\n  'Limpieza incluida': { ru: 'Уборка включена', en: 'Cleaning included' },\n  'Planta': { ru: 'Этаж', en: 'Floor' },\n  'Sótano / semisótano': { ru: 'Цокольный / полуподвальный этаж', en: 'Basement / semi-basement' },\n  'Última planta': { ru: 'Последний этаж', en: 'Top floor' },\n  'Empieza a escribir Calle, número…': { ru: 'Начните вводить улицу и номер…', en: 'Start typing street and number…' },\n  'Calle y número': { ru: 'Улица и номер', en: 'Street and number' },\n  'Ubicación seleccionada': { ru: 'Выбранное местоположение', en: 'Selected location' },\n",
          )

          Path('src/components/publish-location-enhancer.tsx').write_text(r'''import { useEffect } from 'react'
          import { useI18n } from '@/contexts/i18n-context'
          import { googleMapsTestSdkEnabled, loadGoogleMaps } from '@/lib/google-maps/loader'
          import { TENERIFE_BOUNDS, isInsideTenerife } from '@/lib/tenerife'
          import type { Coordinates } from '@/types'
          import '@/publish-location-enhancer.css'

          type AddressComponent = { longText?: string; long_name?: string; types: string[] }
          type AddressDetail = { formattedAddress?: string; addressComponents?: AddressComponent[]; coordinates?: Coordinates }

          function component(components: AddressComponent[], type: string) {
            const item = components.find((entry) => entry.types.includes(type))
            return (item?.longText ?? item?.long_name ?? '').trim()
          }

          function setNativeValue(element: HTMLInputElement | HTMLSelectElement | null, value: string) {
            if (!element || !value) return
            if (element instanceof HTMLSelectElement && !Array.from(element.options).some((option) => option.value === value)) return
            const prototype = element instanceof HTMLSelectElement ? HTMLSelectElement.prototype : HTMLInputElement.prototype
            const setter = Object.getOwnPropertyDescriptor(prototype, 'value')?.set
            setter?.call(element, value)
            element.dispatchEvent(new Event('input', { bubbles: true }))
            element.dispatchEvent(new Event('change', { bubbles: true }))
          }

          function matchingSelectValue(element: HTMLSelectElement | null, candidates: string[]) {
            if (!element) return ''
            const available = new Set(Array.from(element.options, (option) => option.value))
            return candidates.find((candidate) => candidate && available.has(candidate)) ?? ''
          }

          function applyAddress(detail: AddressDetail) {
            const components = detail.addressComponents ?? []
            const route = component(components, 'route')
            const number = component(components, 'street_number')
            const postcode = component(components, 'postal_code')
            const locality = component(components, 'locality')
            const municipality = component(components, 'administrative_area_level_3')
            const municipalFallback = component(components, 'administrative_area_level_4')
            const citySelect = document.querySelector<HTMLSelectElement>('#publish-city')
            const city = matchingSelectValue(citySelect, [municipality, municipalFallback, locality])
            const area = component(components, 'sublocality_level_1')
              || component(components, 'sublocality')
              || component(components, 'neighborhood')
              || (locality && locality !== city ? locality : '')
            const street = [route, number].filter(Boolean).join(' ').trim() || detail.formattedAddress?.split(',')[0]?.trim() || ''
            setNativeValue(document.querySelector<HTMLInputElement>('#publish-street'), street)
            setNativeValue(document.querySelector<HTMLInputElement>('#publish-postcode'), postcode)
            setNativeValue(citySelect, city)
            setNativeValue(document.querySelector<HTMLInputElement>('#publish-area'), area)
          }

          export function PublishLocationEnhancer() {
            const { language } = useI18n()
            const placeholder = language === 'ru' ? 'Начните вводить улицу и номер…' : language === 'en' ? 'Start typing street and number…' : 'Empieza a escribir Calle, número…'
            const ariaLabel = language === 'ru' ? 'Улица и номер' : language === 'en' ? 'Street and number' : 'Calle y número'

            useEffect(() => {
              let cancelled = false
              const widgets = new Set<HTMLElement>()

              const handleResolved = (event: Event) => applyAddress((event as CustomEvent<AddressDetail>).detail ?? {})
              window.addEventListener('112233:map-address-resolved', handleResolved)

              const setup = async () => {
                const input = document.querySelector<HTMLInputElement>('#publish-street')
                if (!input || input.dataset.addressAutocomplete) return
                input.dataset.addressAutocomplete = 'pending'
                input.placeholder = placeholder
                input.autocomplete = 'street-address'
                if (googleMapsTestSdkEnabled) { input.dataset.addressAutocomplete = 'test'; return }
                try {
                  await loadGoogleMaps()
                  const places = await google.maps.importLibrary('places') as google.maps.PlacesLibrary
                  if (cancelled || !input.isConnected) return
                  const autocomplete = new places.PlaceAutocompleteElement({})
                  autocomplete.classList.add('publish-place-autocomplete')
                  autocomplete.placeholder = placeholder
                  autocomplete.includedRegionCodes = ['es']
                  autocomplete.locationRestriction = TENERIFE_BOUNDS
                  autocomplete.setAttribute('aria-label', ariaLabel)
                  autocomplete.addEventListener('gmp-select', async (rawEvent) => {
                    const event = rawEvent as google.maps.places.PlacePredictionSelectEvent
                    const place = event.placePrediction.toPlace()
                    await place.fetchFields({ fields: ['formattedAddress', 'location', 'addressComponents'] })
                    if (!place.location) return
                    const coordinates = { lat: place.location.lat(), lng: place.location.lng() }
                    if (!isInsideTenerife(coordinates)) return
                    const detail: AddressDetail = { formattedAddress: place.formattedAddress ?? '', addressComponents: (place.addressComponents ?? []) as AddressComponent[], coordinates }
                    applyAddress(detail)
                    window.dispatchEvent(new CustomEvent('112233:publish-location-selected', { detail: { coordinates } }))
                  })
                  input.insertAdjacentElement('beforebegin', autocomplete)
                  input.classList.add('publish-street-source-input')
                  input.dataset.addressAutocomplete = 'ready'
                  widgets.add(autocomplete)
                } catch {
                  input.dataset.addressAutocomplete = 'fallback'
                  input.classList.remove('publish-street-source-input')
                }
              }

              const observer = new MutationObserver(() => { void setup() })
              observer.observe(document.body, { childList: true, subtree: true })
              void setup()
              return () => {
                cancelled = true
                observer.disconnect()
                window.removeEventListener('112233:map-address-resolved', handleResolved)
                widgets.forEach((widget) => widget.remove())
                const input = document.querySelector<HTMLInputElement>('#publish-street')
                if (input) {
                  delete input.dataset.addressAutocomplete
                  input.classList.remove('publish-street-source-input')
                }
              }
            }, [ariaLabel, placeholder])
            return null
          }
          '''.replace('\n          ', '\n').lstrip())

          replace_once(
            'tests/delta-matrix.spec.ts',
            "  expect(listing.coordinates.lat).toBeCloseTo(movedLat, 4)\n  expect(listing.coordinates.lng).toBeCloseTo(movedLng, 4)\n",
            "  expect(listing.exactCoordinates?.lat).toBeCloseTo(movedLat, 4)\n  expect(listing.exactCoordinates?.lng).toBeCloseTo(movedLng, 4)\n  expect(Math.abs(listing.coordinates.lat - movedLat) + Math.abs(listing.coordinates.lng - movedLng)).toBeGreaterThan(0.001)\n",
          )

          Path('tests/customer-priority-sync.spec.ts').write_text(r'''import { expect, test } from '@playwright/test'
          import { translateText } from '@/contexts/i18n-context'
          import { defaultFilters, initialListings } from '@/data/listings'
          import { compareListingFloors } from '@/lib/floor'
          import { approximatePublicCoordinates, distanceMeters } from '@/lib/location-privacy'
          import { filterListings } from '@/lib/search'
          import type { Listing } from '@/types'

          test('CUSTOMER-SYNC exact publication coordinates stay private and public point is deterministic', () => {
            const exact = { lat: 28.0521, lng: -16.7177 }
            const first = approximatePublicCoordinates(exact)
            const second = approximatePublicCoordinates(exact)
            expect(first).toEqual(second)
            expect(first).not.toEqual(exact)
            expect(distanceMeters(exact, first)).toBeGreaterThanOrEqual(150)
            expect(distanceMeters(exact, first)).toBeLessThanOrEqual(300)
          })

          test('CUSTOMER-SYNC floor ordering uses structured floor instead of listing id', () => {
            const listings: Array<Pick<Listing, 'id' | 'floor'>> = [
              { id: 'aaa', floor: 'top' },
              { id: 'zzz', floor: 'basement' },
              { id: 'middle', floor: '2' },
              { id: 'legacy', floor: null },
            ]
            const ascending = [...listings].sort((left, right) => compareListingFloors(left, right, 'asc'))
            const descending = [...listings].sort((left, right) => compareListingFloors(left, right, 'desc'))
            expect(ascending.map((listing) => listing.floor)).toEqual(['basement', '2', 'top', null])
            expect(descending.map((listing) => listing.floor)).toEqual(['top', '2', 'basement', null])
          })

          test('CUSTOMER-SYNC open-ended availability satisfies an optional requested move-out date', () => {
            const seed = initialListings.find((listing) => listing.rentalMode === 'long')
            expect(seed).toBeTruthy()
            const listing: Listing = {
              ...seed!,
              rentalMode: 'long',
              status: 'Publicado',
              availableFrom: '2020-01-01',
              availableUntil: undefined,
              expiresAt: '2099-01-01',
            }
            const filters = { ...defaultFilters, availableUntil: '2030-01-01' }
            expect(filterListings([listing], 'long', filters).map((item) => item.id)).toEqual([listing.id])
          })

          test('CUSTOMER-SYNC new filter and publication labels are localized', () => {
            expect(translateText('Jardín', 'ru')).toBe('Сад')
            expect(translateText('Jardín', 'en')).toBe('Garden')
            expect(translateText('Limpieza incluida', 'ru')).toBe('Уборка включена')
            expect(translateText('Limpieza incluida', 'en')).toBe('Cleaning included')
            expect(translateText('Planta', 'ru')).toBe('Этаж')
            expect(translateText('Última planta', 'en')).toBe('Top floor')
            expect(translateText('Calle y número', 'ru')).toBe('Улица и номер')
          })
          '''.replace('\n          ', '\n').lstrip())
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git diff --cached --check
          git commit -m 'fix: synchronize customer priority filters and location privacy'
          git push origin HEAD:feat/customer-priority-room-filters-location
