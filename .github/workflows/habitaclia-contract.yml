name: Habitaclia source contract

on:
  pull_request:
    branches: [main]
    paths:
      - backend/app/__init__.py
      - backend/app/habitaclia_source.py
      - backend/app/commands/audit_habitaclia_source.py
      - backend/tests/test_habitaclia_source.py
      - .github/workflows/habitaclia-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: habitaclia-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  habitaclia-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      PYTHONUNBUFFERED: "1"
      EXTERNAL_IMPORT_PLAYWRIGHT_ENABLED: "0"
      EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: "25"
      EXTERNAL_IMPORT_USER_AGENT: "112233.es Habitaclia room-source audit"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install backend audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
          python -m pip check
      - name: Run Habitaclia regression tests
        working-directory: backend
        run: pytest -q tests/test_habitaclia_source.py
      - name: Verify live Habitaclia discovery and room normalization
        working-directory: backend
        run: |
          python -m app.commands.audit_habitaclia_source \
            --max-pages 30 \
            --max-details 20 \
            --detail-timeout 35 \
            --output ../output/habitaclia-contract.json
      - name: Upload Habitaclia audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: habitaclia-contract-report
          path: output/habitaclia-contract.json
          if-no-files-found: ignore
          retention-days: 7
