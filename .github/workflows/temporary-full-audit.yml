name: Temporary Full Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply remaining audit fixes once
        id: fix
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = False

          for path in Path('backend/tests').rglob('*.py'):
              text = path.read_text()
              updated = text.replace('@example.test', '@example.com')
              if updated != text:
                  path.write_text(updated)
                  changed = True

          pyproject = Path('backend/pyproject.toml')
          text = pyproject.read_text()
          anchor = 'asyncio_mode = "auto"\n'
          additions = (
              'asyncio_default_fixture_loop_scope = "session"\n'
              'asyncio_default_test_loop_scope = "session"\n'
          )
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('pytest asyncio configuration anchor not found')
              pyproject.write_text(text.replace(anchor, anchor + additions, 1))
              changed = True

          app_context = Path('src/contexts/app-context.tsx')
          text = app_context.read_text()
          import_line = "import { MockAppProvider } from '@/contexts/mock-app-provider'\n"
          import_anchor = "import { createRemoteReport, getRemoteReports } from '@/api/reports'\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('app-context import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
              changed = True
          if 'export interface AppState {' not in text:
              text = text.replace('interface AppState {', 'export interface AppState {', 1)
              changed = True
          if 'export const AppContext = createContext<AppState | null>(null)' not in text:
              text = text.replace(
                  'const AppContext = createContext<AppState | null>(null)',
                  'export const AppContext = createContext<AppState | null>(null)',
                  1,
              )
              changed = True
          if 'function RemoteAppProvider(' not in text:
              text = text.replace(
                  'export function AppProvider({ children }: { children: ReactNode }) {',
                  'function RemoteAppProvider({ children }: { children: ReactNode }) {',
                  1,
              )
              changed = True
          wrapper = """export function AppProvider({ children }: { children: ReactNode }) {
            return mockMode
              ? <MockAppProvider context={AppContext}>{children}</MockAppProvider>
              : <RemoteAppProvider>{children}</RemoteAppProvider>
          }

          """.replace('          ', '')
          if wrapper not in text:
              text = text.replace('export function useApp() {', wrapper + 'export function useApp() {', 1)
              changed = True
          if changed:
              app_context.write_text(text)
          PY
          git config user.name 'full-audit-bot'
          git config user.email 'full-audit-bot@users.noreply.github.com'
          git add backend/tests backend/pyproject.toml src/contexts/app-context.tsx src/contexts/mock-app-provider.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: resolve remaining full audit blockers'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.fix.outputs.changed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        if: steps.fix.outputs.changed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Show tool versions
        if: steps.fix.outputs.changed != 'true'
        run: |
          python --version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Run complete local audit
        if: steps.fix.outputs.changed != 'true'
        run: |
          mkdir -p output
          set -o pipefail
          bash scripts/final-audit-local.sh 2>&1 | tee output/full-audit.log

      - name: Capture Docker state
        if: always() && steps.fix.outputs.changed != 'true'
        run: |
          mkdir -p output
          docker compose ps --all > output/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > output/docker-compose.log 2>&1 || true

      - name: Upload audit artifacts
        if: always() && steps.fix.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: temporary-full-audit-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/**
            test-results/**
            playwright-report/**
            backend/var/test-media/**

      - name: Stop audit infrastructure
        if: always() && steps.fix.outputs.changed != 'true'
        run: docker compose down --volumes --remove-orphans || true
