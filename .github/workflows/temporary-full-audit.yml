name: Temporary Full Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Show tool versions
        run: |
          python --version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Run complete local audit
        run: |
          mkdir -p output
          set -o pipefail
          bash scripts/final-audit-local.sh 2>&1 | tee output/full-audit.log

      - name: Capture Docker state
        if: always()
        run: |
          mkdir -p output
          docker compose ps --all > output/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > output/docker-compose.log 2>&1 || true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-full-audit-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/**
            test-results/**
            playwright-report/**
            backend/var/test-media/**

      - name: Stop audit infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans || true
