name: Temporary Full Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply deterministic lint fixes to audit branch
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              file.write_text(text.replace(old, new))

          replace(
              "backend/app/schemas/listings.py",
              '''        if self.model_fields_set & coordinate_fields:\n            if not coordinate_fields.issubset(self.model_fields_set) or self.latitude is None or self.longitude is None:\n                raise ValueError("latitude and longitude must be changed together")\n''',
              '''        if (\n            self.model_fields_set & coordinate_fields\n            and (\n                not coordinate_fields.issubset(self.model_fields_set)\n                or self.latitude is None\n                or self.longitude is None\n            )\n        ):\n            raise ValueError("latitude and longitude must be changed together")\n''',
          )
          replace(
              "backend/app/services/listings.py",
              '''    avatars = set(\n        value\n        for value in (await session.scalars(select(User.avatar_asset_id).where(User.avatar_asset_id.in_(candidate_ids)))).all()\n        if value is not None\n    )\n''',
              '''    avatars = {\n        value\n        for value in (await session.scalars(select(User.avatar_asset_id).where(User.avatar_asset_id.in_(candidate_ids)))).all()\n        if value is not None\n    }\n''',
          )
          replace(
              "backend/app/services/rate_limit.py",
              "from time import monotonic\n\nfrom ..core.config import get_settings\n",
              "from time import monotonic\n\nfrom redis.exceptions import RedisError\n\nfrom ..core.config import get_settings\n",
          )
          rate_limit = Path("backend/app/services/rate_limit.py")
          rate_limit.write_text(rate_limit.read_text().replace("except Exception:", "except RedisError:"))

          conftest = Path("backend/tests/integration/conftest.py")
          conftest.write_text(conftest.read_text().replace("  # noqa: E402", ""))

          audit = Path("scripts/final-audit-local.sh")
          audit.write_text(
              audit.read_text().replace(
                  "cleanup() {\n  docker compose logs --no-color backend mail-worker > output/backend-audit.log 2>&1 || true\n}",
                  "cleanup() {\n  mkdir -p output\n  docker compose logs --no-color backend mail-worker > output/backend-audit.log 2>&1 || true\n}",
              )
          )
          PY
          python -m pip install 'ruff==0.16.0'
          ruff check --fix backend/app backend/tests || true
          git config user.name 'full-audit-bot'
          git config user.email 'full-audit-bot@users.noreply.github.com'
          git add backend scripts/final-audit-local.sh
          if ! git diff --cached --quiet; then
            git commit -m 'style: fix backend audit lint findings'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Show tool versions
        run: |
          python --version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Run complete local audit
        run: |
          mkdir -p output
          set -o pipefail
          bash scripts/final-audit-local.sh 2>&1 | tee output/full-audit.log

      - name: Capture Docker state
        if: always()
        run: |
          mkdir -p output
          docker compose ps --all > output/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > output/docker-compose.log 2>&1 || true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-full-audit-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/**
            test-results/**
            playwright-report/**
            backend/var/test-media/**

      - name: Stop audit infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans || true
