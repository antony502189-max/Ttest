name: Temporary Full Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout approved visual baselines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: visual-baselines
          path: .visual-baselines
          persist-credentials: false

      - name: Install approved visual baselines
        run: |
          mkdir -p tests/visual-snapshots
          cp -R .visual-baselines/tests/visual-snapshots/. tests/visual-snapshots/

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python visual-audit dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Show tool versions
        run: |
          python --version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Validate production deployment configuration
        run: bash scripts/check-production-config.sh

      - name: Validate dependency security policy
        run: npm run test:security

      - name: Run complete local audit
        run: |
          mkdir -p output
          set -o pipefail
          bash scripts/final-audit-local.sh 2>&1 | tee output/full-audit.log

      - name: Capture Docker state
        if: always()
        run: |
          mkdir -p output
          docker compose ps --all > output/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > output/docker-compose.log 2>&1 || true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: temporary-full-audit-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/**
            test-results/**
            playwright-report/**
            backend/var/test-media/**

      - name: Stop audit infrastructure
        if: always()
        run: docker compose down --volumes --remove-orphans || true

  apply-import-order-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Apply, validate and commit exact import correction
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/external_import.py')
          text = path.read_text(encoding='utf-8')
          old = '''from __future__ import annotations

from collections.abc import Iterable

import asyncio
import hashlib
import json
import logging
import re
import unicodedata
'''
          new = '''from __future__ import annotations

import asyncio
import hashlib
import json
import logging
import re
import unicodedata
from collections.abc import Iterable
'''
          if new in text and old not in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('expected unique unsorted import block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          if git diff --quiet; then
            exit 0
          fi
          test "$(git diff --name-only)" = 'backend/app/services/external_import.py'
          git diff --check
          python3 -m py_compile backend/app/services/external_import.py

          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)"
          test "$remote_sha" = "$base_sha"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/external_import.py
          git commit -m 'fix: sort importer standard-library imports'
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$authenticated_remote" "HEAD:refs/heads/$HEAD_REF"
