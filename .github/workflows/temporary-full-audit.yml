name: Temporary Full Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Activate isolated mock provider once
        id: wire
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/contexts/app-context.tsx')
          text = path.read_text()
          original = text

          replacements = [
              (
                  "import { createRemoteReport, getRemoteReports } from '@/api/reports'\n",
                  "import { createRemoteReport, getRemoteReports } from '@/api/reports'\nimport { MockAppProvider } from '@/contexts/mock-app-provider'\n",
              ),
              ('interface AppState {', 'export interface AppState {'),
              (
                  'const AppContext = createContext<AppState | null>(null)',
                  'export const AppContext = createContext<AppState | null>(null)',
              ),
              (
                  'export function AppProvider({ children }: { children: ReactNode }) {',
                  'function RemoteAppProvider({ children }: { children: ReactNode }) {',
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'anchor not found: {old}')
              text = text.replace(old, new, 1)

          wrapper = """export function AppProvider({ children }: { children: ReactNode }) {
            return mockMode
              ? <MockAppProvider context={AppContext}>{children}</MockAppProvider>
              : <RemoteAppProvider>{children}</RemoteAppProvider>
          }

          """.replace('          ', '')
          if wrapper not in text:
              anchor = 'export function useApp() {'
              if anchor not in text:
                  raise SystemExit('useApp anchor not found')
              text = text.replace(anchor, wrapper + anchor, 1)

          if text != original:
              path.write_text(text)
          PY
          git config user.name 'full-audit-bot'
          git config user.email 'full-audit-bot@users.noreply.github.com'
          git add src/contexts/app-context.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'feat: activate isolated mock provider for local mode'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.wire.outputs.changed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        if: steps.wire.outputs.changed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Show tool versions
        if: steps.wire.outputs.changed != 'true'
        run: |
          python --version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Run complete local audit
        if: steps.wire.outputs.changed != 'true'
        run: |
          mkdir -p output
          set -o pipefail
          bash scripts/final-audit-local.sh 2>&1 | tee output/full-audit.log

      - name: Capture Docker state
        if: always() && steps.wire.outputs.changed != 'true'
        run: |
          mkdir -p output
          docker compose ps --all > output/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > output/docker-compose.log 2>&1 || true

      - name: Upload audit artifacts
        if: always() && steps.wire.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: temporary-full-audit-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/**
            test-results/**
            playwright-report/**
            backend/var/test-media/**

      - name: Stop audit infrastructure
        if: always() && steps.wire.outputs.changed != 'true'
        run: docker compose down --volumes --remove-orphans || true
