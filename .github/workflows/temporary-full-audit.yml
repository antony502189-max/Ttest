name: Temporary Full Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-full-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Disable remote listing search in mock mode once
        id: fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/SearchPage.tsx')
          text = path.read_text()
          anchor = "  useEffect(() => {\n    let cancelled = false;\n    setServerLoading(true);\n"
          replacement = "  useEffect(() => {\n    if (mockMode) {\n      setServerItems(null);\n      setServerLoading(false);\n      setServerError(false);\n      return;\n    }\n    let cancelled = false;\n    setServerLoading(true);\n"
          if replacement not in text:
              if anchor not in text:
                  raise SystemExit('SearchPage server search effect anchor not found')
              path.write_text(text.replace(anchor, replacement, 1))
          PY
          git config user.name 'full-audit-bot'
          git config user.email 'full-audit-bot@users.noreply.github.com'
          git add src/pages/SearchPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix: keep mock search fully local'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.fix.outputs.changed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        if: steps.fix.outputs.changed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Show tool versions
        if: steps.fix.outputs.changed != 'true'
        run: |
          python --version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Run complete local audit
        if: steps.fix.outputs.changed != 'true'
        run: |
          mkdir -p output
          set -o pipefail
          bash scripts/final-audit-local.sh 2>&1 | tee output/full-audit.log

      - name: Capture Docker state
        if: always() && steps.fix.outputs.changed != 'true'
        run: |
          mkdir -p output
          docker compose ps --all > output/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > output/docker-compose.log 2>&1 || true

      - name: Upload audit artifacts
        if: always() && steps.fix.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: temporary-full-audit-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/**
            test-results/**
            playwright-report/**
            backend/var/test-media/**

      - name: Stop audit infrastructure
        if: always() && steps.fix.outputs.changed != 'true'
        run: docker compose down --volumes --remove-orphans || true
