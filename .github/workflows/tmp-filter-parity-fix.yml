name: Temporary filter parity fix

on:
  push:
    branches: [audit/filter-layer-parity-20260820]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/filter-layer-parity-20260820
          fetch-depth: 0
      - name: Align local holiday minimum-night semantics with backend SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/search.ts')
          text = path.read_text()
          old = "if (mode === 'holiday' && filters.minimumNights > 0 && (listing.minimumNights ?? 1) > filters.minimumNights) return false"
          new = "if (mode === 'holiday' && filters.minimumNights > 0 && (listing.minimumNights == null || listing.minimumNights > filters.minimumNights)) return false"
          if text.count(old) != 1:
              raise SystemExit(f'expected one minimum-night parity anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/search.ts
          git commit -m 'fix: align holiday minimum-night filtering across layers'
          git push origin HEAD:audit/filter-layer-parity-20260820