name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: VITE_BASE_PATH=/Ttest/ npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ttest
          POSTGRES_USER: ttest
          POSTGRES_PASSWORD: ttest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttest -d ttest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -e "backend[dev]"
      - run: ruff check backend/app
      - run: mypy backend/app
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://ttest:ttest@localhost:5432/ttest
      - run: pytest -q backend/tests
        env:
          DATABASE_URL: postgresql+asyncpg://ttest:ttest@localhost:5432/ttest
      - run: docker build -t ttest-backend ./backend

  full-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Wire isolated mock provider once
        id: wire
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/contexts/app-context.tsx')
          text = path.read_text()
          changed = False

          import_line = "import { MockAppProvider } from '@/contexts/mock-app-provider'\n"
          anchor = "import { createRemoteReport, getRemoteReports } from '@/api/reports'\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('app-context import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)
              changed = True

          if 'export interface AppState {' not in text:
              text = text.replace('interface AppState {', 'export interface AppState {', 1)
              changed = True

          if 'export const AppContext = createContext<AppState | null>(null)' not in text:
              text = text.replace(
                  'const AppContext = createContext<AppState | null>(null)',
                  'export const AppContext = createContext<AppState | null>(null)',
                  1,
              )
              changed = True

          if 'function RemoteAppProvider(' not in text:
              text = text.replace(
                  'export function AppProvider({ children }: { children: ReactNode }) {',
                  'function RemoteAppProvider({ children }: { children: ReactNode }) {',
                  1,
              )
              changed = True

          wrapper = """export function AppProvider({ children }: { children: ReactNode }) {
  return mockMode
    ? <MockAppProvider context={AppContext}>{children}</MockAppProvider>
    : <RemoteAppProvider>{children}</RemoteAppProvider>
}

"""
          if wrapper not in text:
              text = text.replace('export function useApp() {', wrapper + 'export function useApp() {', 1)
              changed = True

          if changed:
              path.write_text(text)
          PY
          git config user.name 'full-audit-bot'
          git config user.email 'full-audit-bot@users.noreply.github.com'
          git add src/contexts/app-context.tsx src/contexts/mock-app-provider.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'test: wire isolated mock application provider'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.wire.outputs.changed != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 22
        if: steps.wire.outputs.changed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run complete local audit
        if: steps.wire.outputs.changed != 'true'
        run: |
          mkdir -p output
          set -o pipefail
          bash scripts/final-audit-local.sh 2>&1 | tee output/full-audit.log

      - name: Capture Docker state
        if: always() && steps.wire.outputs.changed != 'true'
        run: |
          mkdir -p output
          docker compose ps --all > output/docker-ps.txt 2>&1 || true
          docker compose logs --no-color > output/docker-compose.log 2>&1 || true

      - name: Upload audit artifacts
        if: always() && steps.wire.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-audit-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            output/**
            test-results/**
            playwright-report/**
            backend/var/test-media/**

      - name: Stop audit infrastructure
        if: always() && steps.wire.outputs.changed != 'true'
        run: docker compose down --volumes --remove-orphans || true
