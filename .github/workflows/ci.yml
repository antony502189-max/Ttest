name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: VITE_BASE_PATH=/Ttest/ npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: ttest
          POSTGRES_USER: ttest
          POSTGRES_PASSWORD: ttest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ttest -d ttest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -e "backend[dev]"
      - run: ruff check backend/app
      - run: mypy backend/app
      - run: pytest -q backend/tests
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://ttest:ttest@localhost:5432/ttest
      - run: docker build -t ttest-backend ./backend
