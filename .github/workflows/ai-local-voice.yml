name: AI local voice without outbound audio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ai-local-voice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-asr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Real local ASR, synthetic audio, no network at inference
        run: python3 scripts/test-ai-local-voice.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ai-local-voice
          path: output/voice-asr-review-*/
          if-no-files-found: error
