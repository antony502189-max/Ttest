name: Apply responsive matrix initialization fix

on:
  push:
    branches:
      - fix/customer-map-mobile-polish

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/customer-map-mobile-polish
          persist-credentials: false

      - name: Patch responsive setup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/delta.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = """  await page.evaluate(() => localStorage.setItem('112233:mobile-onboarding:v1', 'done'))
  await page.reload()
  const routes = [
"""
          new = """  await page.evaluate(() => localStorage.setItem('112233:mobile-onboarding:v1', 'done'))
  await page.goto('/#/buscar?q=Tenerife&alquiler=long')
  await page.reload()
  const routes = [
"""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one responsive setup block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm .github/workflows/fix-responsive-map-wait.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/delta.spec.ts .github/workflows/fix-responsive-map-wait.yml
          git commit -m 'test: initialize responsive matrix outside reload onboarding'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/customer-map-mobile-polish
