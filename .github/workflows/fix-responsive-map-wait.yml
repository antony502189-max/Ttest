name: Fix responsive map wait

on:
  push:
    branches:
      - fix/customer-map-mobile-polish

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/customer-map-mobile-polish
          persist-credentials: false

      - name: Remove unrelated map readiness wait
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/delta.spec.ts')
          text = path.read_text(encoding='utf-8')
          old = "      if (route.includes('vista=mapa')) await page.locator('.google-map-canvas, .m2-map-canvas').waitFor({ state: 'visible' })\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one map wait, found {count}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Verify targeted responsive contract
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run lint
          npm run typecheck
          npx playwright test tests/delta.spec.ts --grep 'RESP-01..05'

      - name: Commit verified fix and remove verifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          rm .github/workflows/fix-responsive-map-wait.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/delta.spec.ts .github/workflows/fix-responsive-map-wait.yml
          git commit -m 'test: keep responsive overflow check independent of map readiness'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:fix/customer-map-mobile-polish
