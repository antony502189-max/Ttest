name: Repair homepage hero patch

on:
  push:
    branches:
      - feature/homepage-hero-promotion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homepage-hero-promotion
          fetch-depth: 0

      - name: Apply repaired feature patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/one-shot-homepage-hero.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = textwrap.dedent(workflow[start:end])

          fixes = {
              "'''    mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda',\\n'''":
              "'''    home: 'Inicio', searches: 'Búsquedas', favorites: 'Favoritos', mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda',\\n'''",
              "'''    mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda', heroAdView: 'Ver anuncio',\\n'''":
              "'''    home: 'Inicio', searches: 'Búsquedas', favorites: 'Favoritos', mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda', heroAdView: 'Ver anuncio',\\n'''",
              "'''    mainNavigation: 'Main navigation', heroAlt: 'Home interior', locationTitle: 'Where are you looking?',\\n'''":
              "'''    mainNavigation: 'Main navigation', heroAlt: 'Home interior', locationTitle: 'Where are you looking?',\\n'''",
              "'''    mainNavigation: 'Main navigation', heroAlt: 'Home interior', heroAdView: 'View listing', locationTitle: 'Where are you looking?',\\n'''":
              "'''    mainNavigation: 'Main navigation', heroAlt: 'Home interior', heroAdView: 'View listing', locationTitle: 'Where are you looking?',\\n'''",
              "'''    searches: 'Поиски', favorites: 'Избранное', mainNavigation: 'Основная навигация', heroAlt: 'Интерьер жилого помещения', locationTitle: 'Где вы ищете?',\\n'''":
              "'''    searches: 'Поиски', favorites: 'Избранное', mainNavigation: 'Основная навигация', heroAlt: 'Интерьер жилого помещения', locationTitle: 'Где вы ищете?',\\n'''",
              "'''    searches: 'Поиски', favorites: 'Избранное', mainNavigation: 'Основная навигация', heroAlt: 'Интерьер жилого помещения', heroAdView: 'Открыть объявление', locationTitle: 'Где вы ищете?',\\n'''":
              "'''    searches: 'Поиски', favorites: 'Избранное', mainNavigation: 'Основная навигация', heroAlt: 'Интерьер жилого помещения', heroAdView: 'Открыть объявление', locationTitle: 'Где вы ищете?',\\n'''",
          }

          # Spanish is the only copy line split differently. Patch its old/new
          # source arguments to the exact source line while leaving the following
          # locationTitle line untouched.
          source = source.replace(
              "'''    mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda',\\n'''",
              "'''    home: 'Inicio', searches: 'Búsquedas', favorites: 'Favoritos', mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda',\\n'''",
          ).replace(
              "'''    mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda', heroAdView: 'Ver anuncio',\\n'''",
              "'''    home: 'Inicio', searches: 'Búsquedas', favorites: 'Favoritos', mainNavigation: 'Navegación principal', heroAlt: 'Interior de una vivienda', heroAdView: 'Ver anuncio',\\n'''",
          )

          namespace = {'__name__': '__main__'}
          exec(compile(source, '<homepage-hero-patch>', 'exec'), namespace, namespace)

          service = Path('backend/app/services/homepage_hero.py')
          text = service.read_text()
          old = '    row = (await session.execute(visible_query().where(Listing.id == promotion.listing_id))).one_or_none()\n    return response_from(row) if row else None\n'
          new = '    row = (await session.execute(visible_query().where(Listing.id == promotion.listing_id))).one_or_none()\n    if row is None:\n        return None\n    response = response_from(row)\n    return response if response.imageUrls else None\n'
          if old not in text:
              raise SystemExit('public hero response hardening anchor missing')
          service.write_text(text.replace(old, new, 1))

          hook = Path('src/hooks/use-homepage-hero-listing.ts')
          text = hook.read_text()
          old = "    void load()\n    window.addEventListener('catalog:refresh', refresh)\n    return () => {\n      cancelled = true\n      window.removeEventListener('catalog:refresh', refresh)\n    }"
          new = "    void load()\n    const expiryPoll = window.setInterval(load, 60_000)\n    window.addEventListener('catalog:refresh', refresh)\n    return () => {\n      cancelled = true\n      window.clearInterval(expiryPoll)\n      window.removeEventListener('catalog:refresh', refresh)\n    }"
          if old not in text:
              raise SystemExit('hero hook polling anchor missing')
          hook.write_text(text.replace(old, new, 1))

          css = Path('src/home.css')
          text = css.read_text()
          css.write_text(text.replace('.home-hero--promotion > img {', '.market-home .home-hero.home-hero--promotion > img {', 1))

          for temporary in [
              Path('.github/workflows/one-shot-homepage-hero.yml'),
              Path('.github/workflows/one-shot-homepage-hero-repair.yml'),
          ]:
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add timed homepage hero advertising"
          git push origin HEAD:feature/homepage-hero-promotion
