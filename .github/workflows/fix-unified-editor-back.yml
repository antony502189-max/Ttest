name: Fix unified editor back navigation

on:
  push:
    branches:
      - fix/unified-listing-editor
    paths:
      - scripts/fix-unified-editor-back.py
      - .github/workflows/fix-unified-editor-back.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/unified-listing-editor
          fetch-depth: 0
      - name: Apply codemod
        run: python3 scripts/fix-unified-editor-back.py
      - name: Commit generated source
        shell: bash
        run: |
          rm scripts/fix-unified-editor-back.py
          rm .github/workflows/fix-unified-editor-back.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PublishPage.tsx scripts/fix-unified-editor-back.py .github/workflows/fix-unified-editor-back.yml
          git commit -m "Make Back scroll to the previous editor section"
          git push origin HEAD:fix/unified-listing-editor
