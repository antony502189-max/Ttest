name: Validate specs one by one

on:
  push:
    branches: [validation/spec-by-spec]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/spec-by-spec
          fetch-depth: 0
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run every spec and commit progress
        shell: bash
        run: |
          set +e
          mkdir -p docs
          printf '# Playwright spec-by-spec validation\n\n' > docs/spec-validation-progress.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/spec-validation-progress.md
          git commit -m "Start spec-by-spec validation"
          git push origin HEAD:validation/spec-by-spec

          for spec in tests/*.spec.ts; do
            safe=$(basename "$spec" .spec.ts)
            npm exec playwright test "$spec" -- --workers=1 > "/tmp/$safe.log" 2>&1
            code=$?
            if [ $code -eq 0 ]; then result=PASS; else result=FAIL; fi
            {
              printf '## `%s` — %s (exit %s)\n\n' "$spec" "$result" "$code"
              echo '```text'
              tail -n 180 "/tmp/$safe.log"
              echo '```'
              echo
            } >> docs/spec-validation-progress.md
            git add docs/spec-validation-progress.md
            git commit -m "Record validation for $safe"
            git push origin HEAD:validation/spec-by-spec
          done
          rm .github/workflows/validate-spec-by-spec.yml
          git add -A
          git commit -m "Finish spec-by-spec validation"
          git push origin HEAD:validation/spec-by-spec
