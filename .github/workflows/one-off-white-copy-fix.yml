name: One-off white-theme copy fix

on:
  push:
    branches:
      - fix/white-theme-copy-audit
    paths:
      - .github/workflows/one-off-white-copy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Replace stale dark-theme labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/components/mobile-app-v2.tsx'),
              Path('src/components/idealista-mobile-app.tsx'),
          ]
          replacements = {
              'Predeterminada (oscura)': 'Predeterminada (clara)',
              'Default (dark)': 'Default (light)',
              'По умолчанию (тёмный)': 'По умолчанию (светлый)',
          }
          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
                  text = text.replace(old, new)
                  total += count
              path.write_text(text, encoding='utf-8')
          if total != 6:
              raise SystemExit(f'expected 6 replacements, got {total}')
          PY
      - name: Commit copy-only change
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -Fx 'src/components/mobile-app-v2.tsx'
          git diff --name-only | grep -Fx 'src/components/idealista-mobile-app.tsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/mobile-app-v2.tsx src/components/idealista-mobile-app.tsx
          git commit -m 'fix: label accepted white appearance correctly'
          git push origin HEAD:fix/white-theme-copy-audit
