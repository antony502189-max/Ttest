name: Temporary Full Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-full-audit-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  audit:
    # Public issue creation must not provide an unauthenticated 120-minute CI
    # trigger with an issues:write token. Only the repository owner may launch
    # this explicit issue-driven maintenance workflow.
    if: github.actor == github.repository_owner && startsWith(github.event.issue.title, '[FINAL-AUDIT]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout approved visual baselines
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: visual-baselines
          path: .visual-baselines
          persist-credentials: false

      - name: Install approved visual baselines
        run: |
          mkdir -p tests/visual-snapshots
          cp -R .visual-baselines/tests/visual-snapshots/. tests/visual-snapshots/

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python visual-audit dependency
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Enable Docker BuildKit
        run: |
          echo 'DOCKER_BUILDKIT=1' >> "$GITHUB_ENV"
          echo 'COMPOSE_DOCKER_CLI_BUILD=1' >> "$GITHUB_ENV"

      - name: Run complete audit
        id: audit
        shell: bash
        run: |
          set +e
          bash scripts/final-audit-local.sh 2>&1 | tee final-audit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            final-audit.log
            output/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish audit result to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          log = Path('final-audit.log')
          text = log.read_text(encoding='utf-8', errors='replace') if log.exists() else 'Audit log was not created.'
          lines = text.splitlines()
          tail = '\n'.join(lines[-500:])
          if len(tail) > 58000:
              tail = tail[-58000:]
          code = os.environ.get('EXIT_CODE') or 'unknown'
          state = 'PASSED' if code == '0' else 'FAILED'
          body = (
              f"## Temporary full audit: {state}\n\n"
              f"Exit code: `{code}`\n\n"
              f"Run: {os.environ['RUN_URL']}\n\n"
              "<details><summary>Last audit log lines</summary>\n\n"
              "```text\n" + tail + "\n```\n</details>"
          )
          Path('audit-comment.md').write_text(body, encoding='utf-8')
          PY
          gh issue comment "$ISSUE_NUMBER" --body-file audit-comment.md
