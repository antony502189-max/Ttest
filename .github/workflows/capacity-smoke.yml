name: Capacity smoke safeguards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacity-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safeguards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test bounded read-only capacity smoke
        working-directory: scripts
        run: python -m unittest -v test_capacity_smoke.py
      - name: Validate command-line entry point
        run: python scripts/capacity_smoke.py --help >/dev/null
