name: Align Wi-Fi regression

on:
  push:
    branches: ["fix/customer-publish-availability-wifi-expenses"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/customer-publish-availability-wifi-expenses
      - name: Update obsolete fiber expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/acceptance-flows.spec.ts')
          text = path.read_text()
          old = 'await changed(() => check("Espacios y equipamiento", "Fibra"), /servicios=/);'
          new = 'await changed(() => check("Espacios y equipamiento", "Wi-Fi"), /servicios=/);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one obsolete Fibra assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit product regression alignment
        run: |
          rm .github/workflows/align-wifi-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align search amenity expectation with Wi-Fi"
          git push origin HEAD:fix/customer-publish-availability-wifi-expenses
