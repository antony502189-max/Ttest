name: AI Search private frontend

on:
  push:
    branches: [main]
  pull_request:
    paths: ['src/**', 'vite.config.ts', 'backend/lab/**', 'deploy/ai-text-lab/**', 'scripts/ai-lab-runtime.mjs', 'scripts/check-ai-lab-*.mjs', 'scripts/verify-ai-lab-provenance.mjs', 'tests/ai-home-search.spec.ts', 'tests/ai-lab-runtime.spec.ts', 'tests/ai-saved-searches.spec.ts', 'tests/google-maps-final-acceptance.spec.ts', 'playwright.ai-lab.config.ts', 'playwright.ai-search.config.ts', 'package*.json', '.github/workflows/ai-search-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Isolated mocked AI browser contracts
        run: npx playwright test --config playwright.ai-search.config.ts
      - name: Fail-closed lab release pairing (no real provider)
        run: npx playwright test --config playwright.ai-lab.config.ts
      - name: Lab build-mode matrix (no provider)
        run: node scripts/check-ai-lab-builds.mjs output/ai-lab-build-matrix
      - name: Exact runtime code and evidence provenance
        run: node scripts/verify-ai-lab-provenance.mjs output/ai-lab-ci-provenance.json
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-search-browser-results
          path: |
            output/ai-home-*.png
            test-results/**
            output/ai-lab-contract-test-results/**
            output/ai-lab-build-matrix/result.json
            output/ai-lab-ci-provenance.json
            docs/reports/pr404-remediation-20261103-evidence/**
            docs/reports/pr404-recovery-final-20261103-evidence/**
          if-no-files-found: ignore
