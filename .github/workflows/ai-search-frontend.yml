name: AI Search private frontend

on:
  pull_request:
    paths: ['src/**', 'tests/ai-home-search.spec.ts', 'tests/google-maps-final-acceptance.spec.ts', 'playwright.ai-search.config.ts', 'package*.json', '.github/workflows/ai-search-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-search-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Isolated mocked AI browser contracts
        run: npx playwright test --config playwright.ai-search.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-search-browser-results
          path: |
            output/ai-home-*.png
            test-results/**
          if-no-files-found: ignore
