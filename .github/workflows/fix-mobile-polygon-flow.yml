name: Fix mobile polygon search flow

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN_MOBILE_POLYGON_FIX'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply fix
        run: python scripts/fix-mobile-polygon-flow.py

      - name: Verify intended behavior in source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "params.delete('vista')" src/components/mobile-app-v2.tsx
          grep -Fq "target === 'area' && mapPolygon.length >= 3" src/components/mobile-app-v2.tsx
          grep -Fq "useState<MapPolygonPoint[]>([])" src/contexts/app-context.tsx
          ! grep -Fq "persistJson('112233:map-polygon:v1', mapPolygon)" src/contexts/app-context.tsx
          grep -Fq "localStorage.removeItem('112233:map-polygon:v1')" src/App.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          VITE_BASE_PATH: /Ttest/
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/contexts/app-context.tsx src/components/mobile-app-v2.tsx
          git commit -m 'Fix mobile polygon search and reload reset'
          git push origin HEAD:main

      - name: Report result
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `MOBILE_POLYGON_FIX_RESULT: ${{ job.status }}\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            })
