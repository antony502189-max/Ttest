name: External source contract audit

on:
  pull_request:
    branches: [main]
    paths:
      - backend/app/external_sources.py
      - backend/app/commands/audit_external_sources.py
      - backend/tests/test_external_sources.py
      - backend/tests/test_external_source_contract_audit.py
      - .github/workflows/external-source-contract.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-source-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_ENV: test
      EXTERNAL_IMPORT_PLAYWRIGHT_ENABLED: "1"
      EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: "25"
      EXTERNAL_IMPORT_USER_AGENT: "112233.es public room availability audit"
      MEDIA_ROOT: var/external-source-audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install bounded audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --constraint backend/constraints.txt -e './backend[dev]'
          python -m playwright install --with-deps chromium
          python -m pip check
      - name: Run adapter regression tests
        working-directory: backend
        run: |
          pytest -q tests/test_external_sources.py -k 'not live_public_source'
          pytest -q tests/test_external_source_contract_audit.py
      - name: Audit public discovery and detail contracts
        working-directory: backend
        run: |
          python -m app.commands.audit_external_sources \
            --output ../output/external-source-contract.json \
            --max-pages 2 \
            --max-details 2 \
            --source-timeout 120 \
            --detail-timeout 35 \
            --minimum-healthy 2
      - name: Upload external source report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: external-source-contract-report
          path: |
            output/external-source-contract.json
            backend/var/external-source-audit/external-import-errors
          if-no-files-found: ignore
          retention-days: 7
