name: Fix homepage hero backend import order

on:
  push:
    branches:
      - feature/homepage-hero-promotion

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homepage-hero-promotion
      - name: Reorder backend imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/api/v1/admin.py')
          text = path.read_text()
          hero = 'from ...services.homepage_hero import configure_homepage_hero, get_admin_homepage_hero, remove_homepage_hero\n'
          if text.count(hero) != 1:
              raise SystemExit('homepage hero import not found exactly once')
          text = text.replace(hero, '', 1)
          anchor = '''from ...services.admin_users import (\n    get_user_detail,\n    list_users,\n    restrict_user,\n    soft_delete_user,\n    unrestrict_user,\n)\n'''
          if text.count(anchor) != 1:
              raise SystemExit('admin_users import block not found exactly once')
          text = text.replace(anchor, anchor + hero, 1)
          path.write_text(text)
          Path('.github/workflows/one-shot-fix-homepage-hero-import.yml').unlink()
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: sort homepage hero backend imports"
          git push origin HEAD:feature/homepage-hero-promotion
