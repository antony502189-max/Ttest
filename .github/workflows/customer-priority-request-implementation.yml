name: Customer priority request implementation

on:
  push:
    branches:
      - feat/customer-priority-room-filters-location

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/customer-priority-room-filters-location
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Apply and validate customer request
        shell: bash
        run: |
          set +e
          rm -f CUSTOMER_IMPLEMENTATION_FAILURE.txt
          sed -i "s/accessible: index % 5 === 0/accessible: index % 8 === 0/" scripts/apply_customer_priority_request.py
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/apply_customer_priority_request.py')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'# Desktop advanced filter retains all prior controls and gains structured floor\.\n.*?# ---------------------------------------------------------------------------\n# Mobile filter state and priority ordering requested by customer\.\n',
              '# Desktop filter is patched against the current component by the validation workflow.\n\n# ---------------------------------------------------------------------------\n# Mobile filter state and priority ordering requested by customer.\n',
              text,
              count=1,
              flags=re.S,
          )
          path.write_text(text, encoding='utf-8')
          PY

          {
            python scripts/apply_customer_priority_request.py &&
            python - <<'PY'
          from pathlib import Path
          path = Path('src/components/localized-search-filters.tsx')
          text = path.read_text(encoding='utf-8')
          accessibility = '      <YesNoFilter label={text("Adaptada para movilidad reducida", "Адаптировано для маломобильных", "Accessible")} value={value.accessible} onChange={(next) => update("accessible", next)} language={language} />\n'
          floor = '      <NativeSelect label={text("Planta", "Этаж", "Floor")} value={value.floor} options={[{ value: "Cualquiera", label: anyLabel }, { value: "basement", label: text("Sótano / semisótano", "Цокольный", "Basement") }, "1", "2", "3", { value: "4+", label: "4+" }, { value: "top", label: text("Última planta", "Последний этаж", "Top floor") }]} onChange={(next) => update("floor", next as Filters["floor"])} />\n'
          if floor not in text:
              if accessibility not in text:
                  raise RuntimeError('desktop accessibility anchor not found')
              text = text.replace(accessibility, accessibility + floor, 1)
          old_kitchen = '<NativeSelect label={text("Cocina", "Кухня", "Kitchen")} value={value.kitchen}'
          new_kitchen = '<NativeSelect label={text("Cocina / mini-cocina en la habitación", "Личная кухня / мини-кухня в комнате", "Kitchen / kitchenette in the room")} value={value.kitchen}'
          if old_kitchen in text:
              text = text.replace(old_kitchen, new_kitchen, 1)
          path.write_text(text, encoding='utf-8')
          PY
            rm scripts/apply_customer_priority_request.py .github/workflows/customer-priority-request-implementation.yml &&
            npm ci &&
            npm run typecheck &&
            npm run lint &&
            npm run build &&
            python -m compileall -q backend/app backend/tests backend/alembic/versions
          } > >(tee /tmp/customer-implementation.log) 2>&1
          code=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$code" -ne 0 ]; then
            git restore scripts/apply_customer_priority_request.py .github/workflows/customer-priority-request-implementation.yml 2>/dev/null || true
            cp /tmp/customer-implementation.log CUSTOMER_IMPLEMENTATION_FAILURE.txt
            git add CUSTOMER_IMPLEMENTATION_FAILURE.txt
            git commit -m "ci: capture customer implementation failure" || true
            git push origin HEAD:feat/customer-priority-room-filters-location
            exit "$code"
          fi

          git add -A
          git diff --cached --check
          git commit -m "feat: implement customer priority filters and address UX"
          git push origin HEAD:feat/customer-priority-room-filters-location
