name: Customer priority request implementation

on:
  push:
    branches:
      - feat/customer-priority-room-filters-location

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/customer-priority-room-filters-location
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Apply and validate customer request
        shell: bash
        run: |
          set +e
          rm -f CUSTOMER_IMPLEMENTATION_FAILURE.txt
          sed -i "s/accessible: index % 5 === 0/accessible: index % 8 === 0/" scripts/apply_customer_priority_request.py

          {
            python scripts/apply_customer_priority_request.py &&
            rm scripts/apply_customer_priority_request.py .github/workflows/customer-priority-request-implementation.yml &&
            npm ci &&
            npm run typecheck &&
            npm run lint &&
            npm run build &&
            python -m compileall -q backend/app backend/tests backend/alembic/versions
          } > >(tee /tmp/customer-implementation.log) 2>&1
          code=$?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$code" -ne 0 ]; then
            git restore scripts/apply_customer_priority_request.py .github/workflows/customer-priority-request-implementation.yml 2>/dev/null || true
            cp /tmp/customer-implementation.log CUSTOMER_IMPLEMENTATION_FAILURE.txt
            git add CUSTOMER_IMPLEMENTATION_FAILURE.txt
            git commit -m "ci: capture customer implementation failure" || true
            git push origin HEAD:feat/customer-priority-room-filters-location
            exit "$code"
          fi

          git add -A
          git diff --cached --check
          git commit -m "feat: implement customer priority filters and address UX"
          git push origin HEAD:feat/customer-priority-room-filters-location
