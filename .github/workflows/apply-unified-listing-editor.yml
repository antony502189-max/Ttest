name: Apply unified listing editor

on:
  push:
    branches:
      - fix/unified-listing-editor
    paths:
      - scripts/apply-unified-listing-editor.py
      - .github/workflows/apply-unified-listing-editor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/unified-listing-editor
          fetch-depth: 0
      - name: Apply codemod
        run: python3 scripts/apply-unified-listing-editor.py
      - name: Commit generated source
        shell: bash
        run: |
          rm scripts/apply-unified-listing-editor.py
          rm .github/workflows/apply-unified-listing-editor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PublishPage.tsx scripts/apply-unified-listing-editor.py .github/workflows/apply-unified-listing-editor.yml
          git commit -m "Unify listing create and edit into one scrollable page"
          git push origin HEAD:fix/unified-listing-editor
