name: Isolated full mobile validation

on:
  push:
    branches:
      - validation/mobile-location-run2

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/mobile-location-run2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run and capture validation
        shell: bash
        run: |
          set +e
          mkdir -p output/validation docs
          : > output/validation/full.log
          : > output/validation/status.tsv

          check() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a output/validation/full.log
            "$@" >> output/validation/full.log 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" >> output/validation/status.tsv
            echo "exit=$code" | tee -a output/validation/full.log
          }

          check "npm ci" npm ci
          if grep -q $'npm ci\t0' output/validation/status.tsv; then
            check "playwright install" npx playwright install --with-deps chromium
            check "lint" npm run lint
            check "typecheck" npm run typecheck
            check "build" npm run build
            check "e2e" npm run test:e2e
          fi

          python <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone

          statuses = []
          for line in Path('output/validation/status.tsv').read_text().splitlines():
              name, code = line.split('\t', 1)
              statuses.append((name, int(code)))
          log = Path('output/validation/full.log').read_text(errors='replace')
          rows = '\n'.join(f'| {name} | {"PASS" if code == 0 else "FAIL"} | `{code}` |' for name, code in statuses)
          overall = 'PASS' if statuses and all(code == 0 for _, code in statuses) else 'FAIL'
          report = f'''# Mobile validation report

Generated: {datetime.now(timezone.utc).isoformat()}

Overall: **{overall}**

| Check | Result | Exit code |
|---|---:|---:|
{rows}

## Last 700 log lines

```text
{'\n'.join(log.splitlines()[-700:])}
```
'''
          Path('docs/mobile-validation-report.md').write_text(report)
          PY

          rm .github/workflows/validate-mobile-location-run2.yml
      - name: Commit report
        if: always()
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record isolated mobile validation report" || true
          git push origin HEAD:validation/mobile-location-run2
