name: Apply external worker health contract

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-external-worker-health-contract.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply fail-closed worker health contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file_path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "backend/app/core/config.py",
              '    external_import_sources: str = "idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain"\n'
              '    external_import_request_timeout_seconds: int = 25\n',
              '    external_import_sources: str = "idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain"\n'
              '    external_import_min_healthy_sources: int = 1\n'
              '    external_import_request_timeout_seconds: int = 25\n',
          )
          replace_once(
              "backend/app/core/config.py",
              '            self.external_import_interval_seconds < 1\n'
              '            or self.external_import_request_timeout_seconds < 1\n',
              '            self.external_import_interval_seconds < 1\n'
              '            or self.external_import_min_healthy_sources < 1\n'
              '            or self.external_import_request_timeout_seconds < 1\n',
          )
          replace_once(
              "backend/app/core/config.py",
              '                if not configured_sources:\n'
              '                    problems.append("EXTERNAL_IMPORT_SOURCES must enable at least one source in production")\n'
              '                unknown_sources = configured_sources - SUPPORTED_EXTERNAL_IMPORT_SOURCES\n',
              '                if not configured_sources:\n'
              '                    problems.append("EXTERNAL_IMPORT_SOURCES must enable at least one source in production")\n'
              '                if self.external_import_min_healthy_sources > len(configured_sources):\n'
              '                    problems.append(\n'
              '                        "EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES cannot exceed configured sources"\n'
              '                    )\n'
              '                unknown_sources = configured_sources - SUPPORTED_EXTERNAL_IMPORT_SOURCES\n',
          )

          replace_once(
              "backend/app/services/external_import.py",
              'class SourceRunCounters(dict[str, int]):\n'
              '    """Counters plus the terminal state for the worker\'s aggregate health."""\n\n'
              '    result: str = "failed"\n\n'
              'MUNICIPALITY_POINTS = {\n',
              'class SourceRunCounters(dict[str, int]):\n'
              '    """Counters plus the terminal state for the worker\'s aggregate health."""\n\n'
              '    result: str = "failed"\n\n\n'
              'def completed_source_contract(counters: dict[str, int]) -> bool:\n'
              '    """Require evidence that discovery reached at least one valid room detail."""\n'
              '    return all(\n'
              '        counters.get(key, 0) > 0\n'
              '        for key in ("discovered_urls", "fetched_details", "accepted_rooms")\n'
              '    )\n\n\n'
              'MUNICIPALITY_POINTS = {\n',
          )
          replace_once(
              "backend/app/services/external_import.py",
              '        run.result = "partial" if partial or not discovery.complete else "success"\n',
              '        completed_contract = completed_source_contract(counters)\n'
              '        if discovery.complete and not partial and completed_contract:\n'
              '            run.result = "success"\n'
              '        else:\n'
              '            run.result = "partial"\n'
              '            if not completed_contract:\n'
              '                run.last_error = "No valid room detail completed the external import contract"\n',
          )

          replace_once(
              "backend/app/workers/external_listings.py",
              'from ..services.external_import import run_removal_check, run_source\n',
              'from ..services.external_import import completed_source_contract, run_removal_check, run_source\n',
          )
          replace_once(
              "backend/app/workers/external_listings.py",
              '\n\nasync def run_once() -> dict[str, dict[str, int]]:\n',
              '\n\ndef _successful_source_names(result: dict[str, dict[str, int]]) -> list[str]:\n'
              '    return [\n'
              '        name\n'
              '        for name, counters in result.items()\n'
              '        if getattr(counters, "result", "failed") == "success"\n'
              '        and completed_source_contract(counters)\n'
              '    ]\n\n\n'
              'async def run_once() -> dict[str, dict[str, int]]:\n',
          )
          replace_once(
              "backend/app/workers/external_listings.py",
              '        successful_sources = [\n'
              '            name for name, counters in result.items() if getattr(counters, "result", "failed") == "success"\n'
              '        ]\n'
              '        if not successful_sources:\n'
              '            failure_summary = "No external source completed a successful import"\n'
              '            logger.error("external_import_no_successful_sources", extra={"run_id": run_id, "sources": result})\n',
              '        successful_sources = _successful_source_names(result)\n'
              '        required_sources = settings.external_import_min_healthy_sources\n'
              '        if len(successful_sources) < required_sources:\n'
              '            failure_summary = (\n'
              '                f"Only {len(successful_sources)} external sources completed a useful import; "\n'
              '                f"{required_sources} required"\n'
              '            )\n'
              '            logger.error(\n'
              '                "external_import_insufficient_healthy_sources",\n'
              '                extra={\n'
              '                    "run_id": run_id,\n'
              '                    "successful_sources": successful_sources,\n'
              '                    "required_sources": required_sources,\n'
              '                    "sources": result,\n'
              '                },\n'
              '            )\n',
          )

          replace_once(
              "docker-compose.yml",
              '      EXTERNAL_IMPORT_SOURCES: "${EXTERNAL_IMPORT_SOURCES:-idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain}"\n'
              '      EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: "${EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS:-25}"\n',
              '      EXTERNAL_IMPORT_SOURCES: "${EXTERNAL_IMPORT_SOURCES:-idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain}"\n'
              '      EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES: "${EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES:-1}"\n'
              '      EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: "${EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS:-25}"\n',
          )
          replace_once(
              "docker-compose.production.yml",
              '  EXTERNAL_IMPORT_SOURCES: ${EXTERNAL_IMPORT_SOURCES:-idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain}\n'
              '  EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: ${EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS:-25}\n',
              '  EXTERNAL_IMPORT_SOURCES: ${EXTERNAL_IMPORT_SOURCES:-idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain}\n'
              '  EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES: ${EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES:-3}\n'
              '  EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: ${EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS:-25}\n',
          )
          replace_once(
              "deploy/production.env.example",
              'VITE_GOOGLE_CLIENT_ID=\nEXTERNAL_WORKER_STALE_AFTER_SECONDS=300\n',
              'VITE_GOOGLE_CLIENT_ID=\nEXTERNAL_IMPORT_MIN_HEALTHY_SOURCES=3\nEXTERNAL_WORKER_STALE_AFTER_SECONDS=300\n',
          )
          replace_once(
              "scripts/check-production-config.sh",
              "grep -Fq 'MAX_LISTING_COLLECTION_ITEMS_PER_USER=500' deploy/production.env.example\n",
              "grep -Fq 'MAX_LISTING_COLLECTION_ITEMS_PER_USER=500' deploy/production.env.example\n"
              "grep -Fq 'EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES=3' deploy/production.env.example\n",
          )
          replace_once(
              "scripts/check-production-config.sh",
              'if backend_env.get("MAX_LISTING_COLLECTION_ITEMS_PER_USER") != "500":\n'
              '    raise SystemExit("backend must receive the per-user listing collection quota")\n',
              'if backend_env.get("MAX_LISTING_COLLECTION_ITEMS_PER_USER") != "500":\n'
              '    raise SystemExit("backend must receive the per-user listing collection quota")\n'
              'if backend_env.get("EXTERNAL_IMPORT_MIN_HEALTHY_SOURCES") != "3":\n'
              '    raise SystemExit("external worker must require three healthy production sources")\n',
          )

          Path("backend/tests/test_external_import_health.py").write_text(
              '''from app.services.external_import import SourceRunCounters, completed_source_contract\n'
              'from app.workers.external_listings import _successful_source_names\n\n\n'
              'def counters(\n'
              '    *,\n'
              '    result: str = "success",\n'
              '    discovered: int = 1,\n'
              '    fetched: int = 1,\n'
              '    accepted: int = 1,\n'
              ') -> SourceRunCounters:\n'
              '    value = SourceRunCounters(\n'
              '        {\n'
              '            "discovered_urls": discovered,\n'
              '            "fetched_details": fetched,\n'
              '            "accepted_rooms": accepted,\n'
              '        }\n'
              '    )\n'
              '    value.result = result\n'
              '    return value\n\n\n'
              'def test_completed_source_contract_requires_a_valid_room_detail() -> None:\n'
              '    assert completed_source_contract(counters())\n'
              '    assert not completed_source_contract(counters(discovered=0))\n'
              '    assert not completed_source_contract(counters(fetched=0))\n'
              '    assert not completed_source_contract(counters(accepted=0))\n\n\n'
              'def test_worker_counts_only_useful_successful_sources() -> None:\n'
              '    result = {\n'
              '        "Fotocasa": counters(),\n'
              '        "ThinkSpain": counters(discovered=0),\n'
              '        "Idealista": counters(result="blocked"),\n'
              '    }\n'
              '    assert _successful_source_names(result) == ["Fotocasa"]\n'''.replace("'\n              '", ""),
              encoding="utf-8",
          )
          PY
          python -m py_compile \
            backend/app/core/config.py \
            backend/app/services/external_import.py \
            backend/app/workers/external_listings.py \
            backend/tests/test_external_import_health.py
          rm .github/workflows/apply-external-worker-health-contract.yml
          git diff --check
      - name: Commit verified worker health contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: fail closed on degraded external imports"
          git push origin HEAD:${{ github.head_ref }}
