name: I18n fix

on:
  push:
    branches:
      - fix/i18n-language-audit

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/i18n-language-audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Apply i18n corrections
        run: python scripts/apply_i18n_fixes.py
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/i18n-language-regression.spec.ts --reporter=line
      - name: Commit verified product changes
        shell: bash
        run: |
          rm -f .github/workflows/i18n-diagnostic.yml .github/workflows/i18n-fix.yml scripts/apply_i18n_fixes.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: complete Russian and English room-first localization"
          git push origin HEAD:fix/i18n-language-audit
