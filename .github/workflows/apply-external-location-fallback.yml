name: Apply external source location fallback

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-external-location-fallback.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact location fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/app/external_sources.py")
          text = path.read_text(encoding="utf-8")
          replacement = '''def is_in_target_province(data: dict[str, Any]) -> bool:
              try:
                  latitude, longitude = float(str(data.get("latitude"))), float(str(data.get("longitude")))
                  if coordinates_in_target_province(latitude, longitude):
                      return True
              except (TypeError, ValueError):
                  pass
              explicit_location = clean(
                  " ".join(
                      str(data.get(key, ""))
                      for key in ("province", "city", "municipality", "address", "breadcrumbs", "postcode")
                  )
              ).casefold()
              if any(term in explicit_location for term in LAS_PALMAS):
                  return False
              if any(term in explicit_location for term in SANTA_CRUZ):
                  return True

              # Listing title and description are a safe fallback when a source omits
              # structured address data. Never use arbitrary whole-page text here:
              # global navigation can mention other islands and property operations.
              listing_copy = clean(
                  " ".join(str(data.get(key, "")) for key in ("title", "description"))
              ).casefold()
              return not any(term in listing_copy for term in LAS_PALMAS) and any(
                  term in listing_copy for term in SANTA_CRUZ
              )


          def coordinates_in_target_province'''
          pattern = r"def is_in_target_province\(data: dict\[str, Any\]\) -> bool:\n.*?\n\n\ndef coordinates_in_target_province"
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f"expected one location function, replaced {count}")
          path.write_text(updated, encoding="utf-8")
          PY
          python -m py_compile backend/app/external_sources.py backend/app/commands/audit_external_sources.py
          rm .github/workflows/apply-external-location-fallback.yml
          git diff --check
      - name: Commit verified fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/external_sources.py .github/workflows/apply-external-location-fallback.yml
          git commit -m "fix: recover listing location from listing copy"
          git push origin HEAD:${{ github.head_ref }}
