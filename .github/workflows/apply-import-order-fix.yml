name: Apply importer import order fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# One-time owner-only workflow. It is deleted immediately after the verified source commit.
jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == github.repository_owner
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Apply exact import order correction
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/external_import.py')
          text = path.read_text(encoding='utf-8')
          old = '''from __future__ import annotations

from collections.abc import Iterable

import asyncio
import hashlib
import json
import logging
import re
import unicodedata
'''
          new = '''from __future__ import annotations

import asyncio
import hashlib
import json
import logging
import re
import unicodedata
from collections.abc import Iterable
'''
          if new in text and old not in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit('expected unique unsorted import block')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(git diff --name-only)" = 'backend/app/services/external_import.py'
          git diff --check
          python3 -m py_compile backend/app/services/external_import.py
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit corrected source
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq .object.sha)"
          test "$remote_sha" = "$base_sha"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/external_import.py
          git commit -m 'fix: sort importer standard-library imports'
          authenticated_remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$authenticated_remote" "HEAD:refs/heads/$HEAD_REF"
