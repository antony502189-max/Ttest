name: Materialize capacity smoke

on:
  push:
    branches:
      - feat/safe-capacity-smoke-20260805
    paths:
      - .github/workflows/materialize-capacity-smoke.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout capacity branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/safe-capacity-smoke-20260805
          fetch-depth: 0

      - name: Decode exact reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > /tmp/capacity-smoke.py.gz.b64 <<'CAPACITY_SOURCE'
          
          CAPACITY_SOURCE
          cat > /tmp/test-capacity-smoke.py.gz.b64 <<'CAPACITY_TESTS'
          
          CAPACITY_TESTS
          sed 's/^          //' /tmp/capacity-smoke.py.gz.b64 | base64 --decode | gzip --decompress > scripts/capacity_smoke.py
          sed 's/^          //' /tmp/test-capacity-smoke.py.gz.b64 | base64 --decode | gzip --decompress > scripts/test_capacity_smoke.py
          printf '%s  %s\n' \
            '58b8d831dd00b9430596d5d8afe76b996d6997981451071baface877b01dc986' scripts/capacity_smoke.py \
            '384670aebdab806ad6aa8f360ebe0a7ae3cafaa3da436559967d210393afa32f' scripts/test_capacity_smoke.py \
            | sha256sum --check --strict

      - name: Validate materialized files
        run: |
          set -euo pipefail
          python -m py_compile scripts/capacity_smoke.py scripts/test_capacity_smoke.py
          python -m unittest -v scripts/test_capacity_smoke.py
          python scripts/check-supply-chain.py
          python scripts/capacity_smoke.py --help >/dev/null

      - name: Commit only final sources
        run: |
          set -euo pipefail
          git rm -- .github/workflows/materialize-capacity-smoke.yml
          git add -- scripts/capacity_smoke.py scripts/test_capacity_smoke.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add bounded production capacity smoke'
          git push origin HEAD:feat/safe-capacity-smoke-20260805
