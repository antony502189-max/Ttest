name: Validate and publish property type selector removal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-property-type-qa-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_MAP_ID: ${{ secrets.VITE_GOOGLE_MAPS_MAP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build production bundle
        run: npm exec vite build
        env:
          VITE_BASE_PATH: /Ttest/
      - run: npx playwright install --with-deps chromium
      - name: Test mobile listings filters
        run: npx playwright test tests/mobile-search-results.spec.ts --workers=1
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "QA_DEPLOY_OK url=${{ steps.deployment.outputs.page_url }}"
