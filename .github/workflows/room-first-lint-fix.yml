name: Room-first lint fix

on:
  push:
    branches:
      - feat/room-first-listing-filters
    paths:
      - .github/workflows/room-first-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/room-first-listing-filters
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.1'
      - name: Apply exact Ruff fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/services/listings.py')
          source = path.read_text(encoding='utf-8')
          old = '        return changes[api_name] if api_name in changes else current\n'
          new = '        return changes.get(api_name, current)\n'
          if old not in source:
              raise SystemExit('expected SIM401 target not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          cd backend
          ruff check app/services/listings.py tests/test_room_first_publish_source_contract.py --fix
          ruff check app/services/listings.py tests/test_room_first_publish_source_contract.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/room-first-lint-fix.yml
          git config user.name 'Anton Gameza'
          git config user.email 'antony502189@gmail.com'
          git add backend/app/services/listings.py backend/tests/test_room_first_publish_source_contract.py .github/workflows/room-first-lint-fix.yml
          git commit -m 'fix: satisfy backend lint for room-first guards'
          git push origin HEAD:feat/room-first-listing-filters
