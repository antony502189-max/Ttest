name: Audit Source Snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: audit-source-${{ github.sha }}
          retention-days: 1
          path: |
            src/**
            tests/**
            backend/tests/**
            package.json
            package-lock.json
            playwright.config.ts
            vite.config.ts
            tsconfig*.json
            .github/workflows/**
            docker-compose.yml
