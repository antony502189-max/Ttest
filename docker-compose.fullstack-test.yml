# Only the isolated full-stack audit mounts this provider fixture.
# Production Compose and the published backend image do not include it.
services:
  backend:
    environment:
      APP_ENV: development
      FULLSTACK_TEST_HARNESS: "1"
    volumes:
      - ./scripts/fullstack_test_app.py:/app/fullstack_test_app.py:ro
    command: ["uvicorn", "fullstack_test_app:app", "--host", "0.0.0.0", "--port", "8000"]
