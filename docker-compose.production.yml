name: ttest

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  STORAGE_BACKEND: s3
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_FORCE_PATH_STYLE: "true"
  FRONTEND_APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
  FRONTEND_ORIGINS: https://${APP_DOMAIN},https://www.${APP_DOMAIN}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  AUTO_PUBLISH_LISTINGS: "false"
  METRICS_ENABLED: "true"
  STRUCTURED_LOGS: "true"
  LOG_LEVEL: INFO
  EXTERNAL_IMPORT_ENABLED: ${EXTERNAL_IMPORT_ENABLED:-1}
  EXTERNAL_IMPORT_INTERVAL_SECONDS: ${EXTERNAL_IMPORT_INTERVAL_SECONDS:-7200}
  EXTERNAL_IMPORT_RUN_ON_START: ${EXTERNAL_IMPORT_RUN_ON_START:-1}
  EXTERNAL_IMPORT_SOURCES: ${EXTERNAL_IMPORT_SOURCES:-idealista,fotocasa,milanuncios,pisocompartido,pisos,thinkspain}
  EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS: ${EXTERNAL_IMPORT_REQUEST_TIMEOUT_SECONDS:-25}
  EXTERNAL_IMPORT_MAX_CONCURRENCY_PER_SOURCE: ${EXTERNAL_IMPORT_MAX_CONCURRENCY_PER_SOURCE:-3}
  EXTERNAL_IMPORT_DOWNLOAD_IMAGES: ${EXTERNAL_IMPORT_DOWNLOAD_IMAGES:-1}
  EXTERNAL_IMPORT_USER_AGENT: ${EXTERNAL_IMPORT_USER_AGENT:-112233.es room aggregator}
  EXTERNAL_IMPORT_PLAYWRIGHT_ENABLED: ${EXTERNAL_IMPORT_PLAYWRIGHT_ENABLED:-1}
  EXTERNAL_REMOVAL_CHECK_ENABLED: ${EXTERNAL_REMOVAL_CHECK_ENABLED:-1}
  EXTERNAL_REMOVAL_CHECK_INTERVAL_SECONDS: ${EXTERNAL_REMOVAL_CHECK_INTERVAL_SECONDS:-900}

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ttest}
      POSTGRES_USER: ${POSTGRES_USER:-ttest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ttest} -d ${POSTGRES_DB:-ttest}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done
      mc mb --ignore-existing local/$${S3_BUCKET}
      mc anonymous set none local/$${S3_BUCKET}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    depends_on:
      minio: { condition: service_healthy }

  migrate:
    build: { context: ./backend }
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    profiles: [ops]

  backend:
    build: { context: ./backend }
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  mail-worker:
    build: { context: ./backend }
    restart: unless-stopped
    command: ["python", "-m", "app.commands.outbox_worker"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  external-listings-worker:
    build: { context: ./backend }
    restart: unless-stopped
    command: ["python", "-m", "app.workers.external_listings", "--loop"]
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.external_listings", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_ENABLE_MOCK_MODE: "0"
        VITE_BASE_PATH: /
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_GOOGLE_MAPS_MAP_ID: ${VITE_GOOGLE_MAPS_MAP_ID:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    labels:
      traefik.enable: "true"
      traefik.http.routers.ttest.rule: Host(`${APP_DOMAIN:?APP_DOMAIN is required}`) || Host(`www.${APP_DOMAIN}`)
      traefik.http.routers.ttest.entrypoints: websecure
      traefik.http.routers.ttest.tls: "true"
      traefik.http.routers.ttest.tls.certresolver: letsencrypt
      traefik.http.services.ttest.loadbalancer.server.port: "8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
