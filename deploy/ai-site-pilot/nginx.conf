server {
  listen 8443;
  server_name app.112233.es;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log off;
  client_max_body_size 32k;
  auth_basic "112233 private AI pilot";
  auth_basic_user_file /pilot-auth/htpasswd;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /health { auth_basic off; return 200 'ok'; }
  location = /ai-pilot { return 308 /ai-pilot/; }
  location /ai-pilot/api/ {
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $pilot_backend http://backend:8000;
    # Strip browser HTTP Basic credentials; isolated API uses owned guest tokens.
    proxy_set_header Authorization "";
    proxy_hide_header WWW-Authenticate;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_path /api/v1/ /ai-pilot/api/v1/;
    proxy_read_timeout 25s;
    rewrite ^/ai-pilot/(.*)$ /$1 break;
    proxy_pass $pilot_backend$uri$is_args$args;
  }
  location /ai-pilot/ { try_files $uri $uri/ /ai-pilot/index.html; }
  location / { return 404; }
}
