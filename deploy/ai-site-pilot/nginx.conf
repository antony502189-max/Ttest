geo $realip_remote_addr $pilot_ingress { default 0; __TRAEFIK_IP__ 1; }
map "$request_method:$uri" $pilot_api_allowed {
  default 0;
  ~^GET:/ai-pilot/api/v1/private-demo/status$ 1;
  ~^GET:/ai-pilot/api/v1/ai-search/(capabilities|quota)$ 1;
  "~^GET:/ai-pilot/api/v1/ai-search/(sessions|operations|results)/[0-9a-fA-F-]{36}$" 1;
  ~^POST:/ai-pilot/api/v1/ai-search/(identity|sessions|query)$ 1;
  "~^POST:/ai-pilot/api/v1/ai-search/sessions/[0-9a-fA-F-]{36}/(reset|close|cards|map)$" 1;
  "~^POST:/ai-pilot/api/v1/ai-search/results/[0-9a-fA-F-]{36}/(cards|map)$" 1;
}
server {
  listen 8443;
  server_name app.112233.es;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log off;
  set_real_ip_from __TRAEFIK_IP__;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  client_max_body_size 32k;
  auth_basic "112233 private AI pilot";
  auth_basic_user_file /pilot-auth/htpasswd;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /health { auth_basic off; return 200 'ok'; }
  location = /ai-pilot { if ($pilot_ingress = 0) { return 403; } return 308 /ai-pilot/; }
  location /ai-pilot/api/ {
    if ($pilot_ingress = 0) { return 403; }
    if ($pilot_api_allowed = 0) { return 404; }
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $pilot_backend http://backend:8000;
    # Strip browser HTTP Basic credentials; isolated API uses owned guest tokens.
    proxy_set_header Authorization "";
    proxy_hide_header WWW-Authenticate;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cookie_path /api/v1/ /ai-pilot/api/v1/;
    proxy_read_timeout 25s;
    rewrite ^/ai-pilot/(.*)$ /$1 break;
    proxy_pass $pilot_backend$uri$is_args$args;
  }
  location /ai-pilot/ { if ($pilot_ingress = 0) { return 403; } limit_except GET { deny all; } try_files $uri $uri/ /ai-pilot/index.html; }
  location / { return 404; }
}
