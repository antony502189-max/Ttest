name: ttest-ai-site-pilot-20261108
x-common: &common
  labels: { es.ttest.purpose: ai-site-pilot-20261108 }
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
x-env: &env
  APP_ENV: test
  AI_SITE_PILOT: site-pilot-20261108.v1
  DATABASE_URL: postgresql+asyncpg://ai_demo:${AI_DEMO_DATABASE_PASSWORD:?required}@postgres:5432/ai_text_demo_20261108
  AI_MAINTENANCE_DATABASE_URL: postgresql+asyncpg://ai_demo:${AI_DEMO_DATABASE_PASSWORD:?required}@postgres:5432/ai_text_demo_20261108
  REDIS_URL: redis://redis:6379/0
  FRONTEND_APP_URL: https://app.112233.es
  FRONTEND_ORIGINS: https://app.112233.es
  EXTERNAL_IMPORT_ENABLED: 'false'
  EXTERNAL_REMOVAL_CHECK_ENABLED: 'false'
  JWT_SECRET: ${PILOT_JWT_SECRET:?required}
  AI_ERASURE_JOURNAL_PATH: /demo-state/erasure.sqlite3
  AI_ERASURE_JOURNAL_KEY: ${PILOT_ERASURE_KEY:?required}
  DATABASE_STATEMENT_TIMEOUT_MS: 5000
  DATABASE_LOCK_TIMEOUT_MS: 1000
  DATABASE_POOL_SIZE: 2
  DATABASE_MAX_OVERFLOW: 0
services:
  postgres:
    <<: *common
    image: ttest-private-demo-base-postgres:44126d872ac9
    environment: { POSTGRES_USER: ai_demo, POSTGRES_PASSWORD: '${AI_DEMO_DATABASE_PASSWORD:?required}', POSTGRES_DB: ai_text_demo_20261108 }
    volumes: [ 'pg:/var/lib/postgresql/data' ]
    networks: [internal]
    mem_limit: 512m
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U ai_demo -d ai_text_demo_20261108'], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    <<: *common
    image: ttest-private-demo-base-redis:e7723ff73d96
    command: [redis-server, --save, '60', '1', --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes: [ 'redis:/data' ]
    networks: [internal]
    mem_limit: 96m
    healthcheck: { test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20 }
  backend:
    <<: *common
    build: { context: ../.., dockerfile: deploy/ai-site-pilot/backend.Dockerfile, args: { BASE_IMAGE: 'ttest-private-demo-base-backend:70b1e5b327dd' } }
    image: ttest-ai-site-pilot-backend:20261108
    environment: *env
    volumes: ['state:/demo-state', './private/catalog.json:/demo-input/catalog.json:ro', './control:/pilot-control:ro']
    networks: [internal]
    mem_limit: 768m
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  maintenance:
    <<: *common
    image: ttest-ai-site-pilot-backend:20261108
    environment: *env
    command: [python, -m, app.commands.maintain_ai_search, --loop]
    volumes: ['state:/demo-state']
    networks: [internal]
    mem_limit: 256m
  egress:
    <<: *common
    image: ttest-ai-site-pilot-backend:20261108
    command: [python, -m, pilot.egress]
    networks: [internal, outbound]
    mem_limit: 96m
  frontend:
    <<: *common
    build: { context: ../.., dockerfile: deploy/ai-site-pilot/frontend.Dockerfile, args: { BASE_IMAGE: 'ttest-private-demo-base-frontend:322fbc51b56f' } }
    image: ttest-ai-site-pilot-frontend:20261108
    volumes: ['./private/htpasswd:/pilot-auth/htpasswd:ro']
    networks: [internal, traefik-public]
    ports: ['127.0.0.1:19445:8443']
    mem_limit: 128m
    labels:
      es.ttest.purpose: ai-site-pilot-20261108
      traefik.enable: 'true'
      traefik.docker.network: traefik-public
      traefik.http.routers.ai-site-pilot.rule: Host(`app.112233.es`) && PathPrefix(`/ai-pilot`)
      traefik.http.routers.ai-site-pilot.priority: '100'
      traefik.http.routers.ai-site-pilot.entrypoints: websecure
      traefik.http.routers.ai-site-pilot.tls: 'true'
      traefik.http.routers.ai-site-pilot.tls.certresolver: letsencrypt
      traefik.http.services.ai-site-pilot.loadbalancer.server.port: '8443'
volumes:
  pg: {labels: {es.ttest.purpose: ai-site-pilot-20261108}}
  redis: {labels: {es.ttest.purpose: ai-site-pilot-20261108}}
  state: {labels: {es.ttest.purpose: ai-site-pilot-20261108}}
networks:
  internal: {internal: true}
  outbound: {}
  traefik-public: {external: true}
