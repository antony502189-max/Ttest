server {
  listen 8443;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 64k;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  # Backend isolation does not constrain a viewer's browser. Block third-party
  # image/CDN requests as well; no image crawl/proxy is introduced.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 25s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
