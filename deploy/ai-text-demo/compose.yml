name: ttest-ai-text-demo-20261108
x-demo: &demo
  labels: { es.ttest.purpose: ai-private-text-demo-20261108 }
  restart: unless-stopped
x-env: &env
  APP_ENV: test
  AI_PRIVATE_TEXT_DEMO_APPROVAL: owner-approved-private-text-demo-20261108-v1
  DATABASE_URL: postgresql+asyncpg://ai_demo:${AI_DEMO_DATABASE_PASSWORD:?random demo password required}@postgres:5432/ai_text_demo_20261108
  AI_MAINTENANCE_DATABASE_URL: postgresql+asyncpg://ai_demo:${AI_DEMO_DATABASE_PASSWORD:?random demo password required}@postgres:5432/ai_text_demo_20261108
  AI_DEMO_DATABASE_PASSWORD: ${AI_DEMO_DATABASE_PASSWORD:?random demo password required}
  REDIS_URL: redis://redis:6379/0
  FRONTEND_APP_URL: http://localhost:9444
  FRONTEND_ORIGINS: http://localhost:9444
  EXTERNAL_IMPORT_ENABLED: 'false'
  EXTERNAL_REMOVAL_CHECK_ENABLED: 'false'
  JWT_SECRET: ${DEMO_JWT_SECRET:?independent demo key required}
  AI_ERASURE_JOURNAL_PATH: /demo-state/erasure.sqlite3
  AI_ERASURE_JOURNAL_KEY: ${DEMO_ERASURE_KEY:?independent erasure key required}
  DATABASE_STATEMENT_TIMEOUT_MS: 5000
  DATABASE_LOCK_TIMEOUT_MS: 1000
  DATABASE_POOL_SIZE: 2
  DATABASE_MAX_OVERFLOW: 0
services:
  postgres:
    <<: *demo
    image: ${DEMO_POSTGRES_IMAGE:?existing immutable PostGIS image required}
    environment: { POSTGRES_USER: ai_demo, POSTGRES_PASSWORD: '${AI_DEMO_DATABASE_PASSWORD:?random demo password required}', POSTGRES_DB: ai_text_demo_20261108 }
    volumes: [ 'pg:/var/lib/postgresql/data' ]
    networks: [ internal ]
    mem_limit: 512m
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U ai_demo -d ai_text_demo_20261108'], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    <<: *demo
    image: ${DEMO_REDIS_IMAGE:?existing immutable Redis image required}
    command: [redis-server, --save, '60', '1', --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    volumes: [ 'redis:/data' ]
    networks: [ internal ]
    mem_limit: 96m
    healthcheck: { test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20 }
  backend:
    <<: *demo
    build: { context: ../.., dockerfile: deploy/ai-text-demo/backend.Dockerfile, args: { BASE_IMAGE: '${DEMO_BACKEND_BASE:?existing backend image required}' } }
    image: ttest-private-text-demo:20261108
    environment: *env
    volumes:
      - state:/demo-state
      - ./private/catalog.json:/demo-input/catalog.json:ro
      - ./secrets/deepseek.env:/demo-secrets/deepseek.env:ro
    networks: [ internal, egress ]
    mem_limit: 768m
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  maintenance:
    <<: *demo
    image: ttest-private-text-demo:20261108
    environment: *env
    command: [python, -m, app.commands.maintain_ai_search, --loop]
    volumes: [ 'state:/demo-state' ]
    networks: [ internal ]
    mem_limit: 256m
  frontend:
    <<: *demo
    build: { context: ../.., dockerfile: deploy/ai-text-demo/frontend.Dockerfile, args: { BASE_IMAGE: '${DEMO_FRONTEND_BASE:?existing frontend image required}' } }
    image: ttest-private-text-ui:20261108
    ports: [ '127.0.0.1:19444:8443' ]
    networks: [ internal, egress ]
    mem_limit: 128m
volumes:
  pg: { labels: { es.ttest.purpose: ai-private-text-demo-20261108 } }
  redis: { labels: { es.ttest.purpose: ai-private-text-demo-20261108 } }
  state: { labels: { es.ttest.purpose: ai-private-text-demo-20261108 } }
networks:
  internal: { internal: true }
  egress: {}
