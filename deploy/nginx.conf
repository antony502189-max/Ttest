# Traefik appends the actual peer address to X-Forwarded-For. Keep only the
# right-most address before forwarding to FastAPI so a browser-supplied prefix
# cannot create arbitrary rate-limit identities.
map $http_x_forwarded_for $trusted_client_ip {
  default $remote_addr;
  ~(?<last_forwarded_ip>[^,\s]+)\s*$ $last_forwarded_ip;
}

# Public listing media is immutable at the storage key and is already served
# with a one-hour public Cache-Control policy by FastAPI. Cache only anonymous
# GET responses here to keep repeated image traffic away from Python and MinIO.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:10m max_size=128m inactive=24h use_temp_path=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  # Leave room for multipart framing; FastAPI still enforces the exact 8 MiB
  # file limit after parsing the request.
  client_max_body_size 9m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=()" always;
  # Google Identity Services needs to communicate with its popup window.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location ~ /\.(?!well-known) { deny all; }

  # Public legal documents must work as direct, crawlable URLs without a hash
  # fragment even though the application itself still uses HashRouter.
  location = /privacidad { try_files /privacidad/index.html =404; }
  location = /privacidad/ { try_files /privacidad/index.html =404; }
  location = /terminos { try_files /terminos/index.html =404; }
  location = /terminos/ { try_files /terminos/index.html =404; }

  # Nginx stops inheriting parent add_header directives when a location defines
  # one of its own, so repeat the security headers in cache-specific locations.
  location = /legal.css {
    try_files /legal.css =404;
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location ~ ^/api/v1/media/[0-9a-fA-F-]+$ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    proxy_cache media_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_bypass $http_authorization;
    proxy_no_cache $http_authorization;
  }

  # The browser uses the same public origin; FastAPI remains private on the
  # Compose network and is reached only through this reverse proxy.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
