server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 8m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=()" always;
  # Google Identity Services needs to communicate with its popup window.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  location ~ /\.(?!well-known) { deny all; }
  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The browser uses the same public origin; FastAPI remains private on the
  # Compose network and is reached only through this reverse proxy.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
