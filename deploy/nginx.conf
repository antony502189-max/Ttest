# Traefik appends the actual peer address to X-Forwarded-For. Keep only the
# right-most address before forwarding to FastAPI so a browser-supplied prefix
# cannot create arbitrary rate-limit identities.
map $http_x_forwarded_for $trusted_client_ip {
  default $remote_addr;
  ~(?<last_forwarded_ip>[^,\s]+)\s*$ $last_forwarded_ip;
}

# Apply a stricter budget to state-changing requests without penalising normal
# static navigation. Empty keys are not accounted by limit_req_zone.
map $request_method $write_limit_key {
  default "";
  ~^(POST|PUT|PATCH|DELETE)$ $trusted_client_ip;
}

limit_req_zone $trusted_client_ip zone=api_per_ip:10m rate=30r/s;
limit_req_zone $write_limit_key zone=api_writes_per_ip:10m rate=5r/s;
limit_conn_zone $trusted_client_ip zone=connections_per_ip:10m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Bound slow clients and connection fan-out before they consume application
  # workers. Traefik remains the public TLS edge; these are defence-in-depth.
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  reset_timedout_connection on;
  limit_req_status 429;
  limit_conn_status 429;

  # JSON and form APIs have small schemas. Keep the general body limit low so
  # arbitrary JSON objects cannot consume multi-megabyte buffers or JSONB rows.
  client_max_body_size 256k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=()" always;
  # Google Identity Services needs to communicate with its popup window.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location ~ /\.(?!well-known) { deny all; }

  # Public legal documents must work as direct, crawlable URLs without a hash
  # fragment even though the application itself still uses HashRouter.
  location = /privacidad { try_files /privacidad/index.html =404; }
  location = /privacidad/ { try_files /privacidad/index.html =404; }
  location = /terminos { try_files /terminos/index.html =404; }
  location = /terminos/ { try_files /terminos/index.html =404; }

  # Nginx stops inheriting parent add_header directives when a location defines
  # one of its own, so repeat the security headers in cache-specific locations.
  location = /legal.css {
    try_files /legal.css =404;
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # The favicon has a stable, non-content-hashed URL. Revalidate it instead
  # of pinning a stale icon in browsers for one year.
  location = /favicon.svg {
    try_files /favicon.svg =404;
    expires off;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    try_files $uri =404;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Multipart image uploads alone need room above the exact 8 MiB backend file
  # limit. Keep all other API endpoints on the 256 KiB server-level budget.
  location = /api/v1/uploads {
    client_max_body_size 9m;
    limit_req zone=api_per_ip burst=20 nodelay;
    limit_req zone=api_writes_per_ip burst=10 nodelay;
    limit_conn connections_per_ip 4;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Media visibility changes when a listing is unpublished, expires, or its
  # owner is blocked. Do not use a shared proxy cache without an invalidation
  # mechanism; FastAPI re-checks visibility before every 200/304 response.
  location ~ ^/api/v1/media/[0-9a-fA-F-]+$ {
    limit_req zone=api_per_ip burst=100 nodelay;
    limit_conn connections_per_ip 20;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
  }

  # The browser uses the same public origin; FastAPI remains private on the
  # Compose network and is reached only through this reverse proxy.
  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_req zone=api_writes_per_ip burst=15 nodelay;
    limit_conn connections_per_ip 20;

    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $trusted_client_ip;
    proxy_set_header X-Forwarded-For $trusted_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / { try_files $uri $uri/ /index.html; }
}
