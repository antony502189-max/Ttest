name: ttest-ai-text-lab
x-labels: &labels
  es.ttest.purpose: ai-text-synthetic-lab-v1
  org.opencontainers.image.revision: ${LAB_SOURCE_SHA:?run the launcher}
x-backend: &backend
  image: ttest-ai-text-lab-backend:${LAB_SOURCE_SHA}
  build:
    context: ../..
    dockerfile: deploy/ai-text-lab/backend.Dockerfile
    args:
      BACKEND_BASE: ${LAB_BACKEND_BASE:-ttest-main-audit-backend:7d4c1255}
  labels: *labels
  networks: [lab]
  environment:
    APP_ENV: ai-synthetic-lab
    AI_SYNTHETIC_LAB: ttest-ai-text-lab.synthetic.v1
    DATABASE_URL: postgresql+asyncpg://ai_lab:synthetic-local-only@postgres:5432/ai_text_lab
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: synthetic-lab-auth-independent-key-only-v1
    FRONTEND_APP_URL: https://localhost:9443
    FRONTEND_ORIGINS: https://localhost:9443
    EXTERNAL_IMPORT_ENABLED: "false"
    EXTERNAL_REMOVAL_CHECK_ENABLED: "false"
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    SMTP_HOST: ""
    SENTRY_DSN: ""
    WEB_PUSH_PRIVATE_KEY: ""
    GOOGLE_CLIENT_ID: ""
    DATABASE_STATEMENT_TIMEOUT_MS: "5000"
    DATABASE_POOL_TIMEOUT_SECONDS: "30"
    DATABASE_POOL_SIZE: "5"
    DATABASE_MAX_OVERFLOW: "5"
    DATABASE_LOCK_TIMEOUT_MS: "2000"
    DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: "10000"
    MEDIA_ROOT: /app/var/lab-media
  volumes:
    - media:/app/var/lab-media
    - tls:/lab-tls
services:
  postgres:
    image: mirror.gcr.io/postgis/postgis:16-3.4
    container_name: ttest-ai-text-lab-postgres
    labels: *labels
    environment:
      POSTGRES_USER: ai_lab
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: ai_text_lab
    ports: ["127.0.0.1:55439:5432"]
    volumes:
      - pg:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
    networks: [lab]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_lab -d ai_text_lab"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: mirror.gcr.io/library/redis:7.4-alpine
    container_name: ttest-ai-text-lab-redis
    labels: *labels
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56389:6379"]
    volumes: ["redis:/data"]
    networks: [lab]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  backend:
    <<: *backend
    container_name: ttest-ai-text-lab-backend
    ports: ["127.0.0.1:58089:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  frontend:
    image: ttest-ai-text-lab-frontend:${LAB_SOURCE_SHA}
    container_name: ttest-ai-text-lab-frontend
    labels: *labels
    build:
      context: ../..
      dockerfile: deploy/ai-text-lab/frontend.Dockerfile
      args:
        FRONTEND_BASE: ${LAB_FRONTEND_BASE:-ttest-main-audit-frontend:7d4c1255}
    ports: ["127.0.0.1:9443:8443"]
    volumes: ["tls:/lab-tls:ro"]
    networks: [lab]
    depends_on: [backend]
networks:
  lab:
    name: ttest-ai-text-lab-network
    internal: true
    labels: *labels
volumes:
  pg:
    name: ttest-ai-text-lab-pg-v1
    labels: *labels
  redis:
    name: ttest-ai-text-lab-redis-v1
    labels: *labels
  tls:
    name: ttest-ai-text-lab-tls-v1
    labels: *labels
  media:
    name: ttest-ai-text-lab-media-v1
    labels: *labels
