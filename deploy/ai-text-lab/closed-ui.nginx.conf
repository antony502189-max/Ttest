# Closed LIVE only: authenticated operator certificate, never the ordinary lab.
server {
  listen 8443 ssl;
  server_name localhost;
  ssl_certificate /lab-tls/localhost.crt;
  ssl_certificate_key /lab-tls/localhost.key;
  ssl_client_certificate /closed-ui-access/client-ca.crt;
  ssl_verify_client on;
  ssl_verify_depth 1;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 256k;
  add_header Cache-Control "no-store" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'" always;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # Custodian generates a 256-bit random value in this private include. nginx
    # overwrites any incoming header; backend independently checks the same file.
    include /closed-ui-access/proxy.conf;
    proxy_read_timeout 25s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
