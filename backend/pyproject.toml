[project]
name = "ttest-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "boto3>=1.35",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "geoalchemy2>=0.16",
  "google-auth[requests]>=2.38",
  "httpx>=0.28",
  "Pillow>=11.0",
  "prometheus-client>=0.21",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "PyJWT>=2.10",
  "python-multipart>=0.0.18",
  "redis>=5.2",
  "sentry-sdk[fastapi]>=2.20",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.34"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI declares dependencies in endpoint signatures.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a live PostgreSQL/PostGIS test database",
  "s3: requires a live S3-compatible endpoint"
]
